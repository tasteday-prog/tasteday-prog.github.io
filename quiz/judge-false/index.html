政处罚遵循公正、公开的原则。\n设定和实施行政处罚必须以事实为依据，与违法行为的事实、性质、情节以及社会危害程度相当。\n对违法行为给予行政处罚的规定必须公布；未经公布的，不得作为行政处罚的依据。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"7a1a7ced8c110c07c7c4":{"index":662,"domain":"penalty","topic":"不得以罚代刑","status":"verified","currentAnswer":["F"],"analysis":"认错改正和已行政处罚本身不消灭刑事责任。","references":[{"source":"penalty","article":8,"quote":"第八条\n公民、法人或者其他组织因违法行为受到行政处罚，其违法行为对他人造成损害的，应当依法承担民事责任。\n违法行为构成犯罪，应当依法追究刑事责任的，不得以行政处罚代替刑事处罚。\n第二章　行政处罚的种类和设定"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"43a71dfae12784d7fffe":{"index":663,"domain":"penalty","topic":"行政处罚种类","status":"verified","currentAnswer":["F"],"analysis":"其他种类须法律行政法规规定，泛称法规范围过宽；罚金属于刑罚。","references":[{"source":"penalty","article":9,"quote":"第九条\n行政处罚的种类：\n（一）警告、通报批评；\n（二）罚款、没收违法所得、没收非法财物；\n（三）暂扣许可证件、降低资质等级、吊销许可证件；\n（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；\n（五）行政拘留；\n（六）法律、行政法规规定的其他行政处罚。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"0614332b9fb85fec3dda":{"index":664,"domain":"penalty","topic":"行政处罚种类","status":"verified","currentAnswer":["F"],"analysis":"其他种类须法律行政法规规定，泛称法规范围过宽；罚金属于刑罚。","references":[{"source":"penalty","article":9,"quote":"第九条\n行政处罚的种类：\n（一）警告、通报批评；\n（二）罚款、没收违法所得、没收非法财物；\n（三）暂扣许可证件、降低资质等级、吊销许可证件；\n（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；\n（五）行政拘留；\n（六）法律、行政法规规定的其他行政处罚。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"d31455f2544c32b7cca4":{"index":666,"domain":"penalty","topic":"行政与地方性法规区别","status":"verified","currentAnswer":["F"],"analysis":"泛称法规还包含地方性法规，后者另不得设吊销营业执照，不能统一只排自由。","references":[{"source":"penalty","article":11,"quote":"第十一条\n行政法规可以设定除限制人身自由以外的行政处罚。\n法律对违法行为已经作出行政处罚规定，行政法规需要作出具体规定的，必须在法律规定的给予行政处罚的行为、种类和幅度的范围内规定。\n法律对违法行为未作出行政处罚规定，行政法规为实施法律，可以补充设定行政处罚。拟补充设定行政处罚的，应当通过听证会、论证会等形式广泛听取意见，并向制定机关作出书面说明。行政法规报送备案时，应当说明补充设定行政处罚的情况。"},{"source":"penalty","article":12,"quote":"第十二条\n地方性法规可以设定除限制人身自由、吊销营业执照以外的行政处罚。\n法律、行政法规对违法行为已经作出行政处罚规定，地方性法规需要作出具体规定的，必须在法律、行政法规规定的给予行政处罚的行为、种类和幅度的范围内规定。\n法律、行政法规对违法行为未作出行政处罚规定，地方性法规为实施法律、行政法规，可以补充设定行政处罚。拟补充设定行政处罚的，应当通过听证会、论证会等形式广泛听取意见，并向制定机关作出书面说明。地方性法规报送备案时，应当说明补充设定行政处罚的情况。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"fa549207e3d402ca52ed":{"index":668,"domain":"penalty","topic":"行政法规处罚权限","status":"ambiguous","currentAnswer":[],"analysis":"题中行政性法规为笔误；若指行政法规，原F的意图是其可设吊照，不应排除；若理解可设列举子集，句义又不等于完整权限。保留原F与法条说明。","references":[{"source":"penalty","article":11,"quote":"第十一条\n行政法规可以设定除限制人身自由以外的行政处罚。\n法律对违法行为已经作出行政处罚规定，行政法规需要作出具体规定的，必须在法律规定的给予行政处罚的行为、种类和幅度的范围内规定。\n法律对违法行为未作出行政处罚规定，行政法规为实施法律，可以补充设定行政处罚。拟补充设定行政处罚的，应当通过听证会、论证会等形式广泛听取意见，并向制定机关作出书面说明。行政法规报送备案时，应当说明补充设定行政处罚的情况。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"c3699d05769f54eaf6e8":{"index":670,"domain":"penalty","topic":"部门规章罚款限额","status":"verified","currentAnswer":["F"],"analysis":"部门规章罚款限额由国务院规定，不是全国人大常委会。","references":[{"source":"penalty","article":13,"quote":"第十三条\n国务院部门规章可以在法律、行政法规规定的给予行政处罚的行为、种类和幅度的范围内作出具体规定。\n尚未制定法律、行政法规的，国务院部门规章对违反行政管理秩序的行为，可以设定警告、通报批评或者一定数额罚款的行政处罚。罚款的限额由国务院规定。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"3135dcbb282de2120687":{"index":676,"domain":"penalty","topic":"禁止处罚再委托","status":"verified","currentAnswer":["F"],"analysis":"不得再委托，即使委托机关同意也不能突破法定禁止。","references":[{"source":"penalty","article":20,"quote":"第二十条\n行政机关依照法律、法规、规章的规定，可以在其法定权限内书面委托符合本法第二十一条规定条件的组织实施行政处罚。行政机关不得委托其他组织或者个人实施行政处罚。\n委托书应当载明委托的具体事项、权限、期限等内容。委托行政机关和受委托组织应当将委托书向社会公布。\n委托行政机关对受委托组织实施行政处罚的行为应当负责监督，并对该行为的后果承担法律责任。\n受委托组织在委托范围内，以委托行政机关名义实施行政处罚；不得再委托其他组织或者个人实施行政处罚。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"cb58f777098d37c9b152":{"index":682,"domain":"penalty","topic":"一事不二罚款范围","status":"verified","currentAnswer":["F"],"analysis":"禁止重复罚款不等于不得依法并用不同种类处罚。","references":[{"source":"penalty","article":29,"quote":"第二十九条\n对当事人的同一个违法行为，不得给予两次以上罚款的行政处罚。同一个违法行为违反多个法律规范应当给予罚款处罚的，按照罚款数额高的规定处罚。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"6cee15ac5dfdded518fd":{"index":691,"domain":"penalty","topic":"处罚事先告知时间","status":"verified","currentAnswer":["F"],"analysis":"需在作出决定之前告知，不能决定后才补充代替。","references":[{"source":"penalty","article":44,"quote":"第四十四条\n行政机关在作出行政处罚决定之前，应当告知当事人拟作出的行政处罚内容及事实、理由、依据，并告知当事人依法享有的陈述、申辩、要求听证等权利。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"4530d568b485c9721889":{"index":694,"domain":"penalty","topic":"当场交付决定书","status":"verified","currentAnswer":["F"],"analysis":"决定书当场交付，另报所属机关备案，不是先备案再交付。","references":[{"source":"penalty","article":52,"quote":"第五十二条\n执法人员当场作出行政处罚决定的，应当向当事人出示执法证件，填写预定格式、编有号码的行政处罚决定书，并当场交付当事人。当事人拒绝签收的，应当在行政处罚决定书上注明。\n前款规定的行政处罚决定书应当载明当事人的违法行为，行政处罚的种类和依据、罚款数额、时间、地点，申请行政复议、提起行政诉讼的途径和期限以及行政机关名称，并由执法人员签名或者盖章。\n执法人员当场作出的行政处罚决定，应当报所属行政机关备案。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"513828593483ce6213bd":{"index":695,"domain":"penalty","topic":"当场处罚救济","status":"verified","currentAnswer":["F"],"analysis":"可依法救济，现行当场处罚不服原则先复议后诉讼，并非无救济。","references":[{"source":"penalty","article":53,"quote":"第五十三条\n对当场作出的行政处罚决定，当事人应当依照本法第六十七条至第六十九条的规定履行。\n第三节　普通程序"},{"source":"reconsideration","article":23,"quote":"第二十三条　有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：\n（一）对当场作出的行政处罚决定不服；\n（二）对行政机关作出的侵犯其已经依法取得的自然资源的所有权或者使用权的决定不服；\n（三）认为行政机关存在本法第十一条规定的未履行法定职责情形；\n（四）申请政府信息公开，行政机关不予公开；\n（五）法律、行政法规规定应当先向行政复议机关申请行政复议的其他情形。\n对前款规定的情形，行政机关在作出行政行为时应当告知公民、法人或者其他组织先向行政复议机关申请行政复议。\n第四节　行政复议管辖"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"6b32e34fe05017fde812":{"index":699,"domain":"penalty","topic":"处罚听证费用","status":"verified","currentAnswer":["F"],"analysis":"不得要求当事人承担组织听证费用。","references":[{"source":"penalty","article":63,"quote":"第六十三条\n行政机关拟作出下列行政处罚决定，应当告知当事人有要求听证的权利，当事人要求听证的，行政机关应当组织听证：\n（一）较大数额罚款；\n（二）没收较大数额违法所得、没收较大价值非法财物；\n（三）降低资质等级、吊销许可证件；\n（四）责令停产停业、责令关闭、限制从业；\n（五）其他较重的行政处罚；\n（六）法律、法规、规章规定的其他情形。\n当事人不承担行政机关组织听证的费用。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"4b4f5665f76a31ed8245":{"index":700,"domain":"penalty","topic":"听证主持回避","status":"verified","currentAnswer":["F"],"analysis":"应指定本案调查人员以外人员主持，调查人员不能主持自己案件。","references":[{"source":"penalty","article":64,"quote":"第六十四条\n听证应当依照以下程序组织：\n（一）当事人要求听证的，应当在行政机关告知后五日内提出；\n（二）行政机关应当在举行听证的七日前，通知当事人及有关人员听证的时间、地点；\n（三）除涉及国家秘密、商业秘密或者个人隐私依法予以保密外，听证公开举行；\n（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；\n（五）当事人可以亲自参加听证，也可以委托一至二人代理；\n（六）当事人及其代理人无正当理由拒不出席听证或者未经许可中途退出听证的，视为放弃听证权利，行政机关终止听证；\n（七）举行听证时，调查人员提出当事人违法的事实、证据和行政处罚建议，当事人进行申辩和质证；\n（八）听证应当制作笔录。笔录应当交当事人或者其代理人核对无误后签字或者盖章。当事人或者其代理人拒绝签字或者盖章的，由听证主持人在笔录中注明。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"cfd37ff269c80a933f43":{"index":701,"domain":"penalty","topic":"听证委托代理","status":"ambiguous","currentAnswer":[],"analysis":"原F意在纠正代理人不限律师；但原句也可理解可选择委托律师，作为允许情形并不违法。现行可委托一至二名代理人，保留原答案与措辞歧义。","references":[{"source":"penalty","article":64,"quote":"第六十四条\n听证应当依照以下程序组织：\n（一）当事人要求听证的，应当在行政机关告知后五日内提出；\n（二）行政机关应当在举行听证的七日前，通知当事人及有关人员听证的时间、地点；\n（三）除涉及国家秘密、商业秘密或者个人隐私依法予以保密外，听证公开举行；\n（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；\n（五）当事人可以亲自参加听证，也可以委托一至二人代理；\n（六）当事人及其代理人无正当理由拒不出席听证或者未经许可中途退出听证的，视为放弃听证权利，行政机关终止听证；\n（七）举行听证时，调查人员提出当事人违法的事实、证据和行政处罚建议，当事人进行申辩和质证；\n（八）听证应当制作笔录。笔录应当交当事人或者其代理人核对无误后签字或者盖章。当事人或者其代理人拒绝签字或者盖章的，由听证主持人在笔录中注明。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"537383f8101ac89df60c":{"index":705,"domain":"penalty","topic":"罚缴分离例外","status":"verified","currentAnswer":["F"],"analysis":"法定当场收缴例外存在，不能说任何情况均不得收缴。","references":[{"source":"penalty","article":67,"quote":"第六十七条\n作出罚款决定的行政机关应当与收缴罚款的机构分离。\n除依照本法第六十八条、第六十九条的规定当场收缴的罚款外，作出行政处罚决定的行政机关及其执法人员不得自行收缴罚款。\n当事人应当自收到行政处罚决定书之日起十五日内，到指定的银行或者通过电子支付系统缴纳罚款。银行应当收受罚款，并将罚款直接上缴国库。"},{"source":"penalty","article":68,"quote":"第六十八条\n依照本法第五十一条的规定当场作出行政处罚决定，有下列情形之一，执法人员可以当场收缴罚款：\n（一）依法给予一百元以下罚款的；\n（二）不当场收缴事后难以执行的。"},{"source":"penalty","article":69,"quote":"第六十九条\n在边远、水上、交通不便地区，行政机关及其执法人员依照本法第五十一条、第五十七条的规定作出罚款决定后，当事人到指定的银行或者通过电子支付系统缴纳罚款确有困难，经当事人提出，行政机关及其执法人员可以当场收缴罚款。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"fed19c8dde1d77d6c567":{"index":710,"domain":"penalty","topic":"困难地区当场收缴","status":"verified","currentAnswer":["F"],"analysis":"法定为边远水上交通不便，并非仅山区即满足；须缴纳确难且当事人提出。","references":[{"source":"penalty","article":69,"quote":"第六十九条\n在边远、水上、交通不便地区，行政机关及其执法人员依照本法第五十一条、第五十七条的规定作出罚款决定后，当事人到指定的银行或者通过电子支付系统缴纳罚款确有困难，经当事人提出，行政机关及其执法人员可以当场收缴罚款。"}],"checkedAt":"2026-10-27T00:48:22+08:00"}," t":"2026-10-27T00:48:22+08:00"},"91d6f10b6b9bc11e85d0":{"index":716,"domain":"penalty","topic":"拘留与听证范围","status":"verified","currentAnswer":["F"],"analysis":"行政拘留本身未列本条必须告知听证类别，不能将人身自由处罚自动等同本条听证。","references":[{"source":"penalty","article":63,"quote":"第六十三条\n行政机关拟作出下列行政处罚决定，应当告知当事人有要求听证的权利，当事人要求听证的，行政机关应当组织听证：\n（一）较大数额罚款；\n（二）没收较大数额违法所得、没收较大价值非法财物；\n（三）降低资质等级、吊销许可证件；\n（四）责令停产停业、责令关闭、限制从业；\n（五）其他较重的行政处罚；\n（六）法律、法规、规章规定的其他情形。\n当事人不承担行政机关组织听证的费用。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"c27676595ebd57b29584":{"index":718,"domain":"penalty","topic":"听证公开例外","status":"verified","currentAnswer":["F"],"analysis":"国家秘密商业秘密个人隐私等依法不公开，不是一律公开。","references":[{"source":"penalty","article":64,"quote":"第六十四条\n听证应当依照以下程序组织：\n（一）当事人要求听证的，应当在行政机关告知后五日内提出；\n（二）行政机关应当在举行听证的七日前，通知当事人及有关人员听证的时间、地点；\n（三）除涉及国家秘密、商业秘密或者个人隐私依法予以保密外，听证公开举行；\n（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；\n（五）当事人可以亲自参加听证，也可以委托一至二人代理；\n（六）当事人及其代理人无正当理由拒不出席听证或者未经许可中途退出听证的，视为放弃听证权利，行政机关终止听证；\n（七）举行听证时，调查人员提出当事人违法的事实、证据和行政处罚建议，当事人进行申辩和质证；\n（八）听证应当制作笔录。笔录应当交当事人或者其代理人核对无误后签字或者盖章。当事人或者其代理人拒绝签字或者盖章的，由听证主持人在笔录中注明。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"db9939fda0d19798708f":{"index":721,"domain":"penalty","topic":"处罚决定送达依据","status":"verified","currentAnswer":["F"],"analysis":"不在场七日送达依民事诉讼法而不是行政诉讼法。","references":[{"source":"penalty","article":61,"quote":"第六十一条\n行政处罚决定书应当在宣告后当场交付当事人；当事人不在场的，行政机关应当在七日内依照《中华人民共和国民事诉讼法》的有关规定，将行政处罚决定书送达当事人。\n当事人同意并签订确认书的，行政机关可以采用传真、电子邮件等方式，将行政处罚决定书等送达当事人。"}],"checkedAt":"2026-10-27T00:48:22+08:00"},"4102632754cbe596d4cc":{"index":724,"domain":"penalty","topic":"先行登记保存期限","status":"verified","currentAnswer":["F"],"analysis":"有灭失难取风险经负责人批准可保存，七日内及时处理，不是十日。","references":[{"source":"penalty","article":56,"quote":"第五十六条\n行政机关在收集证据时，可以采取抽样取证的方法；在证据可能灭失或者以后难以取得的情况下，经行政机关负责人批准，可以先行登记保存，并应当在七日内及时作出处理决定，在此期间，当事人或者有关人员不得销毁或者转移证据。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"9958924520e1d0321293":{"index":730,"domain":"penalty","topic":"未成年人处罚年龄","status":"verified","currentAnswer":[ 人事、财务、外事等事项的审批，不适用本法。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"96c77cf2adb5d4bddafa":{"index":745,"domain":"license","topic":"许可信赖保护","status":"verified","currentAnswer":["F"],"analysis":"不能仅凭上级命令擅改生效许可，须符合法定变更撤回事由程序。","references":[{"source":"license","article":8,"quote":"第八条 公民、法人或者其他组织依法取得的行政许可受法律保护，行政机关不得擅自改变已经生效的行政许可。\n\n 行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化的，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可。由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予补偿。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"96f423cdb3e8227b8d01":{"index":746,"domain":"license","topic":"许可撤回补偿与赔偿","status":"verified","currentAnswer":["F"],"analysis":"合法依公共利益变更撤回造成财产损失依法补偿，不是违法国家赔偿。","references":[{"source":"license","article":8,"quote":"第八条 公民、法人或者其他组织依法取得的行政许可受法律保护，行政机关不得擅自改变已经生效的行政许可。\n\n 行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化的，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可。由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予补偿。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"fb2c7fec0852045835d4":{"index":753,"domain":"license","topic":"临时许可满一年","status":"verified","currentAnswer":["F"],"analysis":"满一年需继续须提请制定地方性法规，法条为应当，不是可任意不提请。","references":[{"source":"license","article":15,"quote":"第十五条 本法第十二条所列事项，尚未制定法律、行政法规的，地方性法规可以设定行政许可；尚未制定法律、行政法规和地方性法规的，因行政管理的需要，确需立即实施行政许可的，省、自治区、直辖市人民政府规章可以设定临时性的行政许可。临时性的行政许可实施满一年需要继续实施的，应当提请本级人民代表大会及其常务委员会制定地方性法规。\n\n 地方性法规和省、自治区、直辖市人民政府规章，不得设定应当由国家统一确定的公民、法人或者其他组织的资格、资质的行政许可；不得设定企业或者其他组织的设立登记及其前置性行政许可。其设定的行政许可，不得限制其他地区的个人或者企业到本地区从事生产经营和提供服务，不得限制其他地区的商品进入本地区市场。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"677d5fe9aa4eebc43910":{"index":765,"domain":"license","topic":"受托许可名义","status":"verified","currentAnswer":["F"],"analysis":"受托机关以委托机关名义，不能用自身名义，不得再委托。","references":[{"source":"license","article":24,"quote":"第二十四条 行政机关在其法定职权范围内，依照法律、法规、规章的规定，可以委托其他行政机关实施行政许可。委托机关应当将受委托行政机关和受委托实施行政许可的内容予以公告。\n\n 委托行政机关对受委托行政机关实施行政许可的行为应当负责监督，并对该行为的后果承担法律责任。\n\n 受委托行政机关在委托范围内，以委托行政机关名义实施行政许可；不得再委托其他组织或者个人实施行政许可。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"cd0976575338f207efd7":{"index":773,"domain":"license","topic":"电子邮件申请许可","status":"verified","currentAnswer":["F"],"analysis":"法条明确电子邮件可用，不能一律禁止。","references":[{"source":"license","article":29,"quote":"第二十九条 公民、法人或者其他组织从事特定活动，依法需要取得行政许可的，应当向行政机关提出申请。申请书需要采用格式文本的，行政机关应当向申请人提供行政许可申请书格式文本。申请书格式文本中不得包含与申请行政许可事项没有直接关系的内容。\n\n 申请人可以委托代理人提出行政许可申请。但是，依法应当由申请人到行政机关办公场所提出行政许可申请的除外。\n\n 行政许可申请可以通过信函、电报、电传、传真、电子数据交换和电子邮件等方式提出。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"823ffb1e1426a0781c57":{"index":777,"domain":"license","topic":"申请人真实性与机关核验","status":"verified","currentAnswer":["F"],"analysis":"申请人对实质真实性负责，机关依法审查必要时核实，不能把真实性责任全部转给机关。","references":[{"source":"license","article":31,"quote":"第三十一条 申请人申请行政许可，应当如实向行政机关提交有关材料和反映真实情况，并对其申请材料实质内容的真实性负责。行政机关不得要求申请人提交与其申请的行政许可事项无关的技术资料和其他材料。\n\n 行政机关及其工作人员不得以转让技术作为取得行政许可的条件；不得在实施行政许可的过程中，直接或者间接地要求转让技术。"},{"source":"license","article":34,"quote":"第三十四条 行政机关应当对申请人提交的申请材料进行审查。\n\n 申请人提交的申请材料齐全、符合法定形式，行政机关能够当场作出决定的，应当当场作出书面的行政许可决定。\n\n 根据法定条件和程序，需要对申请材料的实质内容进行核实的，行政机关应当指派两名以上工作人员进行核查。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"cfb049acef777debd9e9":{"index":780,"domain":"license","topic":"层级许可材料转送","status":"verified","currentAnswer":["F"],"analysis":"下级报全部材料，上级不得要求申请人重复提供已提交的申请材料。","references":[{"source":"license","article":35,"quote":"第三十五条 依法应当先经下级行政机关审查后报上级行政机关决定的行政许可，下级行政机关应当在法定期限内将初步审查意见和全部申请材料直接报送上级行政机关。上级行政机关不得要求申请人重复提供申请材料。"}],"checkedAt":"2026-10-27T00:50:10+08:00"},"6741e0ff018abf50d653":{"index":783,"domain":"license","topic":"许可公开范围","status":"ambiguous","currentAnswer":[],"analysis":"原F针对在第四十条擅加例外，但第五条确有国家秘密商业秘密个人隐私保护。应结合两条处理，不能因单独复述缺少隐私或加秘密就给不清楚的统一结论。","references":[{"source":"license","article":5,"quote":"第五条 设定和实施行政许可，应当遵循公开、公平、公正、非歧视的原则。\n\n 有关行政许可的规定应当公布；未经公布的，不得作为实施行政许可的依据。行政许可的实施和结果，除涉及国家秘密、商业秘密或者个人隐私的外，应当公开。未经申请人同意，行政机关及其工作人员、参与专家评审等的人员不得披露申请人提交的商业秘密、未披露信息或者保密商务信息，法律另有规定或者涉及国家安全、重大社会公共利益的除外；行政机关依法公开申请人前述信息的，允许申请人在合理期限内提出异议。\n\n 符合法定条件、标准的，申请人有依法取得行政许可的平等权利，行政机关不得歧视任何人。"},{"source":"license","article":40,"quote":"第四十条 行政机关作出的准予行政许可决定，应当予以公开，公众有权查阅。"}],"checkedAt":"2026 行；执行对象是不动产的，向不动产所在地有管辖权的人民法院申请强制执行。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"5589e0cc52104b91b0d5":{"index":886,"domain":"force","topic":"法院受理强制执行期限","status":"verified","currentAnswer":["F"],"analysis":"接申请五日内受理，不是十日，裁定不受理有相应救济。","references":[{"source":"force","article":56,"quote":"第五十六条　人民法院接到行政机关强制执行的申请，应当在五日内受理。\n行政机关对人民法院不予受理的裁定有异议的，可以在十五日内向上一级人民法院申请复议，上一级人民法院应当自收到复议申请之日起十五日内作出是否受理的裁定。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"bfe9244e94c566ca6aec":{"index":894,"domain":"compensation","topic":"死亡亲属赔偿请求权","status":"verified","currentAnswer":["F"],"analysis":"有扶养关系亲属有请求权，并非无权。","references":[{"source":"compensation","article":6,"quote":"第六条 受害的公民、法人和其他组织有权要求赔偿。\n\n 受害的公民死亡，其继承人和其他有扶养关系的亲属有权要求赔偿。\n\n 受害的法人或者其他组织终止的，其权利承受人有权要求赔偿。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"454a529f64e1b87a87f9":{"index":897,"domain":"compensation","topic":"共同赔偿义务机关","status":"verified","currentAnswer":["F"],"analysis":"共同履职侵权机关为共同义务机关，不能协商只留其中一家；申请可向一家先赔。","references":[{"source":"compensation","article":7,"quote":"第七条 行政机关及其工作人员行使行政职权侵犯公民、法人和其他组织的合法权益造成损害的，该行政机关为赔偿义务机关。\n\n 两个以上行政机关共同行使行政职权时侵犯公民、法人和其他组织的合法权益造成损害的，共同行使行政职权的行政机关为共同赔偿义务机关。\n\n 法律、法规授权的组织在行使授予的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，被授权的组织为赔偿义务机关。\n\n 受行政机关委托的组织或者个人在行使受委托的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，委托的行政机关为赔偿义务机关。\n\n 赔偿义务机关被撤销的，继续行使其职权的行政机关为赔偿义务机关；没有继续行使其职权的行政机关的，撤销该赔偿义务机关的行政机关为赔偿义务机关。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"658824fb7b32c5b4e491":{"index":898,"domain":"compensation","topic":"授权组织赔偿义务","status":"ambiguous","currentAnswer":[],"analysis":"原F以授权与被授权区别为意图，但授权组织可被理解为获得授权组织。完整规则由法律法规授权、实际行使权力的组织赔偿，并非授权的机关，保留原F说明语义。","references":[{"source":"compensation","article":7,"quote":"第七条 行政机关及其工作人员行使行政职权侵犯公民、法人和其他组织的合法权益造成损害的，该行政机关为赔偿义务机关。\n\n 两个以上行政机关共同行使行政职权时侵犯公民、法人和其他组织的合法权益造成损害的，共同行使行政职权的行政机关为共同赔偿义务机关。\n\n 法律、法规授权的组织在行使授予的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，被授权的组织为赔偿义务机关。\n\n 受行政机关委托的组织或者个人在行使受委托的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，委托的行政机关为赔偿义务机关。\n\n 赔偿义务机关被撤销的，继续行使其职权的行政机关为赔偿义务机关；没有继续行使其职权的行政机关的，撤销该赔偿义务机关的行政机关为赔偿义务机关。"}]," 营权；\n（九）认为行政机关滥用行政权力排除或者限制竞争；\n（十）认为行政机关违法集资、摊派费用或者违法要求履行其他义务；\n（十一）申请行政机关履行保护人身权利、财产权利、受教育权利等合法权益的法定职责，行政机关拒绝履行、未依法履行或者不予答复；\n（十二）申请行政机关依法给付抚恤金、社会保险待遇或者最低生活保障等社会保障，行政机关没有依法给付；\n（十三）认为行政机关不依法订立、不依法履行、未按照约定履行或者违法变更、解除政府特许经营协议、土地房屋征收补偿协议等行政协议；\n（十四）认为行政机关在政府信息公开工作中侵犯其合法权益；\n（十五）认为行政机关的其他行政行为侵犯其合法权益。"},{"source":"reconsideration","article":12,"quote":"第十二条　下列事项不属于行政复议范围：\n（一）国防、外交等国家行为；\n（二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令等规范性文件；\n（三）行政机关对行政机关工作人员的奖惩、任免等决定；\n（四）行政机关对民事纠纷作出的调解。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"61747baf4767fa22434c":{"index":978,"domain":"reconsideration","topic":"复议口头申请","status":"verified","currentAnswer":["F"],"analysis":"书写困难可口头，机关记录，不能只准书面。","references":[{"source":"reconsideration","article":22,"quote":"第二十二条　申请人申请行政复议，可以书面申请；书面申请有困难的，也可以口头申请。\n书面申请的，可以通过邮寄或者行政复议机关指定的互联网渠道等方式提交行政复议申请书，也可以当面提交行政复议申请书。行政机关通过互联网渠道送达行政行为决定书的，应当同时提供提交行政复议申请书的互联网渠道。\n口头申请的，行政复议机关应当当场记录申请人的基本情况、行政复议请求、申请行政复议的主要事实、理由和时间。\n申请人对两个以上行政行为不服的，应当分别申请行政复议。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"fa6ae6d592b1ff09aa40":{"index":985,"domain":"reconsideration-regulation","topic":"共同机关复议管辖","status":"ambiguous","currentAnswer":[],"analysis":"原F按旧共同上一级理解，现行有共同国务院部门、垂直与其他机关共同作出的特别规则，须具体识别，不能用其中一机关上一级概括全部。","references":[{"source":"reconsideration-regulation","article":32,"quote":"第三十二条\n对两个以上国务院部门共同作出的行政行为不服的，依照行政复议法第二十五条的规定，可以向其中任何一个国务院部门申请行政复议，由作出行政行为的国务院部门共同作出行政复议决定。\n对海关、金融、外汇管理等实行垂直领导的行政机关、税务机关、国家安全机关与其他行政机关共同作出的行政行为不服的，可以向其中一个有管辖权的行政复议机关申请行政复议，由有管辖权的行政复议机关共同作出行政复议决定。"},{"source":"reconsideration","article":24,"quote":"第二十四条　县级以上地方各级人民政府管辖下列行政复议案件：\n（一）对本级人民政府工作部门作出的行政行为不服的；\n（二）对下一级人民政府作出的行政行为不服的；\n（三）对本级人民政府依法设立的派出机关作出的行政行为不服的；\n（四）对本级人民政府或者其工作部门管理的法律、法规、规章授权的组织作出的行政行为不服的。\n除前款规定外，省、自治区、直辖市人民政府同时管辖对本机关作出的行政行为不服的行政复议案件。\n省、自治区人民政府依法设立的派出机关参照设区的市级人民政府的职责权限，管辖相关行政复议案件。\n对县级以上地方各级人民政府工作部门依法设立的派出机构依照法律、法规、规章规定，以派出机构的名义作出的行政行为不服的行政复议案件，由本级人民政府管辖；其中，对直辖市、设区的市人民政府工作部门按照行政区划设立的派出机构作出的行政行为不服的，也可以由其所在地的人民政府管辖。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"388fa77d5281714cece9":{"index":986,"domain":"reconsideration","topic":"复议诉讼不并行","status":"verified","currentAnswer":["F"],"analysis":"复议已依法受理期间不得再对同一争议同时诉讼，法定逾期不作为救济另论。","references":[{"source":"reconsideration","article":29,"quote":"第二十九条　公民、法人或者其他组织申请行政复议，行政复议机关已经依法受理的，在行政复议期间不得向人民法院提起行政诉讼。\n公民、法人或者其他组织向人民法院提起行政诉讼，人民法院已经依法受理的，不得申请行政复议。\n第三章　行政复议受理"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"3c38b44f434fd836402f":{"index":995,"domain":"reconsideration","topic":"复议撤回非中止","status":"verified","currentAnswer":["F"],"analysis":"获准撤回对应终止而非中止，且撤回须依法准许。","references":[{"source":"reconsideration","article":41,"quote":"第四十一条　行政复议期间有下列情形之一的，行政复议机关决定终止行政复议：\n（一）申请人撤回行政复议申请，行政复议机构准予撤回；\n（二）作为申请人的公民死亡，没有近亲属或者其近亲属放弃行政复议权利；\n（三）作为申请人的法人或者其他组织终止，没有权利义务承受人或者其权利义务承受人放弃行政复议权利；\n（四）申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因同一违法行为涉嫌犯罪，被采取刑事强制措施；\n（五）依照本法第三十九条第一款第一项、第二项、第四项的规定中止行政复议满六十日，行政复议中止的原因仍未消除。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"01b8e3454b6ad216988e":{"index":999,"domain":"reconsideration","topic":"未提赔偿也应返还","status":"verified","currentAnswer":["F"],"analysis":"未提出赔偿请求，不妨碍复议机关依法责令返还财产解除措施或赔相应价款。","references":[{"source":"reconsideration","article":72,"quote":"第七十二条　申请人在申请行政复议时一并提出行政赔偿请求，行政复议机关对依照《中华人民共和国国家赔偿法》的有关规定应当不予赔偿的，在作出行政复议决定时，应当同时决定驳回行政赔偿请求；对符合《中华人民共和国国家赔偿法》的有关规定应当给予赔偿的，在决定撤销或者部分撤销、变更行政行为或者确认行政行为违法、无效时，应当同时决定被申请人依法给予赔偿；确认行政行为违法的，还可以同时责令被申请人采取补救措施。\n申请人在申请行政复议时没有提出行政赔偿请求的，行政复议机关在依法决定撤销或者部分撤销、变更罚款，撤销或者部分撤销违法集资、没收财物、征收征用、摊派费用以及对财产的查封、扣押、冻结等行政行为时，应当同时责令被申请人返还财产，解除对财产的查封、扣押、冻结措施，或者赔偿相应的价款。"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"8545d2860771223e7400":{"index":1000,"domain":"reconsideration","topic":"自然资源复议前置","status":"verified","currentAnswer":["F"],"analysis":"已依法取得所有权使用权受侵犯依法先复议，非任意直接诉讼。","references":[{"source":"reconsideration","article":23,"quote":"第二十三条　有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：\n（一）对当场作出的行政处罚决定不服；\n（二）对行政机关作出的侵犯其已经依法取得的自然资源的所有权或者使用权的决定不服；\n（三）认为行政机关存在本法第十一条规定的未履行法定职责情形；\n（四）申请政府信息公开，行政机关不予公开；\n（五）法律、行政法规规定应当先向行政复议机关申请行政复议的其他情形。\n对前款规定的情形，行政机关在作出行政行为时应当告知公民、法人或者其他组织先向行政复议机关申请行政复议。\n第四节　行政复议管辖"}],"checkedAt":"2026-10-27T00:52:22+08:00"},"c2ae4a317543cdb7ba59":{"index":1004,"domain":"reconsideration","topic":"复议不收费","status":"verified","currentAnswer":["F"],"analysis":"不得收取任何费用，工本费也不得收。","references":[{"source":"reconsideration","article":87,"quote":"第八十七条　行政复议机关受理行政复议申请，不得向申请人收取任何费用。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"df309e9a75f8d30ee885":{"index":1007,"domain":"reconsideration","topic":"复议短期间非自然日","status":"verified","currentAnswer":["F"],"analysis":"五日七日为工作日，不含法定休假日。","references":[{"source":"reconsideration","article":88,"quote":"第八十八条　行政复议期间的计算和行政复议文书的送达，本法没有规定的，依照《中华人民共和国民事诉讼法》关于期间、送达的规定执行。\n本法关于行政复议期间有关“三日”、“五日”、“七日”、“十日”的规定是指工作日，不含法定休假日。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"2457fb21cd4db8502442":{"index":1009,"domain":"reconsideration","topic":"第三人不参加不阻复议","status":"verified","currentAnswer":["F"],"analysis":"第三人不参加不影响审理。","references":[{"source":"reconsideration","article":16,"quote":"第十六条　申请人以外的同被申请行政复议的行政行为或者行政复议案件处理结果有利害关系的公民、法人或者其他组织，可以作为第三人申请参加行政复议，或者由行政复议机构通知其作为第三人参加行政复议。\n第三人不参加行政复议，不影响行政复议案件的审理。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"c4f5402b1a5649df66fa":{"index":1011,"domain":"reconsideration-regulation","topic":"其他组织非共同被申请人","status":"verified","currentAnswer":["F"],"analysis":"机关与非授权其他组织共同行为，仅机关为被申请人，其他组织可第三人。","references":[{"source":"reconsideration-regulation","article":20,"quote":"第二十条\n行政机关与法律、法规、规章授权的组织以共同的名义作出同一行政行为的，共同作出行政行为的行政机关和法律、法规、规章授权的组织为共同被申请人。\n行政机关与其他组织以共同名义作出同一行政行为的，行政机关为被申请人，其他组织可以作为第三人参加行政复议。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"778e488ed62fa4eca873":{"index":1014,"domain":"reconsideration","topic":"书面复议多种提交","status":"verified","currentAnswer":["F"],"analysis":"可邮寄指定互联网渠道或当面，并非只准当面。","references":[{"source":"reconsideration","article":22,"quote":"第二十二条　申请人申请行政复议，可以书面申请；书面申请有困难的，也可以口头申请。\n书面申请的，可以通过邮寄或者行政复议机关指定的互联网渠道等方式提交行政复议申请书，也可以当面提交行政复议申请书。行政机关通过互联网渠道送达行政行为决定书的，应当同时提供提交行政复议申请书的互联网渠道。\n口头申请的，行政复议机关应当当场记录申请人的基本情况、行政复议请求、申请行政复议的主要事实、理由和时间。\n申请人对两个以上行政行为不服的，应当分别申请行政复议。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"ce844a2070fa795c15ed":{"index":1016,"domain":"reconsideration-regulation","topic":"错列被申请人先变更","status":"verified","currentAnswer":["F"],"analysis":"应告知变更，拒不变更或变更后仍不合才不予受理。","references":[{"source":"reconsideration-regulation","article":29,"quote":"第二十九条\n申请人提出行政复议申请时错列被申请人的，行政复议机构应当告知申请人变更被申请人。申请人不同意变更或者变更后所列被申请人仍不符合规定的，行政复议机关决定不予受理并说明理由。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"2659a76591d08db5e9aa":{"index":1021,"domain":"reconsideration-regulation","topic":"复议鉴定费用","status":"verified","currentAnswer":["F"],"analysis":"依法申请委托鉴定，费用由当事人承担，不是财政一律承担。","references":[{"source":"reconsideration-regulation","article":46,"quote":"第四十六条\n行政复议期间涉及专门事项需要鉴定的，当事人可以申请行政复议机构委托鉴定机构进行鉴定。行政复议机构审查同意的，组织当事人协商确定具备相应资格的鉴定机构；协商不成的，由行政复议机构指定。鉴定费用由当事人承担。鉴定所用时间不计入行政复议审理期限。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"57ccda5ce7b5ce232798":{"index":1023,"domain":"reconsideration","topic":"复议期间改变原行为","status":"verified","currentAnswer":["F"],"analysis":"改变原违法行为且仍要求确认等可继续审查，不当然终止。","references":[{"source":"reconsideration","article":65,"quote":"第六十五条　行政行为有下列情形之一的，行政复议机关不撤销该行政行为，但是确认该行政行为违法：\n（一）依法应予撤销，但是撤销会给国家利益、社会公共利益造成重大损害；\n（二）程序轻微违法，但是对申请人权利不产生实际影响。\n行政行为有下列情形之一，不需要撤销或者责令履行的，行政复议机关确认该行政行为违法：\n（一）行政行为违法，但是不具有可撤销内容；\n（二）被申请人改变原违法行政行为，申请人仍要求撤销或者确认该行政行为违法；\n（三）被申请人不履行或者拖延履行法定职责，责令履行没有意义。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"aa428a02ef3275865518":{"index":1024,"domain":"reconsideration","topic":"申请人下落不明中止","status":"verified","currentAnswer":["F"],"analysis":"下落不明为中止不是直接终止。","references":[{"source":"reconsideration","article":39,"quote":"第三十九条　行政复议期间有下列情形之一的，行政复议中止：\n（一）作为申请人的公民死亡，其近亲属尚未确定是否参加行政复议；\n（二）作为申请人的公民丧失参加行政复议的行为能力，尚未确定法定代理人参加行政复议；\n（三）作为申请人的公民下落不明；\n（四）作为申请人的法人或者其他组织终止，尚未确定权利义务承受人；\n（五）申请人、被申请人因不可抗力或者其他正当理由，不能参加行政复议；\n（六）依照本法规定进行调解、和解，申请人和被申请人同意中止；\n（七）行政复议案件涉及的法律适用问题需要有权机关作出解释或者确认；\n（八）行政复议案件审理需要以其他案件的审理结果为依据，而其他案件尚未审结；\n（九）有本法第五十六条或者第五十七条规定的情形；\n（十）需要中止行政复议的其他情形。\n行政复议中止的原因消除后，应当及时恢复行政复议案件的审理。\n行政复议机关中止、恢复行政复议案件的审理，应当书面告知当事人。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"56a67977b174a374de6a":{"index":1028,"domain":"reconsideration","topic":"其他行为刑事不当然终止","status":"verified","currentAnswer":["F"],"analysis":"本条要求同一违法行为，不是另案涉嫌犯罪即终止。","references":[{"source":"reconsideration","article":41,"quote":"第四十一条　行政复议期间有下列情形之一的，行政复议机关决定终止行政复议：\n（一）申请人撤回行政复议申请，行政复议机构准予撤回；\n（二）作为申请人的公民死亡，没有近亲属或者其近亲属放弃行政复议权利；\n（三）作为申请人的法人或者其他组织终止，没有权利义务承受人或者其权利义务承受人放弃行政复议权利；\n（四）申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因同一违法行为涉嫌犯罪，被采取刑事强制措施；\n（五）依照本法第三十九条第一款第一项、第二项、第四项的规定中止行政复议满六十日，行政复议中止的原因仍未消除。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"513ee88ca992a06f5421":{"index":1036,"domain":"reconsideration","topic":"禁止不利变更","status":"verified","currentAnswer":["F"],"analysis":"原则不得对申请人更不利变更，第三人相反请求法定例外，不能任意从请求范围推导可加重。","references":[{"source":"reconsideration","article":63,"quote":"第六十三条　行政行为有下列情形之一的，行政复议机关决定变更该行政行为：\n（一）事实清楚，证据确凿，适用依据正确，程序合法，但是内容不适当；\n（二）事实清楚，证据确凿，程序合法，但是未正确适用依据；\n（三）事实不清、证据不足，经行政复议机关查清事实和证据。\n行政复议机关不得作出对申请人更为不利的变更决定，但是第三人提出相反请求的除外。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"0c8b10c4c458513f705a":{"index":1048,"domain":"litigation","topic":"国家抽象内部终局排除","status":"verified","currentAnswer":["F"],"analysis":"国防外交、制定普遍规范、内部奖惩任免、法律明确终局行为不能按普通行政争议直接起诉，附带审查另依规定。","references":[{"source":"litigation","article":13,"quote":"第十三条 人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n\n （一）国防、外交等国家行为；\n\n （二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；\n\n （三）行政机关对行政机关工作人员的奖惩、任免等决定；\n\n （四）法律规定由行政机关最终裁决的行政行为。\n\n第三章 管 辖"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"e992687502f3a5449f01":{"index":1049,"domain":"litigation","topic":"国家抽象内部终局排除","status":"verified","currentAnswer":["F"],"analysis":"国防外交、制定普遍规范、内部奖惩任免、法律明确终局行为不能按普通行政争议直接起诉，附带审查另依规定。","references":[{"source":"litigation","article":13,"quote":"第十三条 人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n\n （一）国防、外交等国家行为；\n\n （二）行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令；\n\n （三）行政机关对行政机关工作人员的奖惩、任免等决定；\n\n （四）法律规定由行政机关最终裁决的行政行为。\n\n第三章 管 辖"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"dde73a433e41ba230367": 的公民死亡，其近亲属可以提起诉讼。\n\n 有权提起诉讼的法人或者其他组织终止，承受其权利的法人或者其他组织可以提起诉讼。\n\n 人民检察院在履行职责中发现生态环境和资源保护、食品药品安全、国有财产保护、国有土地使用权出让等领域负有监督管理职责的行政机关违法行使职权或者不作为，致使国家利益或者社会公共利益受到侵害的，应当向行政机关提出检察建议，督促其依法履行职责。行政机关不依法履行职责的，人民检察院依法向人民法院提起诉讼。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"e601a66e0afe0d511c07":{"index":1072,"domain":"litigation","topic":"利害关系人角色","status":"verified","currentAnswer":["F"],"analysis":"有条件可作为原告，未起诉而申请或法院通知可第三人，不是只能第三人。","references":[{"source":"litigation","article":25,"quote":"第二十五条 行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。\n\n 有权提起诉讼的公民死亡，其近亲属可以提起诉讼。\n\n 有权提起诉讼的法人或者其他组织终止，承受其权利的法人或者其他组织可以提起诉讼。\n\n 人民检察院在履行职责中发现生态环境和资源保护、食品药品安全、国有财产保护、国有土地使用权出让等领域负有监督管理职责的行政机关违法行使职权或者不作为，致使国家利益或者社会公共利益受到侵害的，应当向行政机关提出检察建议，督促其依法履行职责。行政机关不依法履行职责的，人民检察院依法向人民法院提起诉讼。"},{"source":"litigation","article":29,"quote":"第二十九条 公民、法人或者其他组织同被诉行政行为有利害关系但没有提起诉讼，或者同案件处理结果有利害关系的，可以作为第三人申请参加诉讼，或者由人民法院通知参加诉讼。\n\n 人民法院判决第三人承担义务或者减损第三人权益的，第三人有权依法提起上诉。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"e7367a012644450dd019":{"index":1075,"domain":"litigation","topic":"诉讼委托人数","status":"verified","currentAnswer":["F"],"analysis":"可委托一至二人，不是二至三人。","references":[{"source":"litigation","article":31,"quote":"第三十一条 当事人、法定代理人，可以委托一至二人作为诉讼代理人。\n\n 下列人员可以被委托为诉讼代理人：\n\n （一）律师、基层法律服务工作者；\n\n （二）当事人的近亲属或者工作人员；\n\n （三）当事人所在社区、单位以及有关社会团体推荐的公民。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"3463de023deb7375db18":{"index":1079,"domain":"litigation","topic":"原告仍有相应举证","status":"verified","currentAnswer":["F"],"analysis":"不作为提出申请、赔偿损失等有相应举证，不是只有被告。","references":[{"source":"litigation","article":38,"quote":"第三十八条 在起诉被告不履行法定职责的案件中，原告应当提供其向被告提出申请的证据。但有下列情形之一的除外：\n\n （一）被告应当依职权主动履行法定职责的；\n\n （二）原告因正当理由不能提供证据的。\n\n 在行政赔偿、补偿的案件中，原告应当对行政行为造成的损害提供证据。因被告的原因导致原告无法举证的，由被告承担举证责任。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"e6c7515aeb1628f85b7f":{"index":1082,"domain":"litigation","topic":"复议前置与选择","status":"verified","currentAnswer":["F"],"analysis":"有选择复议诉讼和法定前置等不同类型，不能一概自由选或一概必须先复议。","references":[{"source":"litigation","article":44,"quote":"第四十四条 对属于人民法院受案范围的行政案件，公民、法人或者其他组织可以先向行政机关申请复议，对复议决定不服的，再向人民法院提起诉讼；也可以直接向人民法院提起诉讼。\n\n 法律、法规规定应当先向行政机关申请复议，对复议决定不服再向人民法院提起诉讼的，依照法律、法规的规定。"},{"source":"reconsideration","article":23,"quote":"第二十三条　有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：\n（一）对当场作出的行政处罚决定不服；\n（二）对行政机关作出的侵犯其已经依法取得的自然资源的所有权或者使用权的决定不服；\n（三）认为行政机关存在本法第十一条规定的未履行法定职责情形；\n（四）申请政府信息公开，行政机关不予公开；\n（五）法律、行政法规规定应当先向行政复议机关申请行政复议的其他情形。\n对前款规定的情形，行政机关在作出行政行为时应当告知公民、法人或者其他组织先向行政复议机关申请行政复议。\n第四节　行政复议管辖"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"736cd3c43e1ee7b12089":{"index":1083,"domain":"litigation","topic":"复议前置与选择","status":"verified","currentAnswer":["F"],"analysis":"有选择复议诉讼和法定前置等不同类型，不能一概自由选或一概必须先复议。","references":[{"source":"litigation","article":44,"quote":"第四十四条 对属于人民法院受案范围的行政案件，公民、法人或者其他组织可以先向行政机关申请复议，对复议决定不服的，再向人民法院提起诉讼；也可以直接向人民法院提起诉讼。\n\n 法律、法规规定应当先向行政机关申请复议，对复议决定不服再向人民法院提起诉讼的，依照法律、法规的规定。"},{"source":"reconsideration","article":23,"quote":"第二十三条　有下列情形之一的，申请人应当先向行政复议机关申请行政复议，对行政复议决定不服的，可以再依法向人民法院提起行政诉讼：\n（一）对当场作出的行政处罚决定不服；\n（二）对行政机关作出的侵犯其已经依法取得的自然资源的所有权或者使用权的决定不服；\n（三）认为行政机关存在本法第十一条规定的未履行法定职责情形；\n（四）申请政府信息公开，行政机关不予公开；\n（五）法律、行政法规规定应当先向行政复议机关申请行政复议的其他情形。\n对前款规定的情形，行政机关在作出行政行为时应当告知公民、法人或者其他组织先向行政复议机关申请行政复议。\n第四节　行政复议管辖"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"7843a3f3d0c38ac5747f":{"index":1089,"domain":"litigation","topic":"公开审判例外","status":"verified","currentAnswer":["F"],"analysis":"秘密隐私法律规定及商业秘密依法申请等可不公开，非所有都公开。","references":[{"source":"litigation","article":54,"quote":"第五十四条 人民法院公开审理行政案件，但涉及国家秘密、个人隐私和法律另有规定的除外。\n\n 涉及商业秘密的案件，当事人申请不公开审理的，可以不公开审理。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"831a959440a945b5d407":{"index":1091,"domain":"litigation","topic":"行政简易独任","status":"conflict","currentAnswer":["T"],"analysis":"原F已过时，现行简易程序由一名审判员独任，不能再说行政案件一律合议。","references":[{"source":"litigation","article":83,"quote":"第八十三条 适用简易程序审理的行政案件，由审判员一人独任审理，并应当在立案之日起四十五日内审结。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"760a7e8b674e5ccbfa6d":{"index":1095,"domain":"litigation","topic":"回避不服非上诉","status":"verified","currentAnswer":["F"],"analysis":"回避决定不服申请复议一次，不是上诉。","references":[{"source":"litigation","article":55,"quote":"第五十五条 当事人认为审判人员与本案有利害关系或者有其他关系可能影响公正审判，有权申请审判人员回避。\n\n 审判人员认为自己与本案有利害关系或者有其他关系，应当申请回避。\n\n 前两款规定，适用于书记员、翻译人员、鉴定人、勘验人。\n\n 院长担任审判长时的回避，由审判委员会决定；审判人员的回避，由院长决定；其他人员的回避，由审判长决定。当事人对决定不服的，可以申请复议一次。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"dffdf12ffbdfdbdb232d":{"index":1102,"domain":"litigation","topic":"合法行为驳回请求","status":"conflict","currentAnswer":["T"],"analysis":"原F沿旧维持判决口径，现行符合法定合法条件判驳回诉讼请求；驳请求与驳起诉不同，原题驳回用语不完整亦提示。","references":[{"source":"litigation","article":69,"quote":"第六十九条 行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决驳回原告的诉讼请求。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"d6fd9c6ce408a7bedb04":{"index":1107,"domain":"litigation","topic":"重作行为限制","status":"ambiguous","currentAnswer":[],"analysis":"原F可能以同样与同一词差为考点，二者普通语义重叠。完整规则不得同一事实理由重作基本相同行为，因程序违法撤销例外按司法解释处理，不按词差判错。","references":[{"source":"litigation","article":71,"quote":"第七十一条 人民法院判决被告重新作出行政行为的，被告不得以同一的事实和理由作出与原行政行为基本相同的行政行为。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"1fa359362a6fcb074572":{"index":1110,"domain":"litigation","topic":"重审后可上诉","status":"verified","currentAnswer":["F"],"analysis":"重审第一审裁判可依法上诉，二审不得再次发回重审规则不等于禁止上诉。","references":[{"source":"litigation","article":89,"quote":"第八十九条 人民法院审理上诉案件，按照下列情形，分别处理：\n\n （一）原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定；\n\n （二）原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更；\n\n （三）原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判；\n\n （四）原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n\n 原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n\n 人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。\n\n 第五节 审判监督程序"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"b1aa85e2bb7177dc59f2":{"index":1111,"domain":"litigation","topic":"再审申请不当然停止","status":"verified","currentAnswer":["F"],"analysis":"申请再审原则向上一级法院，提出不停止原裁判执行，依法裁定另论。","references":[{"source":"litigation","article":90,"quote":"第九十条 当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"fdcce3c8487e15566b11":{"index":1117,"domain":"litigation","topic":"涉外诉讼律师","status":"verified","currentAnswer":["F"],"analysis":"委托律师应为中国律师机构律师，外国驻华机构或使馆同意不替代资格。","references":[{"source":"litigation","article":100,"quote":"第一百条 外国人、无国籍人、外国组织在中华人民共和国进行行政诉讼，委托律师代理诉讼的，应当委托中华人民共和国律师机构的律师。\n\n 第十章 附 则"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"c194627679627e839968":{"index":1118,"domain":"litigation","topic":"诉讼费用","status":"verified","currentAnswer":["F"],"analysis":"依法收诉讼费，免缓减依条件，不等同复议免费。","references":[{"source":"litigation","article":102,"quote":"第一百零二条 人民法院审理行政案件，应当收取诉讼费用。诉讼费用由败诉方承担，双方都有责任的由双方分担。收取诉讼费用的具体办法另行规定。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"11f70618fce7e56ca5d8":{"index":1121,"domain":"litigation-interpretation","topic":"行政指导不在受案范围","status":"verified","currentAnswer":["F"],"analysis":"无强制效果的行政指导原则不属受案，不能仅看名称掩盖实质强制行为。","references":[{"source":"litigation-interpretation","article":1,"quote":"第一条公民、法人或者其他组织对行政机关及其工作人员的行政行为不服，依法提起诉讼的，属于人民法院行政诉讼的受案范围。\n下列行为不属于人民法院行政诉讼的受案范围：\n（一）公安、国家安全等机关依照刑事诉讼法的明确授权实施的行为；\n（二）调解行为以及法律规定的仲裁行为；\n（三）行政指导行为；\n（四）驳回当事人对行政行为提起申诉的重复处理行为；\n（五）行政机关作出的不产生外部法律效力的行为；\n(六\n)\n行政机关为作出行政行为而实施的准备、论证、研究、层报、咨询等过程性行为；\n（七）行政机关根据人民法院的生效裁判、协助执行通知书作出的执行行为，但行政机关扩大执行范围或者采取违法方式实施的除外；\n（八）上级行政机关基于内部层级监督关系对下级行政机关作出的听取报告、执法检查、督促履责等行为；\n（九）行政机关针对信访事项作出的登记、受理、交办、转送、复查、复核意见等行为；\n（十）对公民、法人或者其他组织权利义务不产生实际影响的行为。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"98a6bde55676222d65b7":{"index":1138,"domain":"litigation-interpretation","topic":"公司治理机构起诉名义","status":"verified","currentAnswer":["F"],"analysis":"应以企业名义，不是股东大会董事会自己的名义。","references":[{"source":"litigation-interpretation","article":16,"quote":"第十六条股份制企业的股东大会、股东会、董事会等认为行政机关作出的行政行为侵犯企业经营自主权的，可以企业名义提起诉讼。\n联营企业、中外合资或者合作企业的联营、合资、合作各方，认为联营、合资、合作企业权益或者自己一方合法权益受行政行为侵害的，可以自己的名义提起诉讼。\n非国有企业被行政机关注销、撤销、合并、强令兼并、出售、分立或者改变企业隶属关系的，该企业或者其法定代表人可以提起诉讼。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"4eeb49cc07dae2c62511":{"index":1140,"domain":"litigation-interpretation","topic":"非一律上级批准机关被告","status":"verified","currentAnswer":["F"],"analysis":"须看对外署名，不是只看上级批准。","references":[{"source":"litigation-interpretation","article":19,"quote":"第十九条当事人不服经上级行政机关批准的行政行为，向人民法院提起诉讼的，以在对外发生法律效力的文书上署名的机关为被告。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"e8d3ba2599715a9f5e0a":{"index":1145,"domain":"litigation","topic":"复议逾期诉原行为","status":"verified","currentAnswer":["F"],"analysis":"针对原行为诉应为原机关，不是复议机关；诉请对象决定被告。","references":[{"source":"litigation","article":26,"quote":"第二十六条 公民、法人或者其他组织直接向人民法院提起诉讼的，作出行政行为的行政机关是被告。\n\n 经复议的案件，复议机关决定维持原行政行为的，作出原行政行为的行政机关和复议机关是共同被告；复议机关改变原行政行为的，复议机关是被告。\n\n 复议机关在法定期限内未作出复议决定，公民、法人或者其他组织起诉原行政行为的，作出原行政行为的行政机关是被告；起诉复议机关不作为的，复议机关是被告。\n\n 两个以上行政机关作出同一行政行为的，共同作出行政行为的行政机关是共同被告。\n\n 行政机关委托的组织所作的行政行为，委托的行政机关是被告。\n\n 行政机关被撤销或者职权变更的，继续行使其职权的行政机关是被告。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"70ff4f733b0fb95ab680":{"index":1152,"domain":"litigation","topic":"保管不善非正当补证","status":"verified","currentAnswer":["F"],"analysis":"自身保管失误不当然成为法定延期补证正当事由。","references":[{"source":"litigation","article":36,"quote":"第三十六条 被告在作出行政行为时已经收集了证据，但因不可抗力等正当事由不能提供的，经人民法院准许，可以延期提供。\n\n 原告或者第三人提出了其在行政处理程序中没有提出的理由或者证据的，经人民法院准许，被告可以补充证据。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"19000fc5b92d116f1e5c":{"index":1155,"domain":"litigation-interpretation","topic":"复议依法补证与诉中自行取证","status":"conflict","currentAnswer":["T"],"analysis":"原F概括否定复议补证不符现行解释。复议机关作共同被告时，在复议程序中依法收集和补充的证据，可以作为认定复议决定和原行政行为合法的依据；区别被告诉讼期间违法自行取证。原题维持措辞也沿旧判决名称。","references":[{"source":"litigation-interpretation","article":135,"quote":"第一百三十五条复议机关决定维持原行政行为的，人民法院应当在审查原行政行为合法性的同时，一并审查复议决定的合法性。\n作出原行政行为的行政机关和复议机关对原行政行为合法性共同承担举证责任，可以由其中一个机关实施举证行为。复议机关对复议决定的合法性承担举证责任。\n复议机关作共同被告的案件，复议机关在复议程序中依法收集和补充的证据，可以作为人民法院认定复议决定和原行政行为合法的依据。"},{"source":"litigation","article":35,"quote":"第三十五条 在诉讼过程中，被告及其诉讼代理人不得自行向原告、第三人和证人收集证据。"}],"checkedAt":"2026-10-27T01:27:37+08:00"},"6561d5428149e3b8a348":{"index":1160,"domain":"reconsideration","topic":"复议期间并行起诉","status":"verified","currentAnswer":["F"],"analysis":"同一争议已复议受理期间原则不得同时诉讼。","references":[{"source":"reconsideration","article":29,"quote":"第二十九条　公民、法人或者其他组织申请行政复议，行政复议机关已经依法受理的，在行政复议期间不得向人民法院提起行政诉讼。\n公民、法人或者其他组织向人民法院提起行政诉讼，人民法院已经依法受理的，不得申请行政复议。\n第三章　行政复议受理"},{"source":"litigation-interpretation","article":69,"quote":"第六十九条有下列情形之一，已经立案的，应当裁定驳回起诉：\n（一）不符合行政诉讼法第四十九条规定的；\n（二）超过法定起诉期限且无行政诉讼法第四十八条规定情形的；\n（三）错列被告且拒绝变更的；\n（四）未按照法律规定由法定代理人、指定代理人、代表人为诉讼行为的；\n（五）未按照法律、法规规定先向行政机关申请复议的；\n（六）重复起诉的；\n（七）撤回起诉后无正当理由再行起诉的；\n（八）行政行为对其合法权益明显不产生实际影响的；\n（九）诉讼标的已为生效裁判或者调解书所羁束的；\n（十）其他不符合法定起诉条件的情形。\n前款所列情形可以补正或者更正的，人民法院应当指定期间责令补正或者更正；在指定期间已经补正或者更正的，应当依法审理。\n人民法院经过阅卷、调查或者询问当事人，认为不需要开庭审理的，可以迳行裁定驳回起诉。"}],"checkedAt":"2026-10-27T00:55:07+08:00"},"192a8cdb261125e6cdfb":{"index":1173,"domain":"litigation","topic":"改变原行为不当然驳请求","status":"verified","currentAnswer":["F"],"analysis":"须审原行为合法性，违法确认违法，不一律驳请求。","references":[{"source":"litigation","article":74,"quote":"第七十四条 行政行为有下列情形之一的，人民法院判决确认违法，但不撤销行政行为：\n\n （一）行政行为依法应当撤销，但撤销会给国家利益、社会公共利益造成重大损害的；\n\n （二）行政行为程序轻微违法，但对原告权利不产生实际影响的。\n\n 行政行为有下列情形之一，不需要撤销或者判决履行的，人民法院判决确认违法：\n\n （一）行政行为违法，但不具有可撤销内容的；\n\n （二）被告改变原违法行政行为，原告仍要求确认原行政行为违法的；\n\n （三）被告不履行或者拖延履行法定职责，判决履行没有意义的。"},{"source":"litigation-interpretation","article":81,"quote":"第八十一条被告在一审期间改变被诉行政行为的，应当书面告知人民法院。\n原告或者第三人对改变后的行政行为不服提起诉讼的，人民法院应当就改变后的行政行为进行审理。\n被告改变原违法行政行为，原告仍要求确认原行政行为违法的，人民法院应当依法作出确认判决。\n原告起诉被告不作为，在诉讼中被告作出行政行为，原告不撤诉的，人民法院应当就不作为依法作出确认判决。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"c934c079ec11b01d7b72":{"index":1184,"domain":"litigation","topic":"重审判决上诉","status":"verified","currentAnswer":["F"],"analysis":"对重审第一审裁判可上诉；不能把发回重审裁定本身与重审后判决混淆。","references":[{"source":"litigation","article":89,"quote":"第八十九条 人民法院审理上诉案件，按照下列情形，分别处理：\n\n （一）原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定；\n\n （二）原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更；\n\n （三）原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判；\n\n （四）原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n\n 原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n\n 人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。\n\n 第五节 审判监督程序"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"46568bad6402b2951744":{"index":1186,"domain":"litigation","topic":"监督依法行政目的措辞","status":"ambiguous","currentAnswer":[],"analysis":"原F针对缺监督一词，但依法行权是该目的的对象，不能只按少词否定实质。完整目的监督行政机关依法行使职权，不以不完整短语机械定真值。","references":[{"source":"litigation","article":1,"quote":"第一条 为保证人民法院公正、及时审理行政案件，解决行政争议，保护公民、法人和其他组织的合法权益，监督行政机关依法行使职权，根据宪法，制定本法。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"d24b3fbb1ce8227c0c5b":{"index":1190,"domain":"litigation","topic":"负责人应诉","status":"verified","currentAnswer":["F"],"analysis":"法条负责人而非仅主要负责人，不能出庭委托相应工作人员，具体正副职依司法解释确定。","references":[{"source":"litigation","article":3,"quote":"第三条 人民法院应当保障公民、法人和其他组织的起诉权利，对应当受理的行政案件依法受理。\n\n 行政机关及其工作人员不得干预、阻碍人民法院受理行政案件。\n\n 被诉行政机关负责人应当出庭应诉。不能出庭的，应当委托行政机关相应的工作人员出庭。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"0c851f8c3cbcefce0cdd":{"index":1194,"domain":"litigation","topic":"翻译保障义务","status":"verified","currentAnswer":["F"],"analysis":"对不通晓者应当提供翻译，不是可任意提供。","references":[{"source":"litigation","article":9,"quote":"第九条 各民族公民都有用本民族语言、文字进行行政诉讼的权利。\n\n 在少数民族聚居或者多民族共同居住的地区，人民法院应当用当地民族通用的语言、文字进行审理和发布法律文书。\n\n 人民法院应当对不通晓当地民族通用的语言、文字的诉讼参与人提供翻译。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"29774e32fd54fe193f04":{"index":1207,"domain":"litigation","topic":"电子数据证据","status":"verified","currentAnswer":["F"],"analysis":"电子数据是法定证据种类，不能一概排除。","references":[{"source":"litigation","article":33,"quote":"第三十三条 证据包括：\n\n （一）书证；\n\n （二）物证；\n\n （三）视听资料；\n\n （四）电子数据；\n\n （五）证人证言；\n\n （六）当事人的陈述；\n\n （七）鉴定意见；\n\n （八）勘验笔录、现场笔录。\n\n 以上证据经法庭审查属实，才能作为认定案件事实的根据。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"986b14ac43db8871baab":{"index":1209,"domain":"litigation","topic":"原告证据不免被告责任","status":"verified","currentAnswer":["F"],"analysis":"原告可证明违法，证据不成立亦不免被告举证。","references":[{"source":"litigation","article":37,"quote":"第三十七条 原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"593438cc907b5ce752cb":{"index":1212,"domain":"litigation","topic":"法院可主动保全证据","status":"verified","currentAnswer":["F"],"analysis":"可能灭失难取可依申请，法院亦可主动保全。","references":[{"source":"litigation","article":42,"quote":"第四十二条 在证据可能灭失或者以后难以取得的情况下，诉讼参加人可以向人民法院申请保全证据，人民法院也可以主动采取保全措施。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"7eaec472f754c1d0e078":{"index":1220,"domain":"litigation","topic":"登记立案","status":"verified","currentAnswer":["F"],"analysis":"符合条件应登记立案，不再旧审查立案。","references":[{"source":"litigation","article":51,"quote":"第五十一条 人民法院在接到起诉状时对符合本法规定的起诉条件的，应当登记立案。\n\n 对当场不能判定是否符合本法规定的起诉条件的，应当接收起诉状，出具注明收到日期的书面凭证，并在七日内决定是否立案。不符合起诉条件的，作出不予立案的裁定。裁定书应当载明不予立案的理由。原告对裁定不服的，可以提起上诉。\n\n 起诉状内容欠缺或者有其他错误的，应当给予指导和释明，并一次性告知当事人需要补正的内容。不得未经指导和释明即以起诉不符合条件为由不接收起诉状。\n\n 对于不接收起诉状、接收起诉状后不出具书面凭证，以及不一次性告知当事人需要补正的起诉状内容的，当事人可以向上级人民法院投诉，上级人民法院应当责令改正，并对直接负责的主管人员和其他直接责任人员依法给予处分。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"e7fef930c33ac3913bf8":{"index":1224,"domain":"litigation","topic":"规范性文件附带审查","status":"verified","currentAnswer":["F"],"analysis":"附带审查不含规章，不能把规章等均纳入第五十三条。","references":[{"source":"litigation","article":53,"quote":"第五十三条 公民、法人或者其他组织认为行政行为所依据的国务院部门和地方人民政府及其部门制定的规范性文件不合法，在对行政行为提起诉讼时，可以一并请求对该规范性文件进行审查。\n\n 前款规定的规范性文件不含规章。\n\n 第一节 一般规定"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"087f2607390dc24ed01f":{"index":1228,"domain":"litigation","topic":"停止执行裁定复议次数","status":"verified","currentAnswer":["F"],"analysis":"不服可申请复议一次，不是两次。","references":[{"source":"litigation","article":56,"quote":"第五十六条 诉讼期间，不停止行政行为的执行。但有下列情形之一的，裁定停止执行：\n\n （一）被告认为需要停止执行的；\n\n （二）原告或者利害关系人申请停止执行，人民法院认为该行政行为的执行会造成难以弥补的损失，并且停止执行不损害国家利益、社会公共利益的；\n\n （三）人民法院认为该行政行为的执行会给国家利益、社会公共利益造成重大损害的；\n\n （四）法律、法规规定停止执行的。\n\n 当事人对停止执行或者不停止执行的裁定不服的，可以申请复议一次。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"17c501ecdda15cb16545":{"index":1240,"domain":"litigation","topic":"合法行为判决类型","status":"verified","currentAnswer":["F"],"analysis":"判驳回诉讼请求，不是旧维持行政行为判决。","references":[{"source":"litigation","article":69,"quote":"第六十九条 行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决驳回原告的诉讼请求。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"a5a79622f80072eca054":{"index":1248,"domain":"litigation","topic":"不得不利变更","status":"verified","currentAnswer":["F"],"analysis":"原则不得加重义务减权益，诉求相反利害人同为原告为例外，不是可以原则。","references":[{"source":"litigation","article":77,"quote":"第七十七条 行政处罚明显不当，或者其他行政行为涉及对款额的确定、认定确有错误的，人民法院可以判决变更。\n\n 人民法院判决变更，不得加重原告的义务或者减损原告的权益。但利害关系人同为原告，且诉讼请求相反的除外。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"6456101d67061a8c08da":{"index":1256,"domain":"litigation","topic":"不得再次发回重审","status":"verified","currentAnswer":["F"],"analysis":"重审后再上诉，二审不得再发回，须依法处理。","references":[{"source":"litigation","article":89,"quote":"第八十九条 人民法院审理上诉案件，按照下列情形，分别处理：\n\n （一）原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定；\n\n （二）原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更；\n\n （三）原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判；\n\n （四）原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n\n 原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n\n 人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。\n\n 第五节 审判监督程序"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"8f4a6bac0ce773aa45f3":{"index":1261,"domain":"litigation","topic":"重审后可上诉","status":"verified","currentAnswer":["F"],"analysis":"第一审重审裁判可依法上诉。","references":[{"source":"litigation","article":89,"quote":"第八十九条 人民法院审理上诉案件，按照下列情形，分别处理：\n\n （一）原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定；\n\n （二）原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更；\n\n （三）原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判；\n\n （四）原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n\n 原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n\n 人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。\n\n 第五节 审判监督程序"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"177bb61ca4eaeaee84fd":{"index":1262,"domain":"litigation","topic":"再审申请非自动停执","status":"verified","currentAnswer":["F"],"analysis":"认为确错可向上级申请再审，原裁判不因申请当然停止。","references":[{"source":"litigation","article":90,"quote":"第九十条 当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行。"}],"checkedAt":"2026-10-27T00:57:14+08:00"},"16cec7563a09c850e712":{"index":1941,"domain":"civilcode","topic":"紧急临时照料义务","status":"verified","currentAnswer":["F"],"analysis":"法条应当安排，不是可任意安排或不安排。","references":[{"source":"civilcode","article":34,"quote":"第三十四条　监护人的职责是代理被监护人实施民事法律行为，保护被监护人的人身权利、财产权利以及其他合法权益等。\n监护人依法履行监护职责产生的权利，受法律保护。\n监护人不履行监护职责或者侵害被监护人合法权益的，应当承担法律责任。\n因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"fa2ef043834f9e287139":{"index":1942,"domain":"civilcode","topic":"居住权登记设立","status":"verified","currentAnswer":["F"],"analysis":"自登记时而非约定时设立。","references":[{"source":"civilcode","article":368,"quote":"第三百六十八条　居住权无偿设立，但是当事人另有约定的除外。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"50e42f0ceddf08802952":{"index":1943,"domain":"civilcode","topic":"居住权消灭注销","status":"verified","currentAnswer":["F"],"analysis":"届满或死亡消灭后应及时注销，不得说无需。","references":[{"source":"civilcode","article":370,"quote":"第三百七十条　居住权期限届满或者居住权人死亡的，居住权消灭。居住权消灭的，应当及时办理注销登记。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"85ad7427397d34bd99ff":{"index":1948,"domain":"civilcode","topic":"机关法人撤销权义承受","status":"verified","currentAnswer":["F"],"analysis":"终止不使权义消灭，由继任机关，没继任由撤销决定机关承受。","references":[{"source":"civilcode","article":98,"quote":"第九十八条　机关法人被撤销的，法人终止，其民事权利和义务由继任的机关法人享有和承担；没有继任的机关法人的，由作出撤销决定的机关法人享有和承担。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"eab4b1d7f3fed5b9ae6b":{"index":1949,"domain":"civilcode","topic":"土地经营权登记对抗","status":"verified","currentAnswer":["F"],"analysis":"五年以上合同生效设立，但未经登记不得对抗善意第三人。","references":[{"source":"civilcode","article":341,"quote":"第三百四十一条　流转期限为五年以上的土地经营权，自流转合同生效时设立。当事人可以向登记机构申请土地经营权登记；未经登记，不得对抗善意第三人。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"dcc328bae70a63e21725":{"index":1978,"domain":"civilcode","topic":"土地经营权登记对抗","status":"verified","currentAnswer":["F"],"analysis":"五年以上合同生效设立，但未经登记不得对抗善意第三人。","references":[{"source":"civilcode","article":341,"quote":"第三百四十一条　流转期限为五年以上的土地经营权，自流转合同生效时设立。当事人可以向登记机构申请土地经营权登记；未经登记，不得对抗善意第三人。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"eac461c175674db886fc":{"index":1956,"domain":"civilcode","topic":"国家机关必要肖像使用","status":"verified","currentAnswer":["F"],"analysis":"依法履职必要范围可不经同意，不是必须同意，须符合合理必要条件。","references":[{"source":"civilcode","article":1020,"quote":"第一千零二十条　合理实施下列行为的，可以不经肖像权人同意：\n（一）为个人学习、艺术欣赏、课堂教学或者科学研究，在必要范围内使用肖像权人已经公开的肖像；\n（二）为实施新闻报道，不可避免地制作、使用、公开肖像权人的肖像；\n（三）为依法履行职责，国家机关在必要范围内制作、使用、公开肖像权人的肖像；\n（四）为展示特定公共环境，不可避免地制作、使用、公开肖像权人的肖像；\n（五）为维护公共利益或者肖像权人合法权益，制作、使用、公开肖像权人的肖像的其他行为。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"4cfe6fb4852bc244d9a9":{"index":1961,"domain":"civilcode","topic":"异性收养年龄差","status":"conflict","currentAnswer":["T"],"analysis":"原F与第一千一百零二条一致文字相冲突；无配偶者收养异性子女须相差40周岁以上，40岁与40周岁不应据此判反。保留原F并展示法条。","references":[{"source":"civilcode","article":1102,"quote":"第一千一百零二条　无配偶者收养异性子女的，收养人与被收养人的年龄应当相差四十周岁以上。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"3c3ff1f5d5a00336472b":{"index":1963,"domain":"civilcode","topic":"收养协议自愿","status":"verified","currentAnswer":["F"],"analysis":"愿意可以签协议，不是全部应当必须签。","references":[{"source":"civilcode","article":1105,"quote":"第一千一百零五条　收养应当向县级以上人民政府民政部门登记。收养关系自登记之日起成立。\n收养查找不到生父母的未成年人的，办理登记的民政部门应当在登记前予以公告。\n收养关系当事人愿意签订收养协议的，可以签订收养协议。\n收养关系当事人各方或者一方要求办理收养公证的，应当办理收养公证。\n县级以上人民政府民政部门应当依法进行收养评估。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"b3440826a08d53f0f764":{"index":1970,"domain":"civilcode","topic":"紧急照料应当安排","status":"conflict","currentAnswer":["T"],"analysis":"原F与第三十四条原文直接冲突，应当安排必要临时生活照料措施。保留原F和现行规定。","references":[{"source":"civilcode","article":34,"quote":"第三十四条　监护人的职责是代理被监护人实施民事法律行为，保护被监护人的人身权利、财产权利以及其他合法权益等。\n监护人依法履行监护职责产生的权利，受法律保护。\n监护人不履行监护职责或者侵害被监护人合法权益的，应当承担法律责任。\n因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"1231a62b2321e06e12c6":{"index":1983,"domain":"penalty","topic":"责令改正非处罚","status":"verified","currentAnswer":["F"],"analysis":"责改为纠正违法义务，不属于本法列举处罚种类。","references":[{"source":"penalty","article":9,"quote":"第九条\n行政处罚的种类：\n（一）警告、通报批评；\n（二）罚款、没收违法所得、没收非法财物；\n（三）暂扣许可证件、降低资质等级、吊销许可证件；\n（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；\n（五）行政拘留；\n（六）法律、行政法规规定的其他行政处罚。"},{"source":"penalty","article":28,"quote":"第二十八条\n行政机关实施行政处罚时，应当责令当事人改正或者限期改正违法行为。\n当事人有违法所得，除依法应当退赔的外，应当予以没收。违法所得是指实施违法行为所取得的款项。法律、行政法规、部门规章对违法所得的计算另有规定的，从其规定。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"eafdb3b45291f22fdbe9":{"index":1985,"domain":"penalty","topic":"通报批评为处罚","status":"verified","currentAnswer":["F"],"analysis":"通报批评已在处罚种类第一项。","references":[{"source":"penalty","article":9,"quote":"第九条\n行政处罚的种类：\n（一）警告、通报批评；\n（二）罚款、没收违法所得、没收非法财物；\n（三）暂扣许可证件、降低资质等级、吊销许可证件；\n（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；\n（五）行政拘留；\n（六）法律、行政法规规定的其他行政处罚。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"023773fd081467b75d57":{"index":1986,"domain":"penalty","topic":"其他处罚种类层级","status":"verified","currentAnswer":["F"],"analysis":"其他种类须法律行政法规规定，泛称法规包含地方性法规，范围过宽。","references":[{"source":"penalty","article":9,"quote":"第九条\n行政处罚的种类：\n（一）警告、通报批评；\n（二）罚款、没收违法所得、没收非法财物；\n（三）暂扣许可证件、降低资质等级、吊销许可证件；\n（四）限制开展生产经营活动、责令停产停业、责令关闭、限制从业；\n（五）行政拘留；\n（六）法律、行政法规规定的其他行政处罚。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"6bb561d37a4826a9fa7a":{"index":1988,"domain":"penalty","topic":"行政法规不得设限自由","status":"conflict","currentAnswer":["T"],"analysis":"原F直接与第十一条相冲突。行政法规不得设限自由处罚，保留原F与法条并列。","references":[{"source":"penalty","article":11,"quote":"第十一条\n行政法规可以设定除限制人身自由以外的行政处罚。\n法律对违法行为已经作出行政处罚规定，行政法规需要作出具体规定的，必须在法律规定的给予行政处罚的行为、种类和幅度的范围内规定。\n法律对违法行为未作出行政处罚规定，行政法规为实施法律，可以补充设定行政处罚。拟补充设定行政处罚的，应当通过听证会、论证会等形式广泛听取意见，并向制定机关作出书面说明。行政法规报送备案时，应当说明补充设定行政处罚的情况。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"82ca7b24ecc2d3ff5208":{"index":1992,"domain":"penalty","topic":"部门规章设罚前提","status":"verified","currentAnswer":["F"],"analysis":"法条未制定法律行政法规而非泛称法律法规，原题扩大了地方性法规未制定条件。","references":[{"source":"penalty","article":13,"quote":"第十三条\n国务院部门规章可以在法律、行政法规规定的给予行政处罚的行为、种类和幅度的范围内作出具体规定。\n尚未制定法律、行政法规的，国务院部门规章对违反行政管理秩序的行为，可以设定警告、通报批评或者一定数额罚款的行政处罚。罚款的限额由国务院规定。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"96743d4d0b33ebeacbb4":{"index":1996,"domain":"penalty","topic":"限自由实施不限公安","status":"verified","currentAnswer":["F"],"analysis":"另有法律规定其他机关，不能仅限公安。","references":[{"source":"penalty","article":18,"quote":"第十八条\n国家在城市管理、市场监管、生态环境、文化市场、交通运输、应急管理、农业等领域推行建立综合行政执法制度，相对集中行政处罚权。\n国务院或者省、自治区、直辖市人民政府可以决定一个行政机关行使有关行政机关的行政处罚权。\n限制人身自由的行政处罚权只能由公安机关和法律规定的其他机关行使。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"cfc674e710a5f24739fb":{"index":1997,"domain":"penalty","topic":"处罚授权层级","status":"verified","currentAnswer":["F"],"analysis":"授权为法律法规，不含规章。","references":[{"source":"penalty","article":19,"quote":"第十九条\n法律、法规授权的具有管理公共事务职能的组织可以在法定授权范围内实施行政处罚。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"95c854247dca3e6b8e1a":{"index":1998,"domain":"penalty","topic":"不得委托个人处罚","status":"verified","currentAnswer":["F"],"analysis":"委托须法定条件组织，不能委托个人。","references":[{"source":"penalty","article":20,"quote":"第二十条\n行政机关依照法律、法规、规章的规定，可以在其法定权限内书面委托符合本法第二十一条规定条件的组织实施行政处罚。行政机关不得委托其他组织或者个人实施行政处罚。\n委托书应当载明委托的具体事项、权限、期限等内容。委托行政机关和受委托组织应当将委托书向社会公布。\n委托行政机关对受委托组织实施行政处罚的行为应当负责监督，并对该行为的后果承担法律责任。\n受委托组织在委托范围内，以委托行政机关名义实施行政处罚；不得再委托其他组织或者个人实施行政处罚。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"e3f85cb043b9d3c1527c":{"index":2002,"domain":"penalty","topic":"乡镇承接处罚决定层级","status":"verified","currentAnswer":["F"],"analysis":"交基层处罚权限由省自治区直辖市决定，不是设区市自行决定。","references":[{"source":"penalty","article":24,"quote":"第二十四条\n省、自治区、直辖市根据当地实际情况，可以决定将基层管理迫切需要的县级人民政府部门的行政处罚权交由能够有效承接的乡镇人民政府、街道办事处行使，并定期组织评估。决定应当公布。\n承接行政处罚权的乡镇人民政府、街道办事处应当加强执法能力建设，按照规定范围、依照法定程序实施行政处罚。\n有关地方人民政府及其部门应当加强组织协调、业务指导、执法监督，建立健全行政处罚协调配合机制，完善评议、考核制度。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"300b565fcb97668ffc19":{"index":2003,"domain":"penalty","topic":"处罚管辖共同上一级","status":"verified","currentAnswer":["F"],"analysis":"法条共同上一级指定，不是任意共同上级；先协商或依法直接指定。","references":[{"source":"penalty","article":25,"quote":"第二十五条\n两个以上行政机关都有管辖权的，由最先立案的行政机关管辖。\n对管辖发生争议的，应当协商解决，协商不成的，报请共同的上一级行政机关指定管辖；也可以直接由共同的上一级行政机关指定管辖。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"221da7a98345d82effb9":{"index":2004,"domain":"penalty","topic":"行政处罚协助义务","status":"verified","currentAnswer":["F"],"analysis":"事项在被请求机关职权内应当依法协助，不是任意可以拒绝。","references":[{"source":"penalty","article":26,"quote":"第二十六条\n行政机关因实施行政处罚的需要，可以向有关机关提出协助请求。协助事项属于被请求机关职权范围内的，应当依法予以协助。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"7b4ce48ff936fc2eeb69":{"index":2006,"domain":"penalty","topic":"责令改正义务","status":"verified","currentAnswer":["F"],"analysis":"应当责改或限改，不是可以不作。","references":[{"source":"penalty","article":28,"quote":"第二十八条\n行政机关实施行政处罚时，应当责令当事人改正或者限期改正违法行为。\n当事人有违法所得，除依法应当退赔的外，应当予以没收。违法所得是指实施违法行为所取得的款项。法律、行政法规、部门规章对违法所得的计算另有规定的，从其规定。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"e007b5ab19b67b9adb39":{"index":2008,"domain":"penalty","topic":"轻微及时改正无后果","status":"verified","currentAnswer":["F"],"analysis":"三条件齐备应不予，不是可随意仍处罚。","references":[{"source":"penalty","article":33,"quote":"第三十三条\n违法行为轻微并及时改正，没有造成危害后果的，不予行政处罚。初次违法且危害后果轻微并及时改正的，可以不予行政处罚。\n当事人有证据足以证明没有主观过错的，不予行政处罚。法律、行政法规另有规定的，从其规定。\n对当事人的违法行为依法不予行政处罚的，行政机关应当对当事人进行教育。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"52a78610e806831cdde6":{"index":2015,"domain":"penalty","topic":"处罚从旧兼从轻","status":"verified","currentAnswer":["F"],"analysis":"新法较轻或不违法适用新规定，不是继续用旧的较重规则。","references":[{"source":"penalty","article":37,"quote":"第三十七条\n实施行政处罚，适用违法行为发生时的法律、法规、规章的规定。但是，作出行政处罚决定时，法律、法规、规章已被修改或者废止，且新的规定处罚较轻或者不认为是违法的，适用新的规定。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"6f03f74a7994c3b1de40":{"index":2018,"domain":"penalty","topic":"处罚事实查明义务","status":"verified","currentAnswer":["F"],"analysis":"必须查明，不是可任意查；事实不清证不足不得罚。","references":[{"source":"penalty","article":40,"quote":"第四十条\n公民、法人或者其他组织违反行政管理秩序的行为，依法应当给予行政处罚的，行政机关必须查明事实；违法事实不清、证据不足的，不得给予行政处罚。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"91002fc20ca74d3141af":{"index":2020,"domain":"penalty","topic":"合格电子记录可作证据","status":"conflict","currentAnswer":[],"analysis":"原F把可以作证据一概否定不当。经过法定审核且真实清晰完整准确的记录可用，未经审核不合格不可用，题句未写无条件全部可用；保留原F与条件。","references":[{"source":"penalty","article":41,"quote":"第四十一条\n行政机关依照法律、行政法规规定利用电子技术监控设备收集、固定违法事实的，应当经过法制和技术审核，确保电子技术监控设备符合标准、设置合理、标志明显，设置地点应当向社会公布。\n电子技术监控设备记录违法事实应当真实、清晰、完整、准确。行政机关应当 ）当事人要求听证的，应当在行政机关告知后五日内提出；\n（二）行政机关应当在举行听证的七日前，通知当事人及有关人员听证的时间、地点；\n（三）除涉及国家秘密、商业秘密或者个人隐私依法予以保密外，听证公开举行；\n（四）听证由行政机关指定的非本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避；\n（五）当事人可以亲自参加听证，也可以委托一至二人代理；\n（六）当事人及其代理人无正当理由拒不出席听证或者未经许可中途退出听证的，视为放弃听证权利，行政机关终止听证；\n（七）举行听证时，调查人员提出当事人违法的事实、证据和行政处罚建议，当事人进行申辩和质证；\n（八）听证应当制作笔录。笔录应当交当事人或者其代理人核对无误后签字或者盖章。当事人或者其代理人拒绝签字或者盖章的，由听证主持人在笔录中注明。"}],"checkedAt":"2026-10-27T00:59:25+08:00"},"f5ba9cfa811247d56a3c":{"index":2049,"domain":"penalty","topic":"困难地区收缴","status":"verified","currentAnswer":["F"],"analysis":"法定边远水上交通不便，山区不能当然单独作为条件，另需当事人提出等。","references":[{"source":"penalty","article":69,"quote":"第六十九条\n在边远、水上、交通不便地区，行政机关及其执法人员依照本法第五十一条、第五十七条的规定作出罚款决定后，当事人到指定的银行或者通过电子支付系统缴纳罚款确有困难，经当事人提出，行政机关及其执法人员可以当场收缴罚款。"}],"checkedAt":"2026-10-27T00:59:25+08:00"}}}</script>
  <script type="module">const STORAGE_KEY = 'adminlaw.judge-false.progress.v1';
const freshState = () => ({schema: 1, records: {}, readings: {}, draft: null, font: 18});
function isDisputed(question, reviews = {}) {
  return ['conflict', 'ambiguous', 'risk'].includes(reviews[question.id]?.status);
}
function wasDone(state, id) { return Boolean(state.records[id] || state.readings?.[id]); }
// A neutral reading is separate from graded history, so version changes cannot rewrite a score.
function submitReading(previous, question, selected, now = new Date().toISOString()) {
  if (!selected.length || new Set(selected).size !== selected.length || selected.some(k => !question.options.some(o => o.key === k))) throw new Error('请选择有效答案');
  return {attempts: (previous?.attempts || 0) + 1, lastAnswer: [...selected].sort(), lastAt: now};
}
function isCorrect(question, selected) {
  return [...new Set(selected)].sort().join('|') === [...question.answer].sort().join('|');
}
function submitRecord(previous, question, selected, now = new Date().toISOString()) {
  if (!selected.length || selected.some(key => !question.options.some(o => o.key === key))) throw new Error('请选择有效答案');
  const correct = isCorrect(question, selected);
  return {attempts: (previous?.attempts || 0) + 1,
    wrongCount: (previous?.wrongCount || 0) + (correct ? 0 : 1),
    lastCorrect: correct, mastered: correct, lastAnswer: [...selected].sort(), lastAt: now};
}
function questionPool(bank, state, mode, type = 'all', review = 'active', reviews = {}, scope = 'all') {
  return bank.filter(q => {
    if (type !== 'all' && q.category !== type) return false;
    const disputed = isDisputed(q, reviews);
    if (scope === 'disputed' && !disputed) return false;
    if (scope === 'checked' && reviews[q.id]?.status !== 'verified') return false;
    if (scope === 'pending' && reviews[q.id]) return false;
    const record = state.records[q.id];
    if (mode === 'disputed') return disputed;
    if (mode === 'new') return !wasDone(state, q.id);
    if (disputed) return false;
    return record?.wrongCount > 0 && (review === 'all' || (review === 'mastered' ? record.mastered : !record.mastered));
  });
}
function validateState(value, questions) {
  if (!value || value.schema !== 1 || !value.records || Array.isArray(value.records) || typeof value.records !== 'object') throw new Error('备份格式不正确');
  const known = new Map(questions.map(q => [q.id, q]));
  const clean = freshState();
  let unknown = 0;
  for (const [id, r] of Object.entries(value.records)) {
    if (!known.has(id)) { unknown++; continue; }
    const q = known.get(id);
    if (!r || !Number.isSafeInteger(r.attempts) || r.attempts < 1 || r.attempts > 1000000 ||

    const mark=document.createElement('span');mark.className='mark';mark.textContent=correct?'✓':wrong?'×':'';button.append(mark);
  });
  document.querySelector('#submit')?.parentElement.remove();
  main.querySelector('article').insertAdjacentHTML('beforeend',resultHtml(current,result));
  main.querySelector('.answer-feedback').outerHTML=feedbackHtml();
  document.querySelector('#wrong-count').textContent=bank.filter(activeWrong).length;
  if(mode==='new'){
    const progress=learningProgress(bank,state,learning,preferences);
    main.querySelector('.progress-line span').textContent=`${preferences.stage==='quality'?'优质题':preferences.stage==='ordinary'?'普通题':'全部'} · 已做 ${progress.done} / ${progress.total}`;
  }
  window.scrollTo({top:scrollY,behavior:'instant'});
}
function switchMode(nextMode) {
  mode=nextMode;roundDone.clear();result=null;resetOpen=false;
  if(mode!=='stats')pick(true);
  render();top();
}
function learningStatsHtml(){
 // Build all displayed counters in one pass instead of filtering the entire
 // question bank separately for every stage, domain and topic.
 const totals=new Map();
 for(const q of bank){
  const meta=learning.questions[q.id],done=wasDone(state,q.id)?1:0;
  for(const key of ['stage:all','stage:'+meta.stage,'domain:'+meta.domain,'topic:'+meta.topic+':'+meta.stage]){
   const value=totals.get(key)||{total:0,done:0};value.total++;value.done+=done;totals.set(key,value);
  }
 }
 const count=filters=>totals.get(filters.topic?'topic:'+filters.topic+':'+filters.stage:filters.domain?'domain:'+filters.domain:'stage:'+filters.stage)||{total:0,done:0};
 const groups=Object.entries(stageNames).map(([id,title])=>{const p=count({stage:id});return `<div class="stats-row"><span>${title}</span><span>已做 ${p.done} / ${p.total}</span></div>`;}).join('');
 const domains=learning.domains.map(d=>{
  const p=count({stage:'all',domain:d.id});
  return `<details class="domain-progress"><summary>${d.title} · 已做 ${p.done} / ${p.total}</summary>${learning.topics.filter(t=>t.domain===d.id).map(t=>{
   const a=count({stage:'quality',topic:t.id}),b=count({stage:'ordinary',topic:t.id});
   return `<div class="topic-progress"><strong>${escape(t.title)}</strong><p>优质 ${a.done}/${a.total} · 普通 ${b.done}/${b.total}${t.qualityDisputed?` · 优质含 ${t.qualityDisputed} 道重点差异题（不判分）`:''}</p><p>${escape(t.selectionNote)}</p><button class="text-link" data-topic-practice="${t.id}">练这个知识点</button></div>`;
  }).join('')}</details>`;
 }).join('');
 return `<section class="learning-summary"><h3>分阶段进度</h3>${groups}<p class="info">先做 ${learning.summary.quality} 道优质代表题，再按时间做 ${learning.summary.ordinary} 道普通题。覆盖 ${learning.topics.length} 个知识点；优质中 ${learning.summary.qualityDisputed} 道为重点差异查阅，不判分。做过与掌握分开统计，两个阶段共用已做记录。</p><details><summary>按领域和知识点查看进度</summary>${domains}</details></section>`;
}
function renderStats() {
  const records=bank.filter(q=>!isDisputed(q,reviews)).map(q=>state.records[q.id]).filter(Boolean), done=doneCount();
  const wrong=records.filter(r=>r.wrongCount>0), mastered=wrong.filter(r=>r.mastered);
  const firstAccuracy = records.length ? Math.round(records.filter(r=>r.wrongCount===0).length / records.length * 100)+'%' : '—';
  const audited=Object.values(reviews), disputed=bank.filter(q=>isDisputed(q,reviews));
  const historicalDisputed=disputed.filter(q=>state.records[q.id]).length;
  main.innerHTML=`<h2 class="section-title">每一道，都算数。</h2><div class="stats-grid"><div class="stat"><strong>${done}<span>已完成 / 共 ${bank.length} 题</span></strong></div><div class="stat"><strong>${bank.length-done}<span>还没做过的新题</span></strong></div><div class="stat"><strong>${wrong.length-mastered.length}<span>待巩固错题</span></strong></div><div class="stat"><strong>${mastered.length}<span>已掌握错题</span></strong></div></div>${learningStatsHtml()}<div class="stats-list">${Object.entries(names).map(([key,name])=>{const qs=bank.filter(q=>q.category===key);return `<div class="stats-row"><span>${name}</span><span>${doneCount(qs)} / ${qs.length}</span></div>`;}).join('')}<div class="stats-row"><span>按原题库从未答错占比（排除争议题）</span><span>${firstAccuracy}</span></div></div><div class="audit-summary info"><p>已逐题核查 ${audited.length} / ${bank.length} 题；其中 ${audited.filter(a=>a.status==='verified').length} 题暂未发现答案冲突，${disputed.length} 题有口径差异或疑义。${bank.length-audited.length?`其余 ${bank.length-audited.length} 题仍待核验。`:'全部题目均有核查记录；有疑义的题保留两种情况。'}</p><p>差异题只记已做，不判分、不新增错题；历史 ${historicalDisputed} 道差异题的原作答记录完整保留，暂从错题训练与占比中排除。</p><button class="secondary" id="stats-disputed">查看口径差异题（含已做）</button></div><div class="tools"><button class="primary" id="continue">继续做新题 →</button><button class="secondary" id="export">导出进度备份</button><button class="secondary" id="import">导入进度备份</button></div><p class="info">记录自动保存在这部手机的当前浏览器里。请固定使用同一个网址、同一个浏览器，避免无痕模式；清理网站数据前，先导出备份。</p><details class="info"><summary>关于这份题库</summary><p>来自你提供的《行政执法证考试题库》，本专项只收录原题库答案为“错误”的判断题，进度单独保存。共整理 ${data.summary.parsed_before_deduplication} 道可作答小题，合并 ${data.summary.duplicates_merged} 道完全重复题后，保留 ${bank.length} 道。案例按小问计数。</p><p>保留原题库答案和解析。已核查题附现行法规原文及版本；冲突、疑义题并列两种情况，不确定唯一考试答案。尚未核查的题明确标注。无法确认深圳本次考试是否沿用原库口径，不能用法规更新替考试方决定判分。</p></details><button class="text-link danger" id="reset-toggle">清空刷题记录</button>${resetOpen?`<div class="reset-box"><p>清空后，全部题目都会恢复为新题。建议先导出备份。输入“清空”后才能确认。</p><input id="reset-text" aria-label="输入清空确认" placeholder="输入：清空" autocomplete="off"><div class="actions"><button id="reset-cancel" class="secondary">取消</button><button id="reset-confirm" class="primary" disabled>确认清空</button></div></div>`:''}`;
  main.querySelectorAll('[data-topic-practice]').forEach(el=>el.onclick=()=>{
    preferences={stage:'quality',domain:topicById.get(el.dataset.topicPractice).domain,topic:el.dataset.topicPractice};savePreferences();filter='all';scope='all';switchMode('new');
  });
  bind('#continue',()=>switchMode('new'));
  bind('#stats-disputed',()=>{scope='all';filter='all';switchMode('disputed');});
  bind('#export',exportBackup);
  bind('#import',()=>document.querySelector('#import-file').click());
  bind('#reset-toggle',()=>{resetOpen=!resetOpen;renderStats();});
  bind('#reset-cancel',()=>{resetOpen=false;renderStats();});
  if(resetOpen){
    document.querySelector('#reset-text').oninput=e=>document.querySelector('#reset-confirm').disabled=e.target.value!=='清空';
    bind('#reset-confirm',()=>{
      if(document.querySelector('#reset-text').value!=='清空')return;
      const fresh=freshState();fresh.font=state.font;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(fresh));state=fresh;storageBroken=false;rawBroken='';notice('刷题记录已清空。');resetOpen=false;renderStats();}
      catch{notice('清空未成功：浏览器存储不可用，原记录保留。');}
    });
  }
}
function download(name, content) {
  const url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function exportBackup(){
  const date=new Date().toISOString().slice(0,10);
  if(rawBroken){download(`执法刷题-判断错误专项-原始记录-${date}.json`,rawBroken);return;}
  download(`执法刷题-判断错误专项-进度-${date}.json`,JSON.stringify({app:'admin-law-quiz-judge-false',bankVersion:data.version,exportedAt:new Date().toISOString(),...state},null,2));
  notice('备份文件已交给浏览器下载，请保存在手机“文件”中。');
}
document.querySelector('#import-file').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(file.size>10*1024*1024)throw new Error('备份文件过大');
    const parsed=validateState(JSON.parse(await file.text()),bank);
    if(rawBroken)throw new Error('请先导出无法读取的原始记录，再清空记录后导入备份');
    state=mergeStates(state,parsed.state);state.draft=null;
    storageBroken=false;
    const saved=persist();if(saved)notice(`已合并备份，现有 ${doneCount()} 道已做题。${parsed.unknown?'有 '+parsed.unknown+' 道其他版本题目未导入。':''}`);
    roundDone.clear();if(mode!=='stats')pick();render();
  }catch(error){notice('未导入：'+(error instanceof SyntaxError?'文件不是有效的 JSON 备份':error.message));}
  e.target.value='';
};
document.querySelectorAll('button[data-mode]').forEach(el=>el.onclick=()=>switchMode(el.dataset.mode));
document.querySelector('#font').onclick=()=>{const sizes=[16,18,20,22];state.font=sizes[(sizes.indexOf(state.font)+1)%sizes.length];persist();document.documentElement.style.setProperty('--font',state.font+'px');};
window.addEventListener('storage',e=>{if(e.key!==STORAGE_KEY||!e.newValue)return;try{state=validateState(JSON.parse(e.newValue),bank).state;storedRaw=e.newValue;roundDone.clear();if(mode!=='stats')pick(true);render();}catch{notice('另一个页面的记录暂时无法读取，请保留当前页面并导出备份。');}});
pick(true);render();
</script>
<script>
// The complete quiz remains usable while its verified offline copy downloads.
(() => {
  const status=document.querySelector('#offline-status');
  const show=text=>{if(status)status.textContent=text;};
  if(!('serviceWorker' in navigator)) {
    show('当前浏览器暂不支持离线保存');return;
  }
  const requested=new URL(location.href).searchParams.get('release');
  const expected=/^[a-f0-9]{64}$/.test(requested||'')?requested:null;
  let timer,deadline,finished=false;
  const cleanup=()=>{clearTimeout(timer);clearTimeout(deadline);navigator.serviceWorker.removeEventListener('controllerchange',check);};
  async function check() {
    if(finished)return;
    clearTimeout(timer);
    const worker=navigator.serviceWorker.controller;
    if(worker && new URL(worker.scriptURL).pathname === new URL('./sw.js',location.href).pathname) {
      const version=await new Promise(resolve=>{
        const channel=new MessageChannel();
        const timeout=setTimeout(()=>{channel.port1.close();resolve(null);},1000);
        channel.port1.onmessage=e=>{clearTimeout(timeout);channel.port1.close();resolve(e.data?.version);};
        worker.postMessage({type:'QUIZ_VERSION'},[channel.port2]);
      });
      if(finished)return;
      if(version&&(!expected||version===expected)) {
        finished=true;cleanup();document.documentElement.dataset.offlineReady='true';
        show('题库已存到本机，可离线刷题');return;
      }
    }
    timer=setTimeout(check,500);
  }
  navigator.serviceWorker.addEventListener('controllerchange',check);
  deadline=setTimeout(()=>{finished=true;cleanup();show('可以继续刷题，离线保存尚未完成');},60000);
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'})
    .then(()=>check())
    .catch(()=>{finished=true;cleanup();show('可以继续刷题，离线保存暂未完成');});
})();

</script>
