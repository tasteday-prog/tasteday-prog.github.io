  <script id="question-bank" type="application/json">{"version":"2026-10-26.1","questions":[{"id":"bf84d5a89da9a416010c","type":"judge","category":"judge","stem":"对违法行为给予行政处罚的规定必须公布；特殊情况下，未经公布的，也可以作为行政处罚的依据（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四条 行政处罚遵循公正、公开的原则。设定和实施行政处罚必须以事实为依据与违法行为的事实、性质、情节以及社会危害程度相当。对违法行为给予行政处罚的规定必须公布未经公布的不得作为行政处罚的依据","material":"","sources":["判断题·4（段落5598）"],"warnings":[],"number":660},{"id":"7a1a7ced8c110c07c7c4","type":"judge","category":"judge","stem":"违法当事人认错态度好，能够及时纠正错误，实施行政处罚后，可以不再追究违法当事人的刑事责任（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第二十二条 违法行为构成犯罪的行政机关必须将案件移送司法机关依法追究刑事责任。","material":"","sources":["判断题·7（段落5613）"],"warnings":[],"number":663},{"id":"43a71dfae12784d7fffe","type":"judge","category":"judge","stem":"行政处罚种类包括警告、罚款、没收违法所得、没收非法财物、责令停产停业、暂扣或者吊销许可证、暂扣或者吊销执照、行政拘留和法律、法规规定的其他行政处罚（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第八条 行政处罚的种类：一警告；二罚款；三没收违法所得、没收非法财物；四责令停产停业；五暂扣或者吊销许可证、暂扣或者吊销执照；六行政拘留；七法律、行政法规规定的其他行政处罚。","material":"","sources":["判断题·8（段落5618）"],"warnings":[],"number":664},{"id":"0614332b9fb85fec3dda","type":"judge","category":"judge","stem":"罚金是行政处罚的种类之一（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第八条 行政处罚的种类：一警告；二罚款；三没收违法所得、没收非法财物；四责令停产停业；五暂扣或者吊销许可证、暂扣或者吊销执照；六行政拘留；七法律、行政法规规定的其他行政处罚。","material":"","sources":["判断题·9（段落5623）"],"warnings":[],"number":665},{"id":"d31455f2544c32b7cca4","type":"judge","category":"judge","stem":"法规可以设定除限制人身自由以外的行政处罚（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第九条 法律可以设定各种行政处罚。限制人身自由的行政处罚只能由法律设定","material":"","sources":["判断题·11（段落5633）"],"warnings":[],"number":667},{"id":"fa549207e3d402ca52ed","type":"judge","category":"judge","stem":"行政性法规可以设定除限制人身自由、吊销企业营业执照以外的行政处罚（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第十一条 地方性法规可以设定除限制人身自由、吊销企业营业执照以外的行政处罚。","material":"","sources":["判断题·13（段落5643）"],"warnings":[],"number":669},{"id":"c3699d05769f54eaf6e8","type":"judge","category":"judge","stem":"国务院部委规章可以设定警告或者一定数量罚款的行政处罚。罚款的限额由全国人大常委会规定（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第十二条 国务院部、委员会制定的规章可以在法律、行政法规规定的给予行政处罚的行为、种类和幅度的范围内作出具体规定。","material":"","sources":["判断题·15（段落5653）"],"warnings":[],"number":671},{"id":"3135dcbb282de2120687","type":"judge","category":"judge","stem":"根据《行政处罚法》规定行政处罚委托实施中，受委托组织在委托范围内，以委托行政机关名义实施行政处罚；征得委托机关同意，可以再委托其他任何组织或者个人实施行政处罚（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第十八条 行政机关依照法律、法规或者规章的规定可以在其法定权限内委托符合本法第十九条规定条件的组织实施行政处罚。行政机关不得委托其他组织或者个人实施行政处罚。委托行政机关对受委托的组织实施行政处罚的行为应当负责监督并对该行为的后果承担法律责任。受委托组织在委托范围内以委托行政机关名义实施行政处罚不得再委托其他任何组织或者个人实施行政处罚。","material":"","sources":["判断题·21（段落5683）"],"warnings":[],"number":677},{"id":"cb58f777098d37c9b152","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，对当事人的同一个违法行为，不得给予两次以上的行政处罚（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第二十四条 对当事人的同一个违法行为不得给予两次以上罚款的行政处罚。","material":"","sources":["判断题·27（段落5713）"],"warnings":[],"number":683},{"id":"6cee15ac5dfdded518fd","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，行政机关在作出行政处罚决定后，应当告知当事人作出行政处罚决定的事实、理由及依据，并告知当事人依法享有的权利（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第三十一条 行政机关在作出行政处罚决定之前应当告知当事人作出行政处罚决定的事实、理由及依据并告知当事人依法享有的权利","material":"","sources":["判断题·36（段落5758）"],"warnings":[],"number":692},{"id":"4530d568b485c9721889","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，执法人员当场作出行政处罚决定的，应当向当事人出示执法身份证件，填写预定格式、编有号码的行政处罚决定书。行政处罚决定书应当报所属行政机关备案后交付当事人（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第三十四条 执法人员当场作出行政处罚决定的，应当向当事人出示执法身份证件，填写预定格式、编有号码的行政处罚决定书。行政处罚决定书应当当场交付当事人。前款规定的行政处罚决定书应当载明当事人的违法行为、行政处罚依据、罚款数额、时间、地点以及行政机关名称并由执法人员签名或者盖章。执法人员当场作出的行政处罚决定必须报所属行政机关备案。","material":"","sources":["判断题·39（段落5773）"],"warnings":[],"number":695},{"id":"513828593483ce6213bd","type":"judge","category":"judge","stem":"当事人对当场作出的行政处罚决定不服的，不可以申请行政复议或者提起行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第三十五条当事人对当场作出的行政处罚决定不服的可以依法申请行政复议或者提起行政诉讼","material":"","sources":["判断题·40（段落5778）"],"warnings":[],"number":696},{"id":"6b32e34fe05017fde812","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，当事人承担行政机关组织听证的部分费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条 行政机关作出责令停产停业、吊销许可证或者执照、较大数额罚款等行政处罚决定之前应当告知当事人有要求举行听证的权利当事人要求听证的行政机关应当组织听证。当事人不承担行政机关组织听证的费用。","material":"","sources":["判断题·44（段落5798）"],"warnings":[],"number":700},{"id":"4b4f5665f76a31ed8245","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，听证由行政机关指定的本案调查人员主持；当事人认为主持人与本案有直接利害关系的，有权申请回避（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条听证依照以下程序组织：一当事人要求听证的应当在行政机关告知后三日内提出；二行政机关应当在听证的七日前通知当事人举行听证的时间、地点；三除涉及国家秘密、商业秘密或者个人隐私外听证公开举行；四听证由行政机关指定的非本案调查人员主持当事人认为主持人与本案有直接利害关系的有权申请回避；五当事人可以亲自参加听证也可以委托一至二人代理；六举行听证时调查人员提出当事人违法的事实、证据和行政处罚建议当事人进行申辩和质证；七听证应当制作笔录笔录应当交当事人审核无误后签字或者盖章。当事人对限制人身自由的行政处罚有异议的依照治安管理处罚法有关规定执行。","material":"","sources":["判断题·45（段落5803）"],"warnings":[],"number":701},{"id":"cfd37ff269c80a933f43","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，当事人可以亲自参加听证，也可以委托律师一至二人代理（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条听证依照以下程序组织：一当事人要求听证的应当在行政机关告知后三日内提出；二行政机关应当在听证的七日前通知当事人举行听证的时间、地点；三除涉及国家秘密、商业秘密或者个人隐私外听证公开举行；四听证由行政机关指定的非本案调查人员主持当事人认为主持人与本案有直接利害关系的有权申请回避；五当事人可以亲自参加听证也可以委托一至二人代理；六举行听证时调查人员提出当事人违法的事实、证据和行政处罚建议当事人进行申辩和质证；七听证应当制作笔录笔录应当交当事人审核无误后签字或者盖章。当事人对限制人身自由的行政处罚有异议的依照治安管理处罚法有关规定执行。","material":"","sources":["判断题·46（段落5808）"],"warnings":[],"number":702},{"id":"537383f8101ac89df60c","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，作出行政处罚决定的行政机关及其执法人员任何情况下都不得自行收缴罚款（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十六条 作出罚款决定的行政机关应当与收缴罚款的机构分离。除依照本法第四十七条、第四十八条的规定当场收缴的罚款外作出行政处罚决定的行政机关及其执法人员不得自行收缴罚款。当事人应当自收到行政处罚决定书之日起十五日内到指定的银行缴纳罚款。银行应当收受罚款并将罚款直接上缴国库。","material":"","sources":["判断题·50（段落5828）"],"warnings":[],"number":706},{"id":"fed19c8dde1d77d6c567","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，在边远、水上、山区、交通不便地区，行政机关及其执法人员依法作出罚款决定后，当事人向指定的银行缴纳罚款确有困难，经当事人提出，行政机关及其执法人员可以当场收缴罚款（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十八条 在边远、水上、交通不便地区行政机关及其执法人员依照本法第三十三条、第三十八条的规定作出罚款决定后当事人向指定的银行缴纳罚款确有困难经当事人提出行政机关及其执法人员可以当场收缴罚款。","material":"","sources":["判断题·55（段落5853）"],"warnings":[],"number":711},{"id":"b9a0de3cff110dc56ef7","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，当事人应当自收到行政处罚决定书之日起十日内，到指定的银行缴纳罚款（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十六条 作出罚款决定的行政机关应当与收缴罚款的机构分离。除依照本法第四十七条、第四十八条的规定当场收缴的罚款外作出行政处罚决定的行政机关及其执法人员不得自行收缴罚款。当事人应当自收到行政处罚决定书之日起十五日内到指定的银行缴纳罚款。银行应当收受罚款并将罚款直接上缴国库","material":"","sources":["判断题·56（段落5858）"],"warnings":[],"number":712},{"id":"e95906e556dc218411da","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，紧急情况下，执法人员可以自行收缴罚款，然后将罚款上缴国库（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十六条 作出罚款决定的行政机关应当与收缴罚款的机构分离。除依照本法第四十七条、第四十八条的规定当场收缴的罚款外作出行政处罚决定的行政机关及其执法人员不得自行收缴罚款。当事人应当自收到行政处罚决定书之日起十五日内到指定的银行缴纳罚款。银行应当收受罚款并将罚款直接上缴国库","material":"","sources":["判断题·57（段落5863）"],"warnings":[],"number":713},{"id":"373efbdf8b9defef25fb","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，行政处罚听证后，行政机关必需根据听证笔录做出处罚决定（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条听证依照以下程序组织：一当事人要求听证的应当在行政机关告知后三日内提出；二行政机关应当在听证的七日前通知当事人举行听证的时间、地点；三除涉及国家秘密、商业秘密或者个人隐私外听证公开举行；四听证由行政机关指定的非本案调查人员主持当事人认为主持人与本案有直接利害关系的有权申请回避；五当事人可以亲自参加听证也可以委托一至二人代理；六举行听证时调查人员提出当事人违法的事实、证据和行政处罚建议当事人进行申辩和质证；七听证应当制作笔录笔录应当交当事人审核无误后签字或者盖章。当事人对限制人身自由的行政处罚有异议的依照治安管理处罚法有关规定执行。","material":"","sources":["判断题·59（段落5873）"],"warnings":[],"number":715},{"id":"15808a00d8602bd5b0cc","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，为了查清事实，行政处罚听证中当事人必需亲自参加，并可以委托一至二人代理（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条听证依照以下程序组织：一当事人要求听证的应当在行政机关告知后三日内提出；二行政机关应当在听证的七日前通知当事人举行听证的时间、地点；三除涉及国家秘密、商业秘密或者个人隐私外听证公开举行；四听证由行政机关指定的非本案调查人员主持当事人认为主持人与本案有直接利害关系的有权申请回避；五当事人可以亲自参加听证也可以委托一至二人代理；六举行听证时调查人员提出当事人违法的事实、证据和行政处罚建议当事人进行申辩和质证；七听证应当制作笔录笔录应当交当事人审核无误后签字或者盖章。当事人对限制人身自由的行政处罚有异议的依照治安管理处罚法有关规定执行。","material":"","sources":["判断题·60（段落5878）"],"warnings":[],"number":716},{"id":"91d6f10b6b9bc11e85d0","type":"judge","category":"judge","stem":"公安机关作出行政拘留决定前，应当告知当事人有要求举行听证的权利（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条 行政机关作出责令停产停业、吊销许可证或者执照、较大数额罚款等行政处罚决定之前，应当告知当事人有要求举行听证的权利。当事人要求听证的行政机关应当组织听证。当事人不承担行政机关组织听证的费用。","material":"","sources":["判断题·61（段落5883）"],"warnings":[],"number":717},{"id":"c27676595ebd57b29584","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，听证一律公开举行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十二条听证依照以下程序组织：一当事人要求听证的应当在行政机关告知后三日内提出；二行政机关应当在听证的七日前通知当事人举行听证的时间、地点；三除涉及国家秘密、商业秘密或者个人隐私外听证公开举行；四听证由行政机关指定的非本案调查人员主持当事人认为主持人与本案有直接利害关系的有权申请回避；五当事人可以亲自参加听证也可以委托一至二人代理；六举行听证时调查人员提出当事人违法的事实、证据和行政处罚建议当事人进行申辩和质证；七听证应当制作笔录笔录应当交当事人审核无误后签字或者盖章。当事人对限制人身自由的行政处罚有异议的依照治安管理处罚法有关规定执行。","material":"","sources":["判断题·63（段落5893）"],"warnings":[],"number":719},{"id":"db9939fda0d19798708f","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，行政处罚决定书应当在宣告后当场交付当事人；当事人不在场的，行政机关应当在七日内依照行政诉讼法的有关规定，将行政处罚决定书送达当事人（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十条 行政处罚决定书应当在宣告后当场交付当事人当事人不在场的行政机关应当在七日内依照民事诉讼法的有关规定将行政处罚决定书送达当事人。","material":"","sources":["判断题·66（段落5908）"],"warnings":[],"number":722},{"id":"4102632754cbe596d4cc","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，可以对证据先行登记保存，并应当在十日内及时作出处理决定（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第三十七条 行政机关在调查或者进行检查时执法人员不得少于两人并应当向当事人或者有关人员出示证件。当事人或者有关人员应当如实回答询问并协助调查或者检查不得阻挠。询问或者检查应当制作笔录。行政机关在收集证据时可以采取抽样取证的方法在证据可能灭失或者以后难以取得的情况下经行政机关负责人批准可以先行登记保存并应当在七日内及时作出处理决定在此期间当事人或者有关人员不得销毁或者转移证据。执法人员与当事人有直接利害关系的应当回避","material":"","sources":["判断题·69（段落5923）"],"warnings":[],"number":725},{"id":"9958924520e1d0321293","type":"judge","category":"judge","stem":"根据《行政处罚法》规定，不满十八周岁的人有违法行为的，不予行政处罚，责令监护人加以管教（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第二十五条不满十四周岁的人有违法行为的不予行政处罚责令监护人加以管教已满十四周岁不满十八周岁的人有违法行为的从轻或者减轻行政处罚。","material":"","sources":["判断题·75（段落5953）"],"warnings":[],"number":731},{"id":"d1939064b72760f3738a","type":"judge","category":"judge","stem":"违法行为构成犯罪的，行政机关可以将案件移送司法机关，依法追究刑事责任（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第二十二条 违法行为构成犯罪的行政机关必须将案件移送司法机关依法追究刑事责任。","material":"","sources":["判断题·77（段落5963）"],"warnings":[],"number":733},{"id":"73305ef4ca5feda80b22","type":"judge","category":"judge","stem":"没有法定依据或者不遵守法定程序的，行政处罚不成立（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第三条 公民、法人或者其他组织违反行政管理秩序的行为应当给予行政处罚的依照本法由法律、法规或者规章规定并由行政机关依照本法规定的程序实施。没有法定依据或者不遵守法定程序的行政处罚无效","material":"","sources":["判断题·80（段落5978）"],"warnings":[],"number":736},{"id":"a4627ead0d1b814645ea","type":"judge","category":"judge","stem":"行政机关及其执法人员当场收缴罚款的，当事人一律不得拒绝（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十九条 行政机关及其执法人员当场收缴罚款的必须向当事人出具省、自治区、直辖市财政部门统一制发的罚款收据不出具财政部门统一制发的罚款收缴的当事人有权拒绝缴纳罚款。","material":"","sources":["判断题·83（段落5993）"],"warnings":[],"number":738},{"id":"5845966579b79e2b8e77","type":"judge","category":"judge","stem":"行政机关及其执法人员当场收缴罚款的，当事人一律拒绝（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"根据《行政处罚法》，第四十九条 行政机关及其执法人员当场收缴罚款的必须向当事人出具省、自治区、直辖市财政部门统一制发的罚款收据不出具财政部门统一制发的罚款收缴的当事人有权拒绝缴纳罚款。","material":"","sources":["判断题·84（段落5998）"],"warnings":[],"number":739},{"id":"13403ce96ce2f638d1f6","type":"judge","category":"judge","stem":"有关行政机关对其他机关或者对其直接管理的事业单位的人事、财务、外事等事项的审批，适用行政许可法（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第三条  行政许可的设定和实施，适用本法。\n有关行政机关对其他机关或者对其直接管理的事业单位的人事、财务、外事等事项的审批，不适用本法","material":"","sources":["判断题·85（段落6003）"],"warnings":[],"number":740},{"id":"96c77cf2adb5d4bddafa","type":"judge","category":"judge","stem":"公民、法人或者其他组织依法取得的行政许可受法律保护，行政机关可以根据上级命令改变已经生效的行政许可（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第八条 公民、法人或者其他组织依法取得的行政许可受法律保护，行政机关不得擅自改变已经生效的行政许可。\n行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化的，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可。由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予补偿","material":"","sources":["判断题·91（段落6038）"],"warnings":[],"number":746},{"id":"96f423cdb3e8227b8d01","type":"judge","category":"judge","stem":"行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化的，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可。由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予赔偿（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第八条 公民、法人或者其他组织依法取得的行政许可受法律保护，行政机关不得擅自改变已经生效的行政许可。\n行政许可所依据的法律、法规、规章修改或者废止，或者准予行政许可所依据的客观情况发生重大变化的，为了公共利益的需要，行政机关可以依法变更或者撤回已经生效的行政许可。由此给公民、法人或者其他组织造成财产损失的，行政机关应当依法给予补偿。","material":"","sources":["判断题·92（段落6044）"],"warnings":[],"number":747},{"id":"fb2c7fec0852045835d4","type":"judge","category":"judge","stem":"临时性的行政许可实施满一年需要继续实施的，可以提请本级人民代表大会及其常务委员会制定地方性法规（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第十五条 本法第十二条所列事项，尚未制定法律、行政法规的，地方性法规可以设定行政许可;尚未制定法律、行政法规和地方性法规的，因行政管理的需要，确需立即实施行政许可的，省、自治区、直辖市人民政府规章可以设定临时性的行政许可。临时性的行政许可实施满一年需要继续实施的，应当提请本级人民代表大会及其常务委员会制定地方性法规。","material":"","sources":["判断题·99（段落6093）"],"warnings":[],"number":754},{"id":"677d5fe9aa4eebc43910","type":"judge","category":"judge","stem":"受委托行政机关在委托范围内，可以以自己的名义实施行政许可，但不得再委托其他组织或者个人实施行政许可（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第二十四条 行政机关在其法定职权范围内，依照法律、法规、规章的规定，可以委托其他行政机关实施行政许可。委托机关应当将受委托行政机关和受委托实施行政许可的内容予以公告。\n委托行政机关对受委托行政机关实施行政许可的行为应当负责监督，并对该行为的后果承担法律责任。\n受委托行政机关在委托范围内，以委托行政机关名义实施行政许可;不得再委托其他组织或者个人实施行政许可","material":"","sources":["判断题·111（段落6170）"],"warnings":[],"number":766},{"id":"cd0976575338f207efd7","type":"judge","category":"judge","stem":"行政许可申请不得通过电子邮件方式提出（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第二十九条 公民、法人或者其他组织从事特定活动，依法需要取得行政许可的，应当向行政机关提出申请。申请书需要采用格式文本的，行政机关应当向申请人提供行政许可申请书格式文本。申请书格式文本中不得包含与申请行政许可事项没有直接关系的内容。\n申请人可以委托代理人提出行政许可申请。但是，依法应当由申请人到行政机关办公场所提出行政许可申请的除外。\n行政许可申请可以通过信函、电报、电传、传真、电子数据交换和电子邮件等方式提出","material":"","sources":["判断题·119（段落6220）"],"warnings":[],"number":774},{"id":"823ffb1e1426a0781c57","type":"judge","category":"judge","stem":"行政机关对申请人提交有关材料和反映情况认真审查，并对其申请材料实质内容的真实性负责（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第三十一条 申请人申请行政许可，应当如实向行政机关提交有关材料和反映真实情况，并对其申请材料实质内容的真实性负责。行政机关不得要求申请人提交与其申请的行政许可事项无关的技术资料和其他材料","material":"","sources":["判断题·123（段落6243）"],"warnings":[],"number":778},{"id":"cfb049acef777debd9e9","type":"judge","category":"judge","stem":"依法应当先经下级行政机关审查后报上级行政机关决定的行政许可，下级行政机关应当在法定期限内将初步审查意见和全部申请材料直接报送上级行政机关。上级行政机关可以要求申请人提供申请材料（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第三十五条 依法应当先经下级行政机关审查后报上级行政机关决定的行政许可，下级行政机关应当在法定期限内将初步审查意见和全部申请材料直接报送上级行政机关。上级行政机关不得要求申请人重复提供申请材料。","material":"","sources":["判断题·126（段落6260）"],"warnings":[],"number":781},{"id":"6741e0ff018abf50d653","type":"judge","category":"judge","stem":"行政机关作出的准予行政许可决定，除涉及国家秘密、商业秘密外，应当予以公开，公众有权查阅（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十条 行政机关作出的准予行政许可决定，应当予以公开，公众有权查阅。","material":"","sources":["判断题·129（段落6276）"],"warnings":[],"number":784},{"id":"8f42cf3039e31dd46bfb","type":"judge","category":"judge","stem":"行政机关应当自受理行政许可申请之日起二十日内作出行政许可决定。二十日内不能作出决定的，经本行政机关主要负责人批准，可以延长十日，并应当将延长期限的理由告知申请人（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十二条 除可以当场作出行政许可决定的外，行政机关应当自受理行政许可申请之日起二十日内作出行政许可决定。二十日内不能作出决定的，经本行政机关负责人批准，可以延长十日，并应当将延长期限的理由告知申请人。但是，法律、法规另有规定的，依照其规定。","material":"","sources":["判断题·130（段落6281）"],"warnings":[],"number":785},{"id":"ab05cd10862f87231a93","type":"judge","category":"judge","stem":"申请人、利害关系人承担行政机关组织许可听证的必要费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十七条 行政许可直接涉及申请人与他人之间重大利益关系的，行政机关在作出行政许可决定前，应当告知申请人、利害关系人享有要求听证的权利;申请人、利害关系人在被告知听证权利之日起五日内提出听证申请的，行政机关应当在二十日内组织听证。\n申请人、利害关系人不承担行政机关组织听证的费用。","material":"","sources":["判断题·132（段落6292）"],"warnings":[],"number":787},{"id":"96c2431aef81a82d90c5","type":"judge","category":"judge","stem":"行政许可听证可以不公开举行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十八条 听证按照下列程序进行：(一)行政机关应当于举行听证的七日前将举行听证的时间、地点通知申请人、利害关系人，必要时予以公告;(二)听证应当公开举行;(三)行政机关应当指定审查该行政许可申请的工作人员以外的人员为听证主持人，申请人、利害关系人认为主持人与该行政许可事项有直接利害关系的，有权申请回避;(四)举行听证时，审查该行政许可申请的工作人员应当提供审查意见的证据、理由，申请人、利害关系人可以提出证据，并进行申辩和质证;(五)听证应当制作笔录，听证笔录应当交听证参加人确认无误后签字或者盖章。\n行政机关应当根据听证笔录，作出行政许可决定","material":"","sources":["判断题·133（段落6298）"],"warnings":[],"number":788},{"id":"31a25916e0e0e3255c46","type":"judge","category":"judge","stem":"审查该行政许可申请的工作人员为听证主持人（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十八条 听证按照下列程序进行：(一)行政机关应当于举行听证的七日前将举行听证的时间、地点通知申请人、利害关系人，必要时予以公告;(二)听证应当公开举行;(三)行政机关应当指定审查该行政许可申请的工作人员以外的人员为听证主持人，申请人、利害关系人认为主持人与该行政许可事项有直接利害关系的，有权申请回避;(四)举行听证时，审查该行政许可申请的工作人员应当提供审查意见的证据、理由，申请人、利害关系人可以提出证据，并进行申辩和质证;(五)听证应当制作笔录，听证笔录应当交听证参加人确认无误后签字或者盖章。\n行政机关应当根据听证笔录，作出行政许可决定","material":"","sources":["判断题·134（段落6304）"],"warnings":[],"number":789},{"id":"77df2917601d61025753","type":"judge","category":"judge","stem":"行政许可听证没有要求回避制度（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第四十八条 听证按照下列程序进行：(一)行政机关应当于举行听证的七日前将举行听证的时间、地点通知申请人、利害关系人，必要时予以公告;(二)听证应当公开举行;(三)行政机关应当指定审查该行政许可申请的工作人员以外的人员为听证主持人，申请人、利害关系人认为主持人与该行政许可事项有直接利害关系的，有权申请回避;(四)举行听证时，审查该行政许可申请的工作人员应当提供审查意见的证据、理由，申请人、利害关系人可以提出证据，并进行申辩和质证;(五)听证应当制作笔录，听证笔录应当交听证参加人确认无误后签字或者盖章。\n行政机关应当根据听证笔录，作出行政许可决定","material":"","sources":["判断题·135（段落6310）"],"warnings":[],"number":790},{"id":"95697613d1ac48a30a5f","type":"judge","category":"judge","stem":"行政机关应当根据被许可人的申请，在该行政许可有效期届满前作出是否准予延续的决定；逾期未作决定的，视为不予延续（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第五十条 被许可人需要延续依法取得的行政许可的有效期的，应当在该行政许可有效期届满三十日前向作出行政许可决定的行政机关提出申请。但是，法律、法规、规章另有规定的，依照其规定。\n行政机关应当根据被许可人的申请，在该行政许可有效期届满前作出是否准予延续的决定;逾期未作决定的，视为准予延续。","material":"","sources":["判断题·139（段落6333）"],"warnings":[],"number":794},{"id":"3cfff04bc0c3fc1f09b6","type":"judge","category":"judge","stem":"公民特定资格的考试依法由行政机关或者行业组织实施，公开举行。行政机关或者行业组织应当事先公布资格考试的报名条件、报考办法、考试科目以及考试大纲、组织培训，但不得指定教材或者其他助考材料（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第五十四条 实施本法第十二条第三项所列事项的行政许可，赋予公民特定资格，依法应当举行国家考试的，行政机关根据考试成绩和其他法定条件作出行政许可决定;赋予法人或者其他组织特定的资格、资质的，行政机关根据申请人的专业人员构成、技术条件、经营业绩和管理水平等的考核结果作出行政许可决定。但是，法律、行政法规另有规定的，依照其规定。\n公民特定资格的考试依法由行政机关或者行业组织实施，公开举行。行政机关或者行业组织应当事先公布资格考试的报名条件、报考办法、考试科目以及考试大纲。但是，不得组织强制性的资格考试的考前培训，不得指定教材或者其他助考材料。","material":"","sources":["判断题·142（段落6351）"],"warnings":[],"number":797},{"id":"aae75beda929e940eab7","type":"judge","category":"judge","stem":"公民特定资格的考试依法由行政机关或者行业组织实施，公开举行。行政机关或者行业组织应当事先公布资格考试的报名条件、报考办法、考试科目以及考试大纲，不得组织强制性的资格考试的考前培训，可以推荐教材或者其他助考材料（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第五十四条 实施本法第十二条第三项所列事项的行政许可，赋予公民特定资格，依法应当举行国家考试的，行政机关根据考试成绩和其他法定条件作出行政许可决定;赋予法人或者其他组织特定的资格、资质的，行政机关根据申请人的专业人员构成、技术条件、经营业绩和管理水平等的考核结果作出行政许可决定。但是，法律、行政法规另有规定的，依照其规定。\n公民特定资格的考试依法由行政机关或者行业组织实施，公开举行。行政机关或者行业组织应当事先公布资格考试的报名条件、报考办法、考试科目以及考试大纲。但是，不得组织强制性的资格考试的考前培训，不得指定教材或者其他助考材料","material":"","sources":["判断题·143（段落6357）"],"warnings":[],"number":798},{"id":"6f84a1d4b69cc3abec1c","type":"judge","category":"judge","stem":"行政机关实施行政许可和对行政许可事项进行监督检查，收取必要的费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第五十八条 行政机关实施行政许可和对行政许可事项进行监督检查，不得收取任何费用。但是，法律、行政法规另有规定的，依照其规定。\n行政机关提供行政许可申请书格式文本，不得收费。\n行政机关实施行政许可所需经费应当列入本行政机关的预算，由本级财政予以保障，按照批准的预算予以核拨","material":"","sources":["判断题·145（段落6368）"],"warnings":[],"number":800},{"id":"cbffaf3d2b44b8825e49","type":"judge","category":"judge","stem":"行政机关提供行政许可申请书格式文本，可以收取工本费（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第五十八条 行政机关实施行政许可和对行政许可事项进行监督检查，不得收取任何费用。但是，法律、行政法规另有规定的，依照其规定。\n行政机关提供行政许可申请书格式文本，不得收费。\n行政机关实施行政许可所需经费应当列入本行政机关的预算，由本级财政予以保障，按照批准的预算予以核拨","material":"","sources":["判断题·146（段落6375）"],"warnings":[],"number":801},{"id":"af12e6353fb7a269843b","type":"judge","category":"judge","stem":"行政机关依法对被许可人从事行政许可事项的活动进行监督检查时，应当将监督检查的情况和处理结果予以记录，由监督检查人员签字后归档。利害关系人有权查阅行政机关监督检查记录（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第六十一条 行政机关应当建立健全监督制度，通过核查反映被许可人从事行政许可事项活动情况的有关材料，履行监督责任。\n行政机关依法对被许可人从事行政许可事项的活动进行监督检查时，应当将监督检查的情况和处理结果予以记录，由监督检查人员签字后归档。公众有权查阅行政机关监督检查记录。\n行政机关应当创造条件，实现与被许可人、其他有关行政机关的计算机档案系统互联，核查被许可人从事行政许可事项活动情况。","material":"","sources":["判断题·149（段落6394）"],"warnings":[],"number":804},{"id":"4949577594dbfc1ee218","type":"judge","category":"judge","stem":"赋予公民特定资格的行政许可，该公民死亡或者丧失行为能力的，行政机关应当依法办理有关行政许可的撤销手续（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政许可法》，第七十条 有下列情形之一的，行政机关应当依法办理有关行政许可的注销手续：(一)行政许可有效期届满未延续的;(二)赋予公民特定资格的行政许可，该公民死亡或者丧失行为能力的;(三)法人或者其他组织依法终止的;(四)行政许可依法被撤销、撤回，或者行政许可证件依法被吊销的;(五)因不可抗力导致行政许可事项无法实施的;(六)法律、法规规定的应当注销行政许可的其他情形。","material":"","sources":["判断题·156（段落6441）"],"warnings":[],"number":811},{"id":"02fa4b502474442b1d1f","type":"judge","category":"judge","stem":"为了提高行政效率，法律、行政法规可以设定行政强制（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第一条　为了规范行政强制的设定和实施，保障和监督行政机关依法履行职责，维护公共利益和社会秩序，保护公民、法人和其他组织的合法权益，根据宪法，制定本法。","material":"","sources":["判断题·166（段落6495）"],"warnings":[],"number":821},{"id":"7a1e67b383162af962f8","type":"judge","category":"judge","stem":"行政强制措施由法律、法规设定（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十条　行政强制措施由法律设定。\n尚未制定法律，且属于国务院行政管理职权事项的，行政法规可以设定除本法第九条第一项、第四项和应当由法律规定的行政强制措施以外的其他行政强制措施。\n尚未制定法律、行政法规，且属于地方性事务的，地方性法规可以设定本法第九条第二项、第三项的行政强制措施。\n法律、法规以外的其他规范性文件不得设定行政强制措施。","material":"","sources":["判断题·169（段落6510）"],"warnings":[],"number":824},{"id":"c6f277d2fe7113de80c3","type":"judge","category":"judge","stem":"行政法规、地方性法规一律不得设定行政强制措施（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十四条　起草法律草案、法规草案，拟设定行政强制的，起草单位应当采取听证会、论证会等形式听取意见，并向制定机关说明设定该行政强制的必要性、可能产生的影响以及听取和采纳意见的情况。","material":"","sources":["判断题·173（段落6537）"],"warnings":[],"number":828},{"id":"0529efece3576f98517d","type":"judge","category":"judge","stem":"根据行政管理需要，行政法规可以规定行政强制执行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第四条　行政强制的设定和实施，应当依照法定的权限、范围、条件和程序。","material":"","sources":["判断题·176（段落6554）"],"warnings":[],"number":831},{"id":"3e5558194f439f0354ef","type":"judge","category":"judge","stem":"行政强制的实施机关应当对已设定的行政强制的实施情况及存在的必要性适时进行评价，并将意见报告该行政强制的设定机关（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十五条　行政强制的设定机关应当定期对其设定的行政强制进行评价，并对不适当的行政强制及时予以修改或者废止。\n行政强制的实施机关可以对已设定的行政强制的实施情况及存在的必要性适时进行评价，并将意见报告该行政强制的设定机关。\n公民、法人或者其他组织可以向行政强制的设定机关和实施机关就行政强制的设定和实施提出意见和建议。有关机关应当认真研究论证，并以适当方式予以反馈。","material":"","sources":["判断题·179（段落6571）"],"warnings":[],"number":834},{"id":"127ef2bba2bdea43688a","type":"judge","category":"judge","stem":"公民、法人或者其他组织可以向行政强制的设定机关和实施机关就行政强制的设定和实施提出意见和建议。有关机关可以认真研究论证，并以适当方式予以反馈（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十五条　行政强制的设定机关应当定期对其设定的行政强制进行评价，并对不适当的行政强制及时予以修改或者废止。\n行政强制的实施机关可以对已设定的行政强制的实施情况及存在的必要性适时进行评价，并将意见报告该行政强制的设定机关。\n公民、法人或者其他组织可以向行政强制的设定机关和实施机关就行政强制的设定和实施提出意见和建议。有关机关应当认真研究论证，并以适当方式予以反馈。","material":"","sources":["判断题·180（段落6578）"],"warnings":[],"number":835},{"id":"f5fa0fe3045fc5d1d4b0","type":"judge","category":"judge","stem":"行政机关履行行政管理职责，依照法律、法规、规章的规定，实施行政强制措施（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十六条　行政机关履行行政管理职责，依照法律、法规的规定，实施行政强制措施。\n违法行为情节显著轻微或者没有明显社会危害的，可以不采取行政强制措施。","material":"","sources":["判断题·181（段落6585）"],"warnings":[],"number":836},{"id":"7ea430c6d47b5e4e858a","type":"judge","category":"judge","stem":"当事人拒绝到场，行政机关实施行政强制措施（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十八条　行政机关实施行政强制措施应当遵守下列规定：(一)实施前须向行政机关负责人报告并经批准;(二)由两名以上行政执法人员实施;(三)出示执法身份证件;(四)通知当事人到场;(五)当场告知当事人采取行政强制措施的理由、依据以及当事人依法享有的权利、救济途径;(六)听取当事人的陈述和申辩;(七)制作现场笔录;(八)现场笔录由当事人和行政执法人员签名或者盖章，当事人拒绝的，在笔录中予以注明;(九)当事人不到场的，邀请见证人到场，由见证人和行政执法人员在现场笔录上签名或者盖章;(十)法律、法规规定的其他程序。","material":"","sources":["判断题·190（段落6636）"],"warnings":[],"number":845},{"id":"8826abd65270d760861c","type":"judge","category":"judge","stem":"情况紧急，需要当场实施行政强制措施的，行政执法人员应当在二十四小时内向行政机关负责人报告，不再需要办理批准手续（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第十九条　情况紧急，需要当场实施行政强制措施的，行政执法人员应当在二十四小时内向行政机关负责人报告，并补办批准手续。行政机关负责人认为不应当采取行政强制措施的，应当立即解除。","material":"","sources":["判断题·193（段落6651）"],"warnings":[],"number":848},{"id":"083be1a2747c94b7b420","type":"judge","category":"judge","stem":"违法行为涉嫌犯罪应当移送司法机关的，行政机关应当将查封、扣押、冻结的财物一并移送，并口头告知当事人。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第二十条　依照法律规定实施限制公民人身自由的行政强制措施，除应当履行本法第十八条规定的程序外，还应当遵守下列规定：(一)当场告知或者实施行政强制措施后立即通知当事人家属实施行政强制措施的行政机关、地点和期限;(二)在紧急情况下当场实施行政强制措施的，在返回行政机关后，立即向行政机关负责人报告并补办批准手续;(三)法律规定的其他程序。\n实施限制人身自由的行政强制措施不得超过法定期限。实施行政强制措施的目的已经达到或者条件已经消失，应当立即解除。","material":"","sources":["判断题·196（段落6668）"],"warnings":[],"number":851},{"id":"acbf1d54e3b420fff2c8","type":"judge","category":"judge","stem":"查封、扣押的期间包括检测、检验、检疫或者技术鉴定的期间（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第二十五条　查封、扣押的期限不得超过三十日;情况复杂的，经行政机关负责人批准，可以延长，但是延长期限不得超过三十日。法律、行政法规另有规定的除外。\n延长查封、扣押的决定应当及时书面告知当事人，并说明理由。\n对物品需要进行检测、检验、检疫或者技术鉴定的，查封、扣押的期间不包括检测、检验、检疫或者技术鉴定的期间。检测、检验、检疫或者技术鉴定的期间应当明确，并书面告知当事人。检测、检验、检疫或者技术鉴定的费用由行政机关承担。","material":"","sources":["判断题·201（段落6699）"],"warnings":[],"number":856},{"id":"812886b15eb822335038","type":"judge","category":"judge","stem":"因查封、扣押发生的保管费用由当事人承担（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第二十六条　对查封、扣押的场所、设施或者财物，行政机关应当妥善保管，不得使用或者损毁;造成损失的，应当承担赔偿责任。\n对查封的场所、设施或者财物，行政机关可以委托第三人保管，第三人不得损毁或者擅自转移、处置。因第三人的原因造成的损失，行政机关先行赔付后，有权向第三人追偿。\n因查封、扣押发生的保管费用由行政机关承担。","material":"","sources":["判断题·204（段落6720）"],"warnings":[],"number":859},{"id":"6eef7f91bde6d5fe024d","type":"judge","category":"judge","stem":"自冻结存款、汇款之日起三十日内，行政机关应当作出处理决定或者作出解除冻结决定；情况复杂的，经行政机关负责人批准，可以延长，但是延长期限不得超过二十日（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第三十二条　自冻结存款、汇款之日起三十日内，行政机关应当作出处理决定或者作出解除冻结决定;情况复杂的，经行政机关负责人批准，可以延长，但是延长期限不得超过三十日。法律另有规定的除外。\n延长冻结的决定应当及时书面告知当事人，并说明理由。","material":"","sources":["判断题·208（段落6746）"],"warnings":[],"number":863},{"id":"8b47950fa6748cb8f705","type":"judge","category":"judge","stem":"延长冻结的决定应当及时可以口头告知当事人，并说明理由（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第三十二条　自冻结存款、汇款之日起三十日内，行政机关应当作出处理决定或者作出解除冻结决定;情况复杂的，经行政机关负责人批准，可以延长，但是延长期限不得超过三十日。法律另有规定的除外。\n延长冻结的决定应当及时书面告知当事人，并说明理由。","material":"","sources":["判断题·209（段落6752）"],"warnings":[],"number":864},{"id":"68e121ca3ee4cd937831","type":"judge","category":"judge","stem":"行政机关作出解除冻结决定的，应当及时通知金融机构和当事人。金融机构接到通知后，应当2个工作日内解除冻结（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第三十三条　有下列情形之一的，行政机关应当及时作出解除冻结决定：(一)当事人没有违法行为;(二)冻结的存款、汇款与违法行为无关;(三)行政机关对违法行为已经作出处理决定，不再需要冻结;(四)冻结期限已经届满;(五)其他不再需要采取冻结措施的情形。\n行政机关作出解除冻结决定的，应当及时通知金融机构和当事人。金融机构接到通知后，应当立即解除冻结。\n行政机关逾期未作出处理决定或者解除冻结决定的，金融机构应当自冻结期满之日起解除冻结。","material":"","sources":["判断题·210（段落6758）"],"warnings":[],"number":865},{"id":"5031d3621b975e85c029","type":"judge","category":"judge","stem":"未经过行政机关的同意，金融机构一律不得解除冻结（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第三十三条　有下列情形之一的，行政机关应当及时作出解除冻结决定：(一)当事人没有违法行为;(二)冻结的存款、汇款与违法行为无关;(三)行政机关对违法行为已经作出处理决定，不再需要冻结;(四)冻结期限已经届满;(五)其他不再需要采取冻结措施的情形。\n行政机关作出解除冻结决定的，应当及时通知金融机构和当事人。金融机构接到通知后，应当立即解除冻结。\n行政机关逾期未作出处理决定或者解除冻结决定的，金融机构应当自冻结期满之日起解除冻结。","material":"","sources":["判断题·212（段落6772）"],"warnings":[],"number":867},{"id":"afe972daa9496b257d58","type":"judge","category":"judge","stem":"公民死亡，无遗产可供执行，又无义务承受人的，中止执行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第四十条　有下列情形之一的，终结执行：(一)公民死亡，无遗产可供执行，又无义务承受人的;(二)法人或者其他组织终止，无财产可供执行，又无义务承受人的;(三)执行标的灭失的;(四)据以执行的行政决定被撤销的;(五)行政机关认为需要终结执行的其他情形。","material":"","sources":["判断题·218（段落6809）"],"warnings":[],"number":873},{"id":"a52aa740a48df6034db9","type":"judge","category":"judge","stem":"情况紧急下，行政机关不得对居民生活采取停止供水、供电、供热、供燃气等方式迫使当事人履行相关行政决定。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第四十三条　行政机关不得在夜间或者法定节假日实施行政强制执行。但是，情况紧急的除外。\n行政机关不得对居民生活采取停止供水、供电、供热、供燃气等方式迫使当事人履行相关行政决定。","material":"","sources":["判断题·222（段落6831）"],"warnings":[],"number":877},{"id":"18afb366fe8f4a06f172","type":"judge","category":"judge","stem":"行政机关申请人民法院强制执行前，可以不催告当事人履行义务。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第五十四条　行政机关申请人民法院强制执行前，应当催告当事人履行义务。催告书送达十日后当事人仍未履行义务的，行政机关可以向所在地有管辖权的人民法院申请强制执行;执行对象是不动产的，向不动产所在地有管辖权的人民法院申请强制执行。","material":"","sources":["判断题·231（段落6885）"],"warnings":[],"number":886},{"id":"5589e0cc52104b91b0d5","type":"judge","category":"judge","stem":"人民法院接到行政机关强制执行的申请，应当在十日内受理。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政强制法》，第五十四条　行政机关申请人民法院强制执行前，应当催告当事人履行义务。催告书送达十日后当事人仍未履行义务的，行政机关可以向所在地有管辖权的人民法院申请强制执行;执行对象是不动产的，向不动产所在地有管辖权的人民法院申请强制执行。","material":"","sources":["判断题·232（段落6890）"],"warnings":[],"number":887},{"id":"bfe9244e94c566ca6aec","type":"judge","category":"judge","stem":"根据《国家赔偿法》规定，受害的公民死亡，有扶养关系的亲属无权要求赔偿（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第六条　受害的公民、法人和其他组织有权要求赔偿。\n受害的公民死亡，其继承人和其他有扶养关系的亲属有权要求赔偿。\n受害的法人或者其他组织终止的，其权利承受人有权要求赔偿。","material":"","sources":["判断题·240（段落6940）"],"warnings":[],"number":895},{"id":"454a529f64e1b87a87f9","type":"judge","category":"judge","stem":"两个以上行政机关共同行使行政职权时侵犯公民、法人和其他组织的合法权益造成损害的，共同行使行政职权的行政机关协商其中一个为赔偿义务机关（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第七条　行政机关及其工作人员行使行政职权侵犯公民、法人和其他组织的合法权益造成损害的，该行政机关为赔偿义务机关。\n两个以上行政机关共同行使行政职权时侵犯公民、法人和其他组织的合法权益造成损害的，共同行使行政职权的行政机关为共同赔偿义务机关。\n法律、法规授权的组织在行使授予的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，被授权的组织为赔偿义务机关。\n受行政机关委托的组织或者个人在行使受委托的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，委托的行政机关为赔偿义务机关。\n赔偿义务机关被撤销的，继续行使其职权的行政机关为赔偿义务机关;没有继续行使其职权的行政机关的，撤销该赔偿义务机关的行政机关为赔偿义务机关。","material":"","sources":["判断题·243（段落6963）"],"warnings":[],"number":898},{"id":"658824fb7b32c5b4e491","type":"judge","category":"judge","stem":"法律、法规授权的组织在行使授予的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，授权组织为赔偿义务机关（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第七条　行政机关及其工作人员行使行政职权侵犯公民、法人和其他组织的合法权益造成损害的，该行政机关为赔偿义务机关。\n两个以上行政机关共同行使行政职权时侵犯公民、法人和其他组织的合法权益造成损害的，共同行使行政职权的行政机关为共同赔偿义务机关。\n法律、法规授权的组织在行使授予的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，被授权的组织为赔偿义务机关。\n受行政机关委托的组织或者个人在行使受委托的行政权力时侵犯公民、法人和其他组织的合法权益造成损害的，委托的行政机关为赔偿义务机关。\n赔偿义务机关被撤销的，继续行使其职权的行政机关为赔偿义务机关;没有继续行使其职权的行政机关的，撤销该赔偿义务机关的行政机关为赔偿义务机关。","material":"","sources":["判断题·244（段落6972）"],"warnings":[],"number":899},{"id":"2951afc8e4f191d55ede","type":"judge","category":"judge","stem":"经复议机关复议的，最初造成侵权行为的行政机关为赔偿义务机关，但复议机关的复议决定加重损害的，复议机关对所有损害履行赔偿义务（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第八条　经复议机关复议的，最初造成侵权行为的行政机关为赔偿义务机关，但复议机关的复议决定加重损害的，复议机关对加重的部分履行赔偿义务。","material":"","sources":["判断题·248（段落7004）"],"warnings":[],"number":903},{"id":"06472b685794d6f4f1c7","type":"judge","category":"judge","stem":"赔偿请求人要求赔偿，必须在申请行政复议或者提起行政诉讼时一并提出（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，　第九条　赔偿义务机关有本法第三条、第四条规定情形之一的，应当给予赔偿。\n赔偿请求人要求赔偿，应当先向赔偿义务机关提出，也可以在申请行政复议或者提起行政诉讼时一并提出。","material":"","sources":["判断题·250（段落7015）"],"warnings":[],"number":905},{"id":"638e004c4117bc3c3555","type":"judge","category":"judge","stem":"赔偿请求人根据受到的不同损害，应当同时提出数项赔偿要求（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第十一条　赔偿请求人根据受到的不同损害，可以同时提出数项赔偿要求。","material":"","sources":["判断题·253（段落7031）"],"warnings":[],"number":908},{"id":"f5880ec37c9f80068d8e","type":"judge","category":"judge","stem":"赔偿请求人要求赔偿的，必须书面提出，可以委托他人代书（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，　　第十二条　要求赔偿应当递交申请书，申请书应当载明下列事项：\n(一)受害人的姓名、性别、年龄、工作单位和住所，法人或者其他组织的名称、住所和法定代表人或者主要负责人的姓名、职务;\n(二)具体的要求、事实根据和理由;\n(三)申请的年、月、日。\n赔偿请求人书写申请书确有困难的，可以委托他人代书;也可以口头申请，由赔偿义务机关记入笔录。\n赔偿请求人不是受害人本人的，应当说明与受害人的关系，并提供相应证明。\n赔偿请求人当面递交申请书的，赔偿义务机关应当当场出具加盖本行政机关专用印章并注明收讫日期的书面凭证。申请材料不齐全的，赔偿义务机关应当当场或者在五日内一次性告知赔偿请求人需要补正的全部内容。","material":"","sources":["判断题·254（段落7036）"],"warnings":[],"number":909},{"id":"129e5e4daf909740beb4","type":"judge","category":"judge","stem":"根据《国家赔偿法》规定，行政赔偿中不得协商（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，　　第十三条　赔偿义务机关应当自收到申请之日起两个月内，作出是否赔偿的决定。赔偿义务机关作出赔偿决定，应当充分听取赔偿请求人的意见，并可以与赔偿请求人就赔偿方式、赔偿项目和赔偿数额依照本法第四章的规定进行协商。\n赔偿义务机关决定赔偿的，应当制作赔偿决定书，并自作出决定之日起十日内送达赔偿请求人。\n赔偿义务机关决定不予赔偿的，应当自作出决定之日起十日内书面通知赔偿请求人，并说明不予赔偿的理由。","material":"","sources":["判断题·257（段落7065）"],"warnings":[],"number":912},{"id":"62ce07c2e38da2f850f8","type":"judge","category":"judge","stem":"赔偿义务机关决定不予赔偿的，应当自作出决定之日起十五日内书面通知赔偿请求人，并说明不予赔偿的理由（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第十三条　赔偿义务机关应当自收到申请之日起两个月内，作出是否赔偿的决定。赔偿义务机关作出赔偿决定，应当充分听取赔偿请求人的意见，并可以与赔偿请求人就赔偿方式、赔偿项目和赔偿数额依照本法第四章的规定进行协商。\n赔偿义务机关决定赔偿的，应当制作赔偿决定书，并自作出决定之日起十日内送达赔偿请求人。\n赔偿义务机关决定不予赔偿的，应当自作出决定之日起十日内书面通知赔偿请求人，并说明不予赔偿的理由。","material":"","sources":["判断题·259（段落7079）"],"warnings":[],"number":914},{"id":"a865024e81aa3a9be803","type":"judge","category":"judge","stem":"人民法院审理行政赔偿案件，由赔偿义务机关提供证据（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，　　第十五条　人民法院审理行政赔偿案件，赔偿请求人和赔偿义务机关对自己提出的主张，应当提供证据。\n赔偿义务机关采取行政拘留或者限制人身自由的强制措施期间，被限制人身自由的人死亡或者丧失行为能力的，赔偿义务机关的行为与被限制人身自由的人的死亡或者丧失行为能力是否存在因果关系，赔偿义务机关应当提供证据。","material":"","sources":["判断题·261（段落7092）"],"warnings":[],"number":916},{"id":"c12c3a96f100dc49f6b5","type":"judge","category":"judge","stem":"赔偿义务机关赔偿损失后，可以责令有故意或者重大过失的工作人员或者受委托的组织或者个人承担部分或者全部赔偿费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第十六条　赔偿义务机关赔偿损失后，应当责令有故意或者重大过失的工作人员或者受委托的组织或者个人承担部分或者全部赔偿费用。","material":"","sources":["判断题·265（段落7115）"],"warnings":[],"number":920},{"id":"c7588d62a6519f2d295b","type":"judge","category":"judge","stem":"赔偿义务机关赔偿损失后，应当责令有故意的工作人员或者受委托的组织或者个人承担部分或者全部赔偿费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第十六条　赔偿义务机关赔偿损失后，应当责令有故意或者重大过失的工作人员或者受委托的组织或者个人承担部分或者全部赔偿费用。","material":"","sources":["判断题·266（段落7120）"],"warnings":[],"number":921},{"id":"9d75fe15eb87429fbc59","type":"judge","category":"judge","stem":"赔偿义务机关赔偿损失后，可以责令有故意或者重大过失的工作人员或者受委托的组织或者个人承担部分赔偿费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第十六条　赔偿义务机关赔偿损失后，应当责令有故意或者重大过失的工作人员或者受委托的组织或者个人承担部分或者全部赔偿费用。","material":"","sources":["判断题·267（段落7125）"],"warnings":[],"number":922},{"id":"b1d020ee38600f82eaef","type":"judge","category":"judge","stem":"国家赔偿以支付赔偿金为唯一方式（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第三十二条　国家赔偿以支付赔偿金为主要方式。\n能够返还财产或者恢复原状的，予以返还财产或者恢复原状。","material":"","sources":["判断题·268（段落7130）"],"warnings":[],"number":923},{"id":"00db78802a1cec1c240e","type":"judge","category":"judge","stem":"国家赔偿法规定，赔偿费用列入各赔偿义务机关财政预算（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第三十七条　赔偿费用列入各级财政预算。\n赔偿请求人凭生效的判决书、复议决定书、赔偿决定书或者调解书，向赔偿义务机关申请支付赔偿金。\n赔偿义务机关应当自收到支付赔偿金申请之日起七日内，依照预算管理权限向有关的财政部门提出支付申请。财政部门应当自收到支付申请之日起十五日内支付赔偿金。","material":"","sources":["判断题·276（段落7190）"],"warnings":[],"number":931},{"id":"b7d48bae680462569e0a","type":"judge","category":"judge","stem":"国家赔偿中，返还执行的罚款或者罚金、追缴或者没收的金钱，解除冻结的存款或者汇款的，不支付银行同期存款利息（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，　第三十六条　侵犯公民、法人和其他组织的财产权造成损害的，按照下列规定处理：\n(一)处罚款、罚金、追缴、没收财产或者违法征收、征用财产的，返还财产;\n(二)查封、扣押、冻结财产的，解除对财产的查封、扣押、冻结，造成财产损坏或者灭失的，依照本条第三项、第四项的规定赔偿;\n(三)应当返还的财产损坏的，能够恢复原状的恢复原状，不能恢复原状的，按照损害程度给付相应的赔偿金;\n(四)应当返还的财产灭失的，给付相应的赔偿金;\n(五)财产已经拍卖或者变卖的，给付拍卖或者变卖所得的价款;变卖的价款明显低于财产价值的，应当支付相应的赔偿金;\n(六)吊销许可证和执照、责令停产停业的，赔偿停产停业期间必要的经常性费用开支;\n(七)返还执行的罚款或者罚金、追缴或者没收的金钱，解除冻结的存款或者汇款的，应当支付银行同期存款利息;\n(八)对财产权造成其他损害的，按照直接损失给予赔偿。","material":"","sources":["判断题·278（段落7210）"],"warnings":[],"number":933},{"id":"6fd8b663dc892729ba7f","type":"judge","category":"judge","stem":"国家赔偿中，对致人精神损害的，应当在侵权行为影响的范围内，为受害人消除影响，恢复名誉，赔礼道歉，还应当支付相应的精神损害抚慰金（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第三十五条　有本法第三条或者第十七条规定情形之一，致人精神损害的，应当在侵权行为影响的范围内，为受害人消除影响，恢复名誉，赔礼道歉;造成严重后果的，应当支付相应的精神损害抚慰金。","material":"","sources":["判断题·282（段落7254）"],"warnings":[],"number":937},{"id":"1a5f99514656207adc50","type":"judge","category":"judge","stem":"根据《国家赔偿法》规定，赔偿请求人请求国家赔偿的时效为两年，自其知道或者应当知道国家机关及其工作人员行使职权时的行为侵犯其人身权、财产权之日起计算，含被羁押等限制人身自由期间不计算在内（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第三十九条　赔偿请求人请求国家赔偿的时效为两年，自其知道或者应当知道国家机关及其工作人员行使职权时的行为侵犯其人身权、财产权之日起计算，但被羁押等限制人身自由期间不计算在内。在申请行政复议或者提起行政诉讼时一并提出赔偿请求的，适用行政复议法、行政诉讼法有关时效的规定。\n赔偿请求人在赔偿请求时效的最后六个月内，因不可抗力或者其他障碍不能行使请求权的，时效中止。从中止时效的原因消除之日起，赔偿请求时效期间继续计算。","material":"","sources":["判断题·286（段落7277）"],"warnings":[],"number":941},{"id":"cfbbc83327188096ae83","type":"judge","category":"judge","stem":"国家赔偿法未将精神损害赔偿纳入国家赔偿范围（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第三十五条　有本法第三条或者第十七条规定情形之一，致人精神损害的，应当在侵权行为影响的范围内，为受害人消除影响，恢复名誉，赔礼道歉;造成严重后果的，应当支付相应的精神损害抚慰金。","material":"","sources":["判断题·295（段落7343）"],"warnings":[],"number":950},{"id":"ce1bdd7c948e1ffe2626","type":"judge","category":"judge","stem":"受害的法人或者其他组织终止，国家不再承担赔偿责任（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第六条　受害的公民、法人和其他组织有权要求赔偿。\n受害的公民死亡，其继承人和其他有扶养关系的亲属有权要求赔偿。\n受害的法人或者其他组织终止的，其权利承受人有权要求赔偿。","material":"","sources":["判断题·300（段落7377）"],"warnings":[],"number":954},{"id":"5b927ed79eecfa80ec03","type":"judge","category":"judge","stem":"受害人死亡，国家不再承担赔偿责任（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《国家赔偿法》，第六条　受害的公民、法人和其他组织有权要求赔偿。\n受害的公民死亡，其继承人和其他有扶养关系的亲属有权要求赔偿。\n受害的法人或者其他组织终止的，其权利承受人有权要求赔偿。","material":"","sources":["判断题·301（段落7384）"],"warnings":[],"number":955},{"id":"e25460636cf95a49801c","type":"judge","category":"judge","stem":"行政复议只防止和纠正违法具体行政行为（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第一条 为了防止和纠正违法的或者不当的具体行政行为，保护公民、法人和其他组织的合法权益，保障和监督行政机关依法行使职权，根据宪法，制定本法。","material":"","sources":["判断题·303（段落7396）"],"warnings":[],"number":957},{"id":"d8c0671a41a60877011c","type":"judge","category":"judge","stem":"公民、法人或者其他组织对所有行政复议决定不服的，可以依照行政诉讼法的规定向人民法院提起行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第五条 公民、法人或者其他组织对行政复议决定不服的，可以依照行政诉讼法的规定向人民法院提起行政诉讼，但是法律规定行政复议决定为最终裁决的除外。","material":"","sources":["判断题·306（段落7411）"],"warnings":[],"number":960},{"id":"f33bfdd874891436d6a9","type":"judge","category":"judge","stem":"湛江大李村村民认为行政机关变更未到期的农业承包合同，侵犯其合法权益的，不能提起复议（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第二条 公民、法人或者其他组织认为具体行政行为侵犯其合法权益，向行政机关提出行政复议申请，行政机关受理行政复议申请、作出行政复议决定，适用本法。","material":"","sources":["判断题·312（段落7441）"],"warnings":[],"number":966},{"id":"df4d88e41c5e626faadd","type":"judge","category":"judge","stem":"宏发股份有限公司认为广州财政局违法摊派费用的，不能提复议（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第二条 公民、法人或者其他组织认为具体行政行为侵犯其合法权益，向行政机关提出行政复议申请，行政机关受理行政复议申请、作出行政复议决定，适用本法。","material":"","sources":["判断题·313（段落7446）"],"warnings":[],"number":967},{"id":"b363decf2431074a414b","type":"judge","category":"judge","stem":"公民、法人或者其他组织行政复议中，不得要求对乡、镇人民政府的规定进行审查（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第七条 公民、法人或者其他组织认为行政机关的具体行政行为所依据的下列规定不合法，在对具体行政行为申请行政复议时，可以一并向行政复议机关提出对该规定的审查申请：\n(一)国务院部门的规定;\n(二)县级以上地方各级人民政府及其工作部门的规定;\n(三)乡、镇人民政府的规定。\n前款所列规定不含国务院部、委员会规章和地方人民政府规章。规章的审查依照法律、行政法规办理。","material":"","sources":["判断题·315（段落7456）"],"warnings":[],"number":969},{"id":"d543785d90d2a5cfa86e","type":"judge","category":"judge","stem":"公民、法人或者其他组织认为行政机关的具体行政行为所依据的规章不合法，在对具体行政行为申请行政复议时，可以一并向行政复议机关提出对该规章的审查申请（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第七条 公民、法人或者其他组织认为行政机关的具体行政行为所依据的下列规定不合法，在对具体行政行为申请行政复议时，可以一并向行政复议机关提出对该规定的审查申请：\n(一)国务院部门的规定;\n(二)县级以上地方各级人民政府及其工作部门的规定;\n(三)乡、镇人民政府的规定。\n前款所列规定不含国务院部、委员会规章和地方人民政府规章。规章的审查依照法律、行政法规办理。","material":"","sources":["判断题·316（段落7465）"],"warnings":[],"number":970},{"id":"ef416553ea582c49759c","type":"judge","category":"judge","stem":"不服行政机关作出的行政处分或者其他人事处理决定的，依照有关法律、行政法规的规定提出行政复议（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第八条 不服行政机关作出的行政处分或者其他人事处理决定的，依照有关法律、行政法规的规定提出申诉。\n不服行政机关对民事纠纷作出的调解或者其他处理，依法申请仲裁或者向人民法院提起诉讼。","material":"","sources":["判断题·317（段落7474）"],"warnings":[],"number":971},{"id":"3332812260841219ee16","type":"judge","category":"judge","stem":"公民、法人或者其他组织不服行政机关对民事纠纷作出的调解或者其他处理，可以提出行政复议（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第八条 不服行政机关作出的行政处分或者其他人事处理决定的，依照有关法律、行政法规的规定提出申诉。\n不服行政机关对民事纠纷作出的调解或者其他处理，依法申请仲裁或者向人民法院提起诉讼。","material":"","sources":["判断题·318（段落7480）"],"warnings":[],"number":972},{"id":"61747baf4767fa22434c","type":"judge","category":"judge","stem":"申请人申请行政复议，必须书面申请（ ）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第十一条 申请人申请行政复议，可以书面申请，也可以口头申请;口头申请的，行政复议机关应当当场记录申请人的基本情况、行政复议请求、申请行政复议的主要事实、理由和时间。","material":"","sources":["判断题·325（段落7528）"],"warnings":[],"number":979},{"id":"fa6ae6d592b1ff09aa40","type":"judge","category":"judge","stem":"对两个或者两个以上行政机关以共同的名义作出的具体行政行为不服的，向其其中一个机关上一级行政机关申请行政复议（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，十五条 对本法第十二条、第十三条、第十四条规定以外的其他行政机关、组织的具体行政行为不服的，按照下列规定申请行政复议：\n(一)对县级以上地方人民政府依法设立的派出机关的具体行政行为不服的，向设立该派出机关的人民政府申请行政复议;\n(二)对政府工作部门依法设立的派出机构依照法律、法规或者规章规定，以自己的名义作出的具体行政行为不服的，向设立该派出机构的部门或者该部门的本级地方人民政府申请行政复议;\n(三)对法律、法规授权的组织的具体行政行为不服的，分别向直接管理该组织的地方人民政府、地方人民政府工作部门或者国务院部门申请行政复议;\n(四)对两个或者两个以上行政机关以共同的名义作出的具体行政行为不服的，向其共同上一级行政机关申请行政复议;\n(五)对被撤销的行政机关在撤销前所作出的具体行政行为不服的，向继续行使其职权的行政机关的上一级行政机关申请行政复议。\n有前款所列情形之一的，申请人也可以向具体行政行为发生地的县级地方人民政府提出行政复议申请，由接受申请的县级地方人民政府依照本法第十八条的规定办理。","material":"","sources":["判断题·332（段落7589）"],"warnings":[],"number":986},{"id":"388fa77d5281714cece9","type":"judge","category":"judge","stem":"公民、法人或者其他组织申请行政复议，行政复议机关已经依法受理的，或者法律、法规规定应当先向行政复议机关申请行政复议、对行政复议决定不服再向人民法院提起行政诉讼的，在法定行政复议期限内也可以向人民法院提起行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第十六条 公民、法人或者其他组织申请行政复议，行政复议机关已经依法受理的，或者法律、法规规定应当先向行政复议机关申请行政复议、对行政复议决定不服再向人民法院提起行政诉讼的，在法定行政复议期限内不得向人民法院提起行政诉讼。\n公民、法人或者其他组织向人民法院提起行政诉讼，人民法院已经依法受理的，不得申请行政复议。","material":"","sources":["判断题·333（段落7600）"],"warnings":[],"number":987},{"id":"3c38b44f434fd836402f","type":"judge","category":"judge","stem":"行政复议决定作出前，申请人要求撤回行政复议申请的，经说明理由，可以撤回；撤回行政复议申请的，行政复议中止（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第二十五条 行政复议决定作出前，申请人要求撤回行政复议申请的，经说明理由，可以撤回;撤回行政复议申请的，行政复议终止。","material":"","sources":["判断题·342（段落7657）"],"warnings":[],"number":996},{"id":"01b8e3454b6ad216988e","type":"judge","category":"judge","stem":"申请人在申请行政复议时没有提出行政赔偿请求的，行政复议机关在依法决定撤销或者变更罚款，撤销违法集资、没收财物、征收财物、摊派费用以及对财产的查封、扣押、冻结等具体行政行为时，不得责令被申请人返还财产，解除对财产的查封、扣押、冻结措施，或者赔偿相应的价款（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第二十九条 申请人在申请行政复议时可以一并提出行政赔偿请求，行政复议机关对符合国家赔偿法的有关规定应当给予赔偿的，在决定撤销、变更具体行政行为或者确认具体行政行为违法时，应当同时决定被申请人依法给予赔偿。\n申请人在申请行政复议时没有提出行政赔偿请求的，行政复议机关在依法决定撤销或者变更罚款，撤销违法集资、没收财物、征收财物、摊派费用以及对财产的查封、扣押、冻结等具体行政行为时，应当同时责令被申请人返还财产，解除对财产的查封、扣押、冻结措施，或者赔偿相应的价款。","material":"","sources":["判断题·346（段落7692）"],"warnings":[],"number":1000},{"id":"8545d2860771223e7400","type":"judge","category":"judge","stem":"公民、法人或者其他组织认为行政机关的具体行政行为侵犯其已经依法取得的土地、矿藏、水流、森林、山岭、草原、荒地、滩涂、海域等自然资源的所有权或者使用权的，可以先申请行政复议，也可以提起诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第三十条 公民、法人或者其他组织认为行政机关的具体行政行为侵犯其已经依法取得的土地、矿藏、水流、森林、山岭、草原、荒地、滩涂、海域等自然资源的所有权或者使用权的，应当先申请行政复议;对行政复议决定不服的，可以依法向人民法院提起行政诉讼。\n根据国务院或者省、自治区、直辖市人民政府对行政区划的勘定、调整或者征用土地的决定，省、自治区、直辖市人民政府确认土地、矿藏、水流、森林、山岭、草原、荒地、滩涂、海域等自然资源的所有权或者使用权的行政复议决定为最终裁决。","material":"","sources":["判断题·347（段落7698）"],"warnings":[],"number":1001},{"id":"c2ae4a317543cdb7ba59","type":"judge","category":"judge","stem":"行政复议机关受理行政复议申请，可以向申请人收取工本费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第三十九条 行政复议机关受理行政复议申请，不得向申请人收取任何费用。行政复议活动所需经费，应当列入本机关的行政经费，由本级财政予以保障。","material":"","sources":["判断题·351（段落7724）"],"warnings":[],"number":1005},{"id":"df309e9a75f8d30ee885","type":"judge","category":"judge","stem":"行政复议法关于行政复议期间有关“五日”、“七日”的规定是指自然日（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第四十条 行政复议期间的计算和行政复议文书的送达，依照民事诉讼法关于期间、送达的规定执行。\n本法关于行政复议期间有关“五日”、“七日”的规定是指工作日，不含节假日。","material":"","sources":["判断题·354（段落7741）"],"warnings":[],"number":1008},{"id":"2457fb21cd4db8502442","type":"judge","category":"judge","stem":"行政复议第三人不参加行政复议，政复议案不得进行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第九条　行政复议期间，行政复议机构认为申请人以外的公民、法人或者其他组织与被审查的具体行政行为有利害关系的，可以通知其作为第三人参加行政复议。\n行政复议期间，申请人以外的公民、法人或者其他组织与被审查的具体行政行为有利害关系的，可以向行政复议机构申请作为第三人参加行政复议。\n第三人不参加行政复议，不影响行政复议案件的审理。","material":"","sources":["判断题·356（段落7752）"],"warnings":[],"number":1010},{"id":"c4f5402b1a5649df66fa","type":"judge","category":"judge","stem":"行政机关与其他组织以共同名义作出具体行政行为的，行政机关和其他组织为共同被申请人（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第十二条　行政机关与法律、法规授权的组织以共同的名义作出具体行政行为的，行政机关和法律、法规授权的组织为共同被申请人。\n行政机关与其他组织以共同名义作出具体行政行为的，行政机关为被申请人。","material":"","sources":["判断题·358（段落7765）"],"warnings":[],"number":1012},{"id":"778e488ed62fa4eca873","type":"judge","category":"judge","stem":"申请人书面申请行政复议的，只能采取当面递交提出行政复议申请（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第十八条　申请人书面申请行政复议的，可以采取当面递交、邮寄或者传真等方式提出行政复议申请。\n有条件的行政复议机构可以接受以电子邮件形式提出的行政复议申请。","material":"","sources":["判断题·361（段落7781）"],"warnings":[],"number":1015},{"id":"ce844a2070fa795c15ed","type":"judge","category":"judge","stem":"申请人提出行政复议申请时错列被申请人的，行政复议机构不予受理（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第二十二条　申请人提出行政复议申请时错列被申请人的，行政复议机构应当告知申请人变更被申请人。","material":"","sources":["判断题·363（段落7793）"],"warnings":[],"number":1017},{"id":"2659a76591d08db5e9aa","type":"judge","category":"judge","stem":"行政复议期间涉及专门事项需要鉴定的，当事人可以自行委托鉴定机构进行鉴定，也可以申请行政复议机构委托鉴定机构进行鉴定。鉴定费用由财政承担（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第三十七条　行政复议期间涉及专门事项需要鉴定的，当事人可以自行委托鉴定机构进行鉴定，也可以申请行政复议机构委托鉴定机构进行鉴定。鉴定费用由当事人承担。鉴定所用时间不计入行政复议审理期限。","material":"","sources":["判断题·368（段落7820）"],"warnings":[],"number":1022},{"id":"57ccda5ce7b5ce232798","type":"judge","category":"judge","stem":"行政复议期间被申请人改变原具体行政行为的，行政复议案件终止审理（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第四十二条　行政复议期间有下列情形之一的，行政复议终止：\n（一）申请人要求撤回行政复议申请，行政复议机构准予撤回的；\n（二）作为申请人的自然人死亡，没有近亲属或者其近亲属放弃行政复议权利的；\n（三）作为申请人的法人或者其他组织终止，其权利义务的承受人放弃行政复议权利的；\n（四）申请人与被申请人依照本条例第四十条的规定，经行政复议机构准许达成和解的；\n（五）申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因申请人同一违法行为涉嫌犯罪，该行政拘留或者限制人身自由的行政强制措施变更为刑事拘留的。\n依照本条例第四十一条第一款第（一）项、第（二）项、第（三）项规定中止行政复议，满60日行政复议中止的原因仍未消除的，行政复议终止。","material":"","sources":["判断题·370（段落7831）"],"warnings":[],"number":1024},{"id":"aa428a02ef3275865518","type":"judge","category":"judge","stem":"作为申请人的自然人下落不明或者被宣告失踪的，行政复议终止（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第四十二条　行政复议期间有下列情形之一的，行政复议终止：\n（一）申请人要求撤回行政复议申请，行政复议机构准予撤回的；\n（二）作为申请人的自然人死亡，没有近亲属或者其近亲属放弃行政复议权利的；\n（三）作为申请人的法人或者其他组织终止，其权利义务的承受人放弃行政复议权利的；\n（四）申请人与被申请人依照本条例第四十条的规定，经行政复议机构准许达成和解的；\n（五）申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因申请人同一违法行为涉嫌犯罪，该行政拘留或者限制人身自由的行政强制措施变更为刑事拘留的。\n依照本条例第四十一条第一款第（一）项、第（二）项、第（三）项规定中止行政复议，满60日行政复议中止的原因仍未消除的，行政复议终止。","material":"","sources":["判断题·371（段落7842）"],"warnings":[],"number":1025},{"id":"56a67977b174a374de6a","type":"judge","category":"judge","stem":"申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因申请人其他违法行为涉嫌犯罪，该行政拘留或者限制人身自由的行政强制措施变更为刑事拘留的，行政复议终止（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第四十二条　行政复议期间有下列情形之一的，行政复议终止：\n（一）申请人要求撤回行政复议申请，行政复议机构准予撤回的；\n（二）作为申请人的自然人死亡，没有近亲属或者其近亲属放弃行政复议权利的；\n（三）作为申请人的法人或者其他组织终止，其权利义务的承受人放弃行政复议权利的；\n（四）申请人与被申请人依照本条例第四十条的规定，经行政复议机构准许达成和解的；\n（五）申请人对行政拘留或者限制人身自由的行政强制措施不服申请行政复议后，因申请人同一违法行为涉嫌犯罪，该行政拘留或者限制人身自由的行政强制措施变更为刑事拘留的。\n依照本条例第四十一条第一款第（一）项、第（二）项、第（三）项规定中止行政复议，满60日行政复议中止的原因仍未消除的，行政复议终止。","material":"","sources":["判断题·375（段落7886）"],"warnings":[],"number":1029},{"id":"513ee88ca992a06f5421","type":"judge","category":"judge","stem":"行政复议机关在申请人的行政复议请求范围内，可以根据事实作出对申请人更为不利的行政复议决定（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政复议法》，第五十一条　行政复议机关在申请人的行政复议请求范围内，不得作出对申请人更为不利的行政复议决定。","material":"","sources":["判断题·383（段落7950）"],"warnings":[],"number":1037},{"id":"0c8b10c4c458513f705a","type":"judge","category":"judge","stem":"公民、法人和其他组织对外交行为可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·395（段落8103）"],"warnings":[],"number":1049},{"id":"e992687502f3a5449f01","type":"judge","category":"judge","stem":"公民、法人和其他组织对国防行为可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·396（段落8112）"],"warnings":[],"number":1050},{"id":"dde73a433e41ba230367","type":"judge","category":"judge","stem":"公民、法人和其他组织对发布行政法规、规章行为可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·397（段落8121）"],"warnings":[],"number":1051},{"id":"7b774b25ef5ce8306b20","type":"judge","category":"judge","stem":"公民、法人和其他组织对行政机关制定、发布的具有普遍约束力的决定、命令行为可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·398（段落8130）"],"warnings":[],"number":1052},{"id":"9df37cd73c2f909c2c77","type":"judge","category":"judge","stem":"公民、法人和其他组织对行政机关工作人员的奖惩、任免等决定可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·399（段落8139）"],"warnings":[],"number":1053},{"id":"eca830514229cac810fa","type":"judge","category":"judge","stem":"公民、法人和其他组织对法律规定由行政机关最终裁决的行政行为可以提起的行政诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十三条　人民法院不受理公民、法人或者其他组织对下列事项提起的诉讼：\n(一)国防、外交等国家行为;\n(二)行政法规、规章或者行政机关制定、发布的具有普遍约束力的决定、命令;\n(三)行政机关对行政机关工作人员的奖惩、任免等决定;\n(四)法律规定由行政机关最终裁决的行政行为。","material":"","sources":["判断题·400（段落8148）"],"warnings":[],"number":1054},{"id":"c60e0f3c9a13b7e63173","type":"judge","category":"judge","stem":"基层人民法院管辖所有第一审行政案件（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十四条　基层人民法院管辖第一审行政案件。","material":"","sources":["判断题·401（段落8157）"],"warnings":[],"number":1055},{"id":"8655f7b3d25431b759c9","type":"judge","category":"judge","stem":"确认发明专利权的案件、海关处理的案件的第一审行政案件由基层人民法院管辖（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十五条　中级人民法院管辖下列第一审行政案件：\n(一)对国务院部门或者县级以上地方人民政府所作的行政行为提起诉讼的案件;\n(二)海关处理的案件;\n(三)本辖区内重大、复杂的案件;\n(四)其他法律规定由中级人民法院管辖的案件。","material":"","sources":["判断题·402（段落8162）"],"warnings":[],"number":1056},{"id":"5ba4309f6c5ddc7c430c","type":"judge","category":"judge","stem":"对国务院各部门或者省、自治区、直辖市人民政府所作的行政行为提起诉讼的案件，由基层人民法院管辖（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十五条　中级人民法院管辖下列第一审行政案件：\n(一)对国务院部门或者县级以上地方人民政府所作的行政行为提起诉讼的案件;\n(二)海关处理的案件;\n(三)本辖区内重大、复杂的案件;\n(四)其他法律规定由中级人民法院管辖的案件。","material":"","sources":["判断题·403（段落8171）"],"warnings":[],"number":1057},{"id":"fbeeab987f0e8a7ebddf","type":"judge","category":"judge","stem":"对限制人身自由的行政强制措施不服提起的诉讼，只能由被告所在地人民法院管辖（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第十九条　对限制人身自由的行政强制措施不服提起的诉讼，由被告所在地或者原告所在地人民法院管辖。","material":"","sources":["判断题·406（段落8192）"],"warnings":[],"number":1060},{"id":"1d3ee8a678eb5ef9670b","type":"judge","category":"judge","stem":"人民法院对管辖权发生争议，由争议双方协商解决。协商不成的，报它们的上级人民法院指定管辖（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第二十三条　有管辖权的人民法院由于特殊原因不能行使管辖权的，由上级人民法院指定管辖。\n人民法院对管辖权发生争议，由争议双方协商解决。协商不成的，报它们的共同上级人民法院指定管辖。","material":"","sources":["判断题·410（段落8212）"],"warnings":[],"number":1064},{"id":"b029383b9320145c47d7","type":"judge","category":"judge","stem":"有权提起诉讼的公民死亡，其近亲属可以以法定代理人身份提起诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第二十五条　行政行为的相对人以及其他与行政行为有利害关系的公民、法人或者其他组织，有权提起诉讼。\n有权提起诉讼的公民死亡，其近亲属可以提起诉讼。\n有权提起诉讼的法人或者其他组织终止，承受其权利的法人或者其他组织可以提起诉讼。","material":"","sources":["判断题·411（段落8218）"],"warnings":[],"number":1065},{"id":"e601a66e0afe0d511c07","type":"judge","category":"judge","stem":"同提起诉讼的行政行为有利害关系的其他公民、法人或者其他组织，只能作为第三人申请参加诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第二十九条　公民、法人或者其他组织同被诉行政行为有利害关系但没有提起诉讼，或者同案件处理结果有利害关系的，可以作为第三人申请参加诉讼，或者由人民法院通知参加诉讼。\n人民法院判决第三人承担义务或者减损第三人权益的，第三人有权依法提起上诉。","material":"","sources":["判断题·419（段落8292）"],"warnings":[],"number":1073},{"id":"e7367a012644450dd019","type":"judge","category":"judge","stem":"当事人、法定代理人，可以委托二至三人代为诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第三十条　没有诉讼行为能力的公民，由其法定代理人代为诉讼。法定代理人互相推诿代理责任的，由人民法院指定其中一人代为诉讼。","material":"","sources":["判断题·422（段落8309）"],"warnings":[],"number":1076},{"id":"3463de023deb7375db18","type":"judge","category":"judge","stem":"行政诉讼中只有被告负举证责任，原告不承担举证责任（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第三十四条　被告对作出的行政行为负有举证责任，应当提供作出该行政行为的证据和所依据的规范性文件。\n被告不提供或者无正当理由逾期提供证据，视为没有相应证据。但是，被诉行政行为涉及第三人合法权益，第三人提供证据的除外。","material":"","sources":["判断题·426（段落8332）"],"warnings":[],"number":1080},{"id":"e6c7515aeb1628f85b7f","type":"judge","category":"judge","stem":"所有的行政案件，公民、法人和其他组织可以选择行政复议，也可以选择向法院起诉（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第四十四条　对属于人民法院受案范围的行政案件，公民、法人或者其他组织可以先向行政机关申请复议，对复议决定不服的，再向人民法院提起诉讼;也可以直接向人民法院提起诉讼。\n法律、法规规定应当先向行政机关申请复议，对复议决定不服再向人民法院提起诉讼的，依照法律、法规的规定。","material":"","sources":["判断题·429（段落8348）","判断题·563（段落9285）"],"warnings":[],"number":1083},{"id":"736cd3c43e1ee7b12089","type":"judge","category":"judge","stem":"所有的行政案件，公民、法人和其他组织必需先申请行政复议，对复议决定不服的向法院起诉（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第四十四条　对属于人民法院受案范围的行政案件，公民、法人或者其他组织可以先向行政机关申请复议，对复议决定不服的，再向人民法院提起诉讼;也可以直接向人民法院提起诉讼。\n法律、法规规定应当先向行政机关申请复议，对复议决定不服再向人民法院提起诉讼的，依照法律、法规的规定。","material":"","sources":["判断题·430（段落8354）","判断题·564（段落9291）"],"warnings":[],"number":1084},{"id":"7843a3f3d0c38ac5747f","type":"judge","category":"judge","stem":"人民法院应当公开审理所有的行政案件（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第五十四条　人民法院公开审理行政案件，但涉及国家秘密、个人隐私和法律另有规定的除外。\n涉及商业秘密的案件，当事人申请不公开审理的，可以不公开审理。","material":"","sources":["判断题·436（段落8393）","判断题·589（段落9456）"],"warnings":[],"number":1090},{"id":"831a959440a945b5d407","type":"judge","category":"judge","stem":"人民法院审理行政案件，可以采取一个审判员独任制形式（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第六十八条　人民法院审理行政案件，由审判员组成合议庭，或者由审判员、陪审员组成合议庭。合议庭的成员，应当是三人以上的单数。","material":"","sources":["判断题·438（段落8404）"],"warnings":[],"number":1092},{"id":"760a7e8b674e5ccbfa6d","type":"judge","category":"judge","stem":"当事人对申请人民法院回避的决定不服的，可以申请上诉（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第五十五条　当事人认为审判人员与本案有利害关系或者有其他关系可能影响公正审判，有权申请审判人员回避。\n审判人员认为自己与本案有利害关系或者有其他关系，应当申请回避。\n前两款规定，适用于书记员、翻译人员、鉴定人、勘验人。\n院长担任审判长时的回避，由审判委员会决定;审判人员的回避，由院长决定;其他人员的回避，由审判长决定。当事人对决定不服的，可以申请复议一次。","material":"","sources":["判断题·442（段落8433）"],"warnings":[],"number":1096},{"id":"dffdf12ffbdfdbdb232d","type":"judge","category":"judge","stem":"人民法院经过审理，行政行为证据确凿，适用法律、法规正确，符合法定程序的，判决驳回（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第六十九条 行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决驳回原告的诉讼请求。","material":"","sources":["判断题·449（段落8474）"],"warnings":[],"number":1103},{"id":"d6fd9c6ce408a7bedb04","type":"judge","category":"judge","stem":"人民法院判决被告重新作出行政行为的，被告不得以同样的事实和理由作出与原行政行为基本相同的行政行为（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第七十一条　人民法院判决被告重新作出行政行为的，被告不得以同一的事实和理由作出与原行政行为基本相同的行政行为。","material":"","sources":["判断题·454（段落8500）"],"warnings":[],"number":1108},{"id":"1fa359362a6fcb074572","type":"judge","category":"judge","stem":"当事人对重审案件的判决、裁定，不可以上诉（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第九十条　当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行。","material":"","sources":["判断题·457（段落8527）"],"warnings":[],"number":1111},{"id":"b1aa85e2bb7177dc59f2","type":"judge","category":"judge","stem":"当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向原审人民法院或者上一级人民法院提出申诉，判决、裁定停止执行（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第九十条　当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行。","material":"","sources":["判断题·458（段落8532）"],"warnings":[],"number":1112},{"id":"fdcce3c8487e15566b11","type":"judge","category":"judge","stem":"外国人、无国籍人、外国组织在中华人民共和国进行行政诉讼，委托律师代理诉讼的，经过中华人民共和国居外使馆同意，可以委托外国驻华机构的律师（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第一百零二条　外国人、无国籍人、外国组织在中华人民共和国进行行政诉讼，委托律师代理诉讼的，应当委托中华人民共和国律师机构的律师。","material":"","sources":["判断题·464（段落8566）"],"warnings":[],"number":1118},{"id":"c194627679627e839968","type":"judge","category":"judge","stem":"人民法院审理行政案件，不收取诉讼费用（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第一百零三条　人民法院审理行政案件，应当收取诉讼费用。诉讼费用由败诉方承担，双方都有责任的由双方分担。收取诉讼费用的具体办法另行规定。","material":"","sources":["判断题·465（段落8571）","判断题·617（段落9666）"],"warnings":[],"number":1119},{"id":"11f70618fce7e56ca5d8","type":"judge","category":"judge","stem":"公民、法人或者其他组织对行政指导行为不服提起诉讼的， 属于人民法院行政诉讼的受案范围（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第一条 公民、法人或者其他组织对具有国家行政职权的机关和组织及其工作人员的行政行为不服，依法提起诉讼的，属于人民法院行政诉讼的受案范围。\n公民、法人或者其他组织对下列行为不服提起诉讼的，不属于人民法院行政诉讼的受案范围：\n(一)行政诉讼法第十二条规定的行为；\n(二)公安、国家安全等机关依照刑事诉讼法的明确授权实施的行为；\n(三)调解行为以及法律规定的仲裁行为；\n(四)不具有强制力的行政指导行为；\n(五)驳回当事人对行政行为提起申诉的重复处理行为；\n(六)对公民、法人或者其他组织权利义务不产生实际影响的行为。","material":"","sources":["判断题·468（段落8595）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1122},{"id":"98a6bde55676222d65b7","type":"judge","category":"judge","stem":"股份企业的股东大会、股东代表大会、董事会等认为行政机关作出的行政行为侵犯企业经营自主权的，可以自己的名义提起诉讼（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第十八条 股份企业的股东大会、股东代表大会、董事会等认为行政机关作出的具体行政行为侵犯企业经营自主权的，可以企业名义提起诉讼。","material":"","sources":["判断题·485（段落8735）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1139},{"id":"4eeb49cc07dae2c62511","type":"judge","category":"judge","stem":"当事人不服经上级行政机关批准的行政行为，向人民法院提起诉讼的，应当以上级行政机关为被告（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第十九条 当事人不服经上级行政机关批准的具体行政行为，向人民法院提起诉讼的，应当以在对外发行法律效力的文书上署名的机关为被告。","material":"","sources":["判断题·487（段落8745）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1141},{"id":"e8d3ba2599715a9f5e0a","type":"judge","category":"judge","stem":"复议机关在法定期间内不作复议决定，当事人对原行政行为不服提起诉讼的，应当以复议机关为被告（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第二十二条复议机关在法定期间内不作复议决定，当事人对原具体行政行为不服提起诉讼的，应当以作出原具体行政行为的行政机关为被告；当事人对复议机关不作为不服提起诉讼的，应当以复议机关为被告。","material":"","sources":["判断题·492（段落8774）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1146},{"id":"70ff4f733b0fb95ab680","type":"judge","category":"judge","stem":"被告在作出行政行为时已经收集证据，但保管不善遗失不能提供的，经人民法院准许可以补充相关的证据（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第二十八条 有下列情形之一的，被告经人民法院准许可以补充相关的证据：\n(一)被告在作出具体行政行为时已经收集证据，但因不可抗力等正当事由不能提供的；\n(二)原告或者第三人在诉讼过程中，提出了其在被告实施行政行为过程中没有提出的反驳理由或者证据的。","material":"","sources":["判断题·499（段落8819）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1153},{"id":"19000fc5b92d116f1e5c","type":"judge","category":"judge","stem":"复议机关在复议过程中收集和补充的证据，可以作为人民法院维持原行政行为的根据（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第三十一条 未经法庭质证的证据不能作为人民法院裁判的根据。\n复议机关在复议过程中收集和补充的证据，不能作为人民法院维持原具体行政行为的根据。\n被告在二审过程中向法庭提交在一审过程中没有提交的证据，不能作为二审法院撤销或者变更一审裁判的根据。","material":"","sources":["判断题·502（段落8838）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1156},{"id":"6561d5428149e3b8a348","type":"judge","category":"judge","stem":"公民、法人或者其他组织已经申请行政复议，在法定复议期间内又向人民法院提起诉讼的，人民法院可以受理（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第三十四条 法律、法规未规定行政复议为提起行政诉讼必经程序，公民、法人或者其他组织既提起诉讼又申请行政复议的，由先受理的机关管辖；同时受理的，由公民、法人或者其他组织选择。公民、法人或者其他组织已经申请行政复议，在法定复议期间内又向人民法院提起诉讼的，人民法院不予受理。","material":"","sources":["判断题·507（段落8871）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1161},{"id":"192a8cdb261125e6cdfb","type":"judge","category":"judge","stem":"被告改变原行政行为，原告不撤诉，人民法院经审查应当判决驳回原告的诉讼请求（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第五十条 被告在一审期间改变被诉具体行政行为的，应当书面告知人民法院。\n原告或者第三人对改变后的行为不服提起诉讼的，人民法院应当就改变后的具体行政行为进行审理。\n被告改变原具体行政行为，原告不撤诉，人民法院经审查认为原具体行政行为违法的，应当作出确认其违法的判决；认为原具体行政行为合法的，应当判决驳回原告的诉讼请求。\n原告起诉被告不作为，在诉讼中被告作出具体行政行为，原告不撤诉的，参照上述规定处理。","material":"","sources":["判断题·520（段落9008）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1174},{"id":"c934c079ec11b01d7b72","type":"judge","category":"judge","stem":"当事人对第二审人民法院裁定发回原审人民法院重新审理行政案件的判决不服的，不得上诉（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据2000年最高人民法院关于执行《中华人民共和国行政诉讼法》若干问题的解释，第七十六条 人民法院按照审判监督程序再审的案件，发生法律效力的判决、裁定是由第一审人民法院作出的，按照第一审程序审理，所作的判决、裁定，当事人可以上诉；发生法律效力的判决、裁定是由第二审人民法院作出的，按照第二审程序审理，所作的判决、裁定是发生法律效力的判决、裁定；上级人民法院按照审判监督程序提审的，按照第二审程序审理，所作的判决、裁定是发生法律效力的判决、裁定。\n人民法院审理再审案件，应当另行组成合议庭。","material":"","sources":["判断题·531（段落9081）"],"warnings":["解析引用较早文件，请结合本次考试指定范围核对。"],"number":1185},{"id":"46568bad6402b2951744","type":"judge","category":"judge","stem":"行政机关依法行使职权是行政诉讼法目的之一。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第一条　为保证人民法院公正、及时审理行政案件，解决行政争议，保护公民、法人和其他组织的合法权益，监督行政机关依法行使行政职权，根据宪法，制定本法。","material":"","sources":["判断题·533（段落9092）"],"warnings":[],"number":1187},{"id":"d24b3fbb1ce8227c0c5b","type":"judge","category":"judge","stem":"被诉行政机关主要负责人应当出庭应诉。不能出庭的，应当委托行政机关相应的工作人员出庭。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第三条 人民法院应当保障公民、法人和其他组织的起诉权利，对应当受理的行政案件依法受理。\n行政机关及其工作人员不得干预、阻碍人民法院受理行政案件。\n被诉行政机关负责人应当出庭应诉。不能出庭的，应当委托行政机关相应的工作人员出庭。","material":"","sources":["判断题·537（段落9114）"],"warnings":[],"number":1191},{"id":"0c851f8c3cbcefce0cdd","type":"judge","category":"judge","stem":"人民法院可以对不通晓当地民族通用的语言、文字的诉讼参与人提供翻译。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第九条　各民族公民都有用本民族语言、文字进行行政诉讼的权利。\n在少数民族聚居或者多民族共同居住的地区，人民法院应当用当地民族通用的语言、文字进行审理和发布法律文书。\n人民法院应当对不通晓当地民族通用的语言、文字的诉讼参与人提供翻译。","material":"","sources":["判断题·541（段落9139）"],"warnings":[],"number":1195},{"id":"29774e32fd54fe193f04","type":"judge","category":"judge","stem":"电子数据不是行政诉讼合法证据。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第三十三条　证据包括：(一)书证;(二)物证;(三)视听资料;(四)电子数据(五)证人证言;(六)当事人的陈述;(七)鉴定意见;(八)勘验笔录、现场笔录。\n以上证据经法庭审查属实，才能作为认定案件事实的根据。","material":"","sources":["判断题·554（段落9229）"],"warnings":[],"number":1208},{"id":"986b14ac43db8871baab","type":"judge","category":"judge","stem":"原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，可免除被告的举证责任。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第三十七条　原告可以提供证明行政行为违法的证据。原告提供的证据不成立的，不免除被告的举证责任。","material":"","sources":["判断题·556（段落9241）"],"warnings":[],"number":1210},{"id":"593438cc907b5ce752cb","type":"judge","category":"judge","stem":"在证据可能灭失或者以后难以取得的情况下，诉讼参加人可以向人民法院申请保全证据，人民法院不可以主动采取保全措施。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第四十二条　在证据可能灭失或者以后难以取得的情况下，诉讼参加人可以向人民法院申请保全证据，人民法院也可以主动采取保全措施。","material":"","sources":["判断题·559（段落9259）"],"warnings":[],"number":1213},{"id":"7eaec472f754c1d0e078","type":"judge","category":"judge","stem":"人民法院在接到起诉状时对符合本法规定的起诉条件的，应当审查立案。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第五十一条　人民法院在接到起诉状时对符合本法规定的起诉条件的，应当登记立案。","material":"","sources":["判断题·571（段落9339）"],"warnings":[],"number":1221},{"id":"e7fef930c33ac3913bf8","type":"judge","category":"judge","stem":"公民、法人或者其他组织认为行政行为所依据的国务院部门和地方人民政府及其部门制定的规章规范性文件不合法，在对行政行为提起诉讼时，可以一并请求对该规章等规范性文件进行审查。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第五十三条 公民、法人或者其他组织认为行政行为所依据的国务院部门和地方人民政府及其部门制定的规范性文件不合法，在对行政行为提起诉讼时，可以一并请求对该规范性文件进行审查。","material":"","sources":["判断题·575（段落9365）"],"warnings":[],"number":1225},{"id":"087f2607390dc24ed01f","type":"judge","category":"judge","stem":"当事人对停止执行或者不停止执行的裁定不服的，可以申请复议两次。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第五十六条　诉讼期间，不停止行政行为的执行。但有下列情形之一的，裁定停止执行：\n(一)被告认为需要停止执行的;\n(二)原告或者利害关系人申请停止执行，人民法院认为该行政行为的执行会造成难以弥补的损失，并且停止执行不损害国家利益、社会公共利益的;\n(三)人民法院认为该行政行为的执行会给国家利益、社会公共利益造成重大损害的;\n(四)法律、法规规定停止执行的。\n当事人对停止执行或者不停止执行的裁定不服的，可以申请复议一次。","material":"","sources":["判断题·579（段落9394）"],"warnings":[],"number":1229},{"id":"17c501ecdda15cb16545","type":"judge","category":"judge","stem":"行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决维持原行政行为。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第六十九条 行政行为证据确凿，适用法律、法规正确，符合法定程序的，或者原告申请被告履行法定职责或者给付义务理由不成立的，人民法院判决驳回原告的诉讼请求。","material":"","sources":["判断题·592（段落9473）"],"warnings":[],"number":1241},{"id":"a5a79622f80072eca054","type":"judge","category":"judge","stem":"人民法院判决变更，可加重原告的义务或者减损原告的权益。但利害关系人同为原告，且诉讼请求相反的除外。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第七十七条 行政处罚明显不当，或者其他行政行为涉及对款额的确定、认定确有错误的，人民法院可以判决变更。\n人民法院判决变更，不得加重原告的义务或者减损原告的权益。但利害关系人同为原告，且诉讼请求相反的除外。","material":"","sources":["判断题·600（段落9532）"],"warnings":[],"number":1249},{"id":"6456101d67061a8c08da","type":"judge","category":"judge","stem":"原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院可以再次发回重审。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第八十九条　人民法院审上诉案件，按照下列情形，分别处理：\n(一)原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定;\n(二)原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更;\n(三)原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判。\n(四)原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。","material":"","sources":["判断题·608（段落9585）"],"warnings":[],"number":1257},{"id":"8f4a6bac0ce773aa45f3","type":"judge","category":"judge","stem":"当事人对重审案件的判决、裁定，不可以上诉。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第八十九条　人民法院审上诉案件，按照下列情形，分别处理：\n(一)原判决、裁定认定事实清楚，适用法律、法规正确的，判决或者裁定驳回上诉，维持原判决、裁定;\n(二)原判决、裁定认定事实错误或者适用法律、法规错误的，依法改判、撤销或者变更;\n(三)原判决认定基本事实不清、证据不足的，发回原审人民法院重审，或者查清事实后改判。\n(四)原判决遗漏当事人或者违法缺席判决等严重违反法定程序的，裁定撤销原判决，发回原审人民法院重审。\n原审人民法院对发回重审的案件作出判决后，当事人提起上诉的，第二审人民法院不得再次发回重审。\n人民法院审理上诉案件，需要改变原审判决的，应当同时对被诉行政行为作出判决。","material":"","sources":["判断题·614（段落9644）"],"warnings":[],"number":1262},{"id":"177bb61ca4eaeaee84fd","type":"judge","category":"judge","stem":"当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向原审人民法院或者上一级人民法院提出申诉，判决、裁定停止执行。（）","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"依据《行政诉讼法》，第九十条　当事人对已经发生法律效力的判决、裁定，认为确有错误的，可以向上一级人民法院申请再审，但判决、裁定不停止执行。","material":"","sources":["判断题·615（段落9655）"],"warnings":[],"number":1263},{"id":"16cec7563a09c850e712","type":"judge","category":"judge","stem":"因发生发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无照料状态的，被監护入住所地的居民委员会、村民委员会或者民政部门可以为被监护人安排必要的临时生活照料措施。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·1（段落13497）"],"warnings":[],"number":1942},{"id":"fa2ef043834f9e287139","type":"judge","category":"judge","stem":"居住权自约定时成立。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·2（段落13501）"],"warnings":[],"number":1943},{"id":"50e42f0ceddf08802952","type":"judge","category":"judge","stem":"居住权期限届满或者居住权人死亡的，居住权消灭，无需办理注销登记","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·3（段落13505）"],"warnings":[],"number":1944},{"id":"85ad7427397d34bd99ff","type":"judge","category":"judge","stem":"机关法人被撤销的，法人终止，其民事权利和义务随之消灭。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·8（段落13525）"],"warnings":[],"number":1949},{"id":"eab4b1d7f3fed5b9ae6b","type":"judge","category":"judge","stem":"流转期限为五年以上的土地经营权，自流合同生效时设立，可以对抗善意第三人.","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·9（段落13529）"],"warnings":[],"number":1950},{"id":"eac461c175674db886fc","type":"judge","category":"judge","stem":"为依法履行职责，国家机关在必要范围内制作、使用、公开肖像权人的肖像必须经得肖像权人同意。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·16（段落13557）"],"warnings":[],"number":1957},{"id":"4cfe6fb4852bc244d9a9","type":"judge","category":"judge","stem":"无配偶者收养异性子女的，收养人与被收养人的年应当相差四十岁以上。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·21（段落13577）"],"warnings":[],"number":1962},{"id":"3c3ff1f5d5a00336472b","type":"judge","category":"judge","stem":"收养关系当事人应当签订收养协议。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"中华人民共和国民法典","material":"","sources":["民法典判断·23（段落13585）"],"warnings":[],"number":1964},{"id":"b3440826a08d53f0f764","type":"judge","category":"judge","stem":"因发生突发事件等紧急情况，监护人暂时无法履行监护职责，被监护人的生活处于无人照料状态的，被监护人住所地的居民委员会、村民委员会或者民政部门应当为被监护人安排必要的临时生活照料措施。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["民法典判断·30（段落13608）"],"warnings":[],"number":1971},{"id":"dcc328bae70a63e21725","type":"judge","category":"judge","stem":"流转期限为五年以上的土地经营权，自流转合同生效时设立，可以对抗善意第三人。","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["民法典判断·38（段落13632）"],"warnings":[],"number":1979},{"id":"1231a62b2321e06e12c6","type":"judge","category":"judge","stem":"责令改正是一种行政处罚措施","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·2"],"warnings":[],"number":1984},{"id":"eafdb3b45291f22fdbe9","type":"judge","category":"judge","stem":"通报批评不是一种行政处罚措施","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·4"],"warnings":[],"number":1986},{"id":"023773fd081467b75d57","type":"judge","category":"judge","stem":"法律、法规可以规定的其他行政处罚措施","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·5"],"warnings":[],"number":1987},{"id":"6bb561d37a4826a9fa7a","type":"judge","category":"judge","stem":"行政法规不可以规定限制人身自由的行政处罚","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·7"],"warnings":[],"number":1989},{"id":"82ca7b24ecc2d3ff5208","type":"judge","category":"judge","stem":"尚未制定法律、法规的，国务院部门规章对违反行政管理秩序的行为，可以设定警告、\n通报批评或者一定数额罚款的行政处罚。罚款的限额由国务院规定","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·11"],"warnings":[],"number":1993},{"id":"96743d4d0b33ebeacbb4","type":"judge","category":"judge","stem":"限制人身自由的行政处罚权只能由公安机关行使","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·15"],"warnings":[],"number":1997},{"id":"cfc674e710a5f24739fb","type":"judge","category":"judge","stem":"法律、法规、规章授权的具有管理公共事务职能的组织可以在法定授权范围内实施\n行政处罚","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·16"],"warnings":[],"number":1998},{"id":"95c854247dca3e6b8e1a","type":"judge","category":"judge","stem":"依照法律、法规、规章规定，行政机关可以委托其个人实施行政处罚","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·17"],"warnings":[],"number":1999},{"id":"e3f85cb043b9d3c1527c","type":"judge","category":"judge","stem":"设区的市人民政府根据当地实际情况，可以决定将基层管理迫切需要的县级人民政府部门的行政处罚权交由能够有效承接的乡镇人民政府、街道办事处行使，并定期组织评估","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·21"],"warnings":[],"number":2003},{"id":"300b565fcb97668ffc19","type":"judge","category":"judge","stem":"对管辖发生争议的，应当协商解决，协商不成的，报请共同的上级行政机关指定管辖，也可以直接由共同的上一级行政机关指定管辖","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·22"],"warnings":[],"number":2004},{"id":"221da7a98345d82effb9","type":"judge","category":"judge","stem":"行政机关因实施行政处罚的需要，可以向有关机关提出协助请求，协助事项属于被请求机关职权范围内的，可以依法予以协助","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·23"],"warnings":[],"number":2005},{"id":"7b4ce48ff936fc2eeb69","type":"judge","category":"judge","stem":"行政机关实施行政处罚时，可以责令当事人改正或者限期改正违法行为","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·25"],"warnings":[],"number":2007},{"id":"e007b5ab19b67b9adb39","type":"judge","category":"judge","stem":"违法行为轻微并及时改正，没有造成危害后果的，可以不予行政处罚","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·27"],"warnings":[],"number":2009},{"id":"52a78610e806831cdde6","type":"judge","category":"judge","stem":"实施行政处罚，适用违法行为发生时的法律、法规、规章的规定。但是，作出行政处\n罚决定时，法律、法规、规章已被修改或者废止，且新的规定处罚较轻或者不认为是违法的，适用旧的规定","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·34"],"warnings":[],"number":2016},{"id":"6f03f74a7994c3b1de40","type":"judge","category":"judge","stem":"公民、法人或者其他组织违反行政管理秩序的行为，依法应当给予行政处罚的，行政\n机关可以查明事实，违法事实不清、证据不足的，不得给予行政处罚","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·37"],"warnings":[],"number":2019},{"id":"91002fc20ca74d3141af","type":"judge","category":"judge","stem":"电子技术监控设备记录违法事实，可以作为行政处罚的证据","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·39"],"warnings":[],"number":2021},{"id":"acaa823921a5578e3acc","type":"judge","category":"judge","stem":"行政处罚决定应当公开","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·44"],"warnings":[],"number":2026},{"id":"e04bb9db85ba43b9718d","type":"judge","category":"judge","stem":"行政机关及其工作人员对实施行政处罚过程中知悉的国家秘密、商业秘密或者个人信息，\n应对依法予以保密","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·47"],"warnings":[],"number":2029},{"id":"bfa9966146b8d463b9ef","type":"judge","category":"judge","stem":"执法人员在调查或者进行检查时，可以向当事人或者有关人员出示执法证件","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·50"],"warnings":[],"number":2032},{"id":"acd5f9b116d4c5af0a8b","type":"judge","category":"judge","stem":"行政机关在收集证据时，可以采取抽样取证的方法；在证据可能灭失或者以后难以取得\n的情况下，经行政机关主要负责人批准，可以先行登记保存，并应当在七日内及时作出处理决定，在此期间，当事人或者有关人员不得销毁或者转移证据","options":[{"key":"T","text":"正确"},{"key":"F","text":"错误"}],"answer":["F"],"explanation":"","material":"","sources":["补充判断·52"],"warnings":[],"number":2034},{"id":"b9bb593566d2983f5ba5","type":"judge","category":"judge","stem":"违法涉及金额巨大的，在行政机关负责人作出行政处罚的决定之前，应当由从事行政\n处罚决定法制审核的人员进行法制审核，未经法制审核或者审核未通过的，不得作出\n决定","optio
